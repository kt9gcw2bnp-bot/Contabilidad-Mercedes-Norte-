function jsonp(url){ return new Promise(res=>{ const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e5); const s=document.createElement('script');
  window[cb]=d=>{ res(d); delete window[cb]; s.remove(); }; s.onerror=()=>{ res({rows:[]}); delete window[cb]; s.remove(); };
  s.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+cb; document.body.appendChild(s);
  setTimeout(()=>{ if(window[cb]){ res({rows:[]}); delete window[cb]; s.remove(); } },12000); }); }
function sheetGet(n){ return jsonp(SHEET_API_URL+'?sheet='+encodeURIComponent(n)).then(d=>(d&&d.rows)?d.rows:[]); }
function sheetPost(n,row){ // contrato JSON del doPost: {sheet,row:[...]}, Content-Type text/plain
  return fetch(SHEET_API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({sheet:n,row:Object.keys(row).map(k=>row[k])}),keepalive:true}).catch(()=>{}); }
const now=()=>new Date().toISOString();
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function postData(tipo,obj,who){ return sheetPost(SH_DATA,{Timestamp:now(),CasoId:MODULE_ID+'_'+tipo,Nombre:who||student.name,Texto:JSON.stringify(obj)}); }
function postProg(key,score,total){ return sheetPost(SH_PROG,{Timestamp:now(),Estudiante:student.name,Modulo:MODULE_ID+'_'+key+'_paso',Score:String(score),Total:String(total)}); }
function parseRows(rows){ return rows.filter(r=>String(r.CasoId||'').indexOf(MODULE_ID+'_')===0).map(r=>{ let o={}; try{ o=JSON.parse(r.Texto); }catch(e){} return {tipo:String(r.CasoId).slice(MODULE_ID.length+1),nombre:String(r.Nombre||'').trim(),ts:String(r.Timestamp||''),d:o}; }).sort((a,b)=>a.ts<b.ts?-1:1); }

/* ================= ESTADO ================= */
let student={name:'',sec:''}, allRows=[], S={}, current='conceptos';
function cut(name){ let t=''; allRows.forEach(r=>{ if(r.tipo==='reset'&&norm(r.d.nombre)===norm(name)&&r.ts>t) t=r.ts; }); return t; }
function derive(){
  const c=cut(student.name); const mine=allRows.filter(r=>norm(r.nombre)===norm(student.name)&&r.ts>c);
  S={done:{},dec:{},clasif:null,comite:null,papeleta:null,voto:null,propia:'',reflex:null};
  mine.forEach(r=>{ const d=r.d;
    if(r.tipo==='paso') S.done[d.key]=true;
    if(r.tipo==='dec'&&S.dec[d.esc]===undefined) S.dec[d.esc]=d.op;      // bloqueo: vale la primera decisión
    if(r.tipo==='clasif'&&!S.clasif) S.clasif=d;
    if(r.tipo==='comite'&&!S.comite) S.comite=d;
    if(r.tipo==='papeleta'&&!S.papeleta) S.papeleta=d;
    if(r.tipo==='voto'&&!S.voto) S.voto=d;
    if(r.tipo==='reflex'&&!S.reflex) S.reflex=d; });
}
function load(){ return sheetGet(SH_DATA).then(r=>{ allRows=parseRows(r); derive(); }); }
function markStep(key,score,total){ if(S.done[key]) return; S.done[key]=true; postData('paso',{key:key}); postProg(key,score,total); }
function unlocked(k){ const i=STEPS.findIndex(s=>s.key===k); return i===0||!!S.done[STEPS[i-1].key]; }
function puntos(){ return ESCENAS.reduce((a,e)=>a+(S.dec[e.id]!==undefined?e.op[S.dec[e.id]].v:0),0); }
function perfil(p){ if(p>=7) return {ic:"🌱",t:"Agente de cambio",d:"Usted actuó para transformar las situaciones de desigualdad, aunque no siempre fuera lo más cómodo. Así se construye una cultura de equidad en una empresa."};
  if(p>=2) return {ic:"🧭",t:"En construcción",d:"Reconoce las situaciones injustas, pero a veces prefirió no intervenir. Recuerde: el silencio también es una decisión y suele mantener las cosas como están."};
  return {ic:"🔁",t:"Reproduce la desigualdad",d:"Varias de sus decisiones mantuvieron o reforzaron la discriminación. Revise las consecuencias y los artículos de la CEDAW: cada situación tenía una salida más justa."}; }

/* ================= MONITOREO ================= */
document.addEventListener('visibilitychange',()=>{ if(!document.hidden||!student.name) return;
  sheetPost(SH_PROG,{Timestamp:now(),Estudiante:student.name,Modulo:'incidente_salida_pantalla_'+MODULE_ID,Score:'salida',Total:'1'});
  const b=document.getElementById('banner'); b.style.display='block'; setTimeout(()=>b.style.display='none',6000); });

/* ================= UI BASE ================= */
const $=id=>document.getElementById(id);
function nombrePortal(){ try{ return (new URLSearchParams(location.search).get('nombre')||'').trim()||null; }catch(e){ return null; } }
function portada(){

  <h2 style="margin-top:10px">Tu primer año como contador o contadora</h2>
  <p>Acaba de conseguir su primer trabajo en una firma contable. Durante el año vivirá situaciones reales de equidad y discriminación por género. <b>No hay vuelta atrás:</b> cada decisión cambia la historia y queda registrada.</p>
  <div class="row" style="gap:6px;margin:6px 0 12px">${STEPS.map((s,i)=>`<span class="pill">${i+1}. ${s.label}</span>`).join('')}</div>
  <div class="grid2"><div><label>Nombre completo</label><input type="text" id="inNom" ${np?'readonly':''} value="${np?esc(np):''}" placeholder="Nombre y apellidos"></div>
  <div><label>Sección</label><select id="inSec"><option value="">Seleccione…</option>${SECCIONES.map(s=>`<option>${s}</option>`).join('')}</select></div></div>

  $('btnIn').onclick=()=>{ const n=$('inNom').value.trim(), s=$('inSec').value;
    if(n.split(/\s+/).length<2){ $('msgIn').innerHTML='<span class="err">Escriba nombre y apellido.</span>'; return; }

    student={name:n,sec:s}; $('msgIn').textContent='Cargando…';

function render(){
  $('who').innerHTML=esc(student.name)+'<br>'+esc(student.sec);
  $('app').innerHTML=`<div class="steps">${STEPS.map((s,i)=>`<div class="st ${S.done[s.key]?'done':''} ${current===s.key?'cur':''} ${unlocked(s.key)?'':'lock'}" data-k="${s.key}"><div class="n">PARTE ${i+1}</div><div class="t">${s.label}</div></div>`).join('')}</div><div id="stage"></div>`;
  document.querySelectorAll('.st').forEach(el=>el.onclick=()=>{ if(!unlocked(el.dataset.k)) return; current=el.dataset.k; render(); });
  ({conceptos:stConceptos,historia:stHistoria,comite:stComite,asamblea:stAsamblea,cierre:stCierre})[current]($('stage'));
  window.scrollTo(0,0);
}
function next(){ const i=STEPS.findIndex(s=>s.key===current); current=STEPS[Math.min(i+1,STEPS.length-1)].key; render(); }
const nextBtn=(t)=>`<button class="btn gold" id="goNext" style="margin-top:10px">${t||'Continuar →'}</button>`;

/* ================= PARTE 1 ================= */
function stConceptos(el){
  el.innerHTML=`<div class="card"><h2>Conceptos clave</h2><p class="mut">Toque cada tarjeta para ver su significado. Debe abrir todas antes del reto.</p>
  <div class="flips">${GLOSARIO.map((g,i)=>`<div class="flip" data-i="${i}"><div class="in"><div class="f">${g[0]}<small>toque para girar</small></div><div class="b"><b style="color:var(--vio)">${g[0]}</b>${g[1]}</div></div></div>`).join('')}</div></div>
  <div class="card" id="cls"></div>`;
  const seen=new Set();
  el.querySelectorAll('.flip').forEach(f=>f.onclick=()=>{ f.classList.toggle('on'); seen.add(f.dataset.i); cls(); });
  function cls(){
    const box=$('cls');
    if(S.clasif){ box.innerHTML=`<h3 style="margin-top:0">Reto: ¿igualdad o equidad?</h3><div class="tip"><span class="ok">✓ Reto completado:</span> ${S.clasif.ok} de ${CLASIF.length} correctas.</div>${nextBtn()}`; $('goNext').onclick=next; return; }
    if(seen.size<GLOSARIO.length&&!S.done.conceptos){ box.innerHTML=`<h3 style="margin-top:0">Reto: ¿igualdad o equidad?</h3><p class="mut">Tarjetas abiertas: ${seen.size} / ${GLOSARIO.length}</p>`; return; }
    const ans={};
    box.innerHTML=`<h3 style="margin-top:0">Reto: ¿igualdad o equidad?</h3><p class="mut">Clasifique cada situación. Solo tiene un intento.</p>
    ${CLASIF.map((c,i)=>`<div class="caso"><div class="q">${i+1}. ${c.t}</div><div class="seg" data-i="${i}"><button data-v="Igualdad">Igualdad</button><button data-v="Equidad">Equidad</button></div><div class="fbx"></div></div>`).join('')}
    <button class="btn gold" id="clsOk">Comprobar</button><span id="clsMsg"></span>`;
    box.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ ans[sg.dataset.i]=b.dataset.v; sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); }));
    $('clsOk').onclick=()=>{
      if(Object.keys(ans).length<CLASIF.length){ $('clsMsg').innerHTML=' <span class="err">Responda todas.</span>'; return; }
      let ok=0; box.querySelectorAll('.caso').forEach((cs,i)=>{ const good=ans[i]===CLASIF[i].r; if(good) ok++; cs.querySelector('.fbx').innerHTML=`<div class="fb ${good?'ok2':'no2'}">${good?'✓ Correcto':'✗ Era: '+CLASIF[i].r}. ${CLASIF[i].r==='Equidad'?'Se da un apoyo diferente según la necesidad.':'Se da el mismo trato a todas las personas.'}</div>`; cs.querySelectorAll('button').forEach(b=>b.disabled=true); });
      S.clasif={ok:ok,resp:ans}; postData('clasif',S.clasif); markStep('conceptos',ok,CLASIF.length);
      $('clsOk').remove(); $('clsMsg').outerHTML=`<div class="tip"><b>${ok} de ${CLASIF.length}</b> correctas. Recuerde: la equidad es el camino para llegar a la igualdad.</div>`+nextBtn(); $('goNext').onclick=next; };
  }
  cls();
}

/* ================= PARTE 2: HISTORIA ================= */
function stHistoria(el){
  const idx=ESCENAS.findIndex(e=>S.dec[e.id]===undefined); const p=puntos(); const maxp=ESCENAS.length*2;
  const eqW=Math.max(4,Math.round((p+maxp)/(2*maxp)*100));
  let html=`<div class="meters"><div class="meter"><div class="l"><span>Equidad en la empresa</span><span>${ESCENAS.filter(e=>S.dec[e.id]!==undefined).length} / ${ESCENAS.length} decisiones</span></div><div class="trk"><div class="fil" style="width:${eqW}%;background:linear-gradient(90deg,#c0392b,#e3b94a,#2FC2AD)"></div></div></div></div>`;
  ESCENAS.forEach((e,i)=>{ if(S.dec[e.id]===undefined) return; const o=e.op[S.dec[e.id]];
    html+=`<details class="card" style="padding:12px 16px"><summary style="cursor:pointer;font-weight:600;color:var(--navy)">${e.k} · ${e.t} <span class="pill ${o.v>0?'teal':o.v<0?'':'gold'}">${o.v>0?'Equitativa':o.v<0?'Reproduce':'Neutral'}</span></summary><p class="mut" style="margin-top:8px"><b>Su decisión:</b> ${esc(o.t)}</p><p class="mut">${o.c}</p><span class="law">${o.ley}</span></details>`; });
  if(idx>-1){ const e=ESCENAS[idx]; const orden=[0,1,2];
    html+=`<div class="scene"><div class="hd"><div class="k">${e.k}</div><h3>${e.t}</h3></div><div class="bd"><p>${e.txt}</p><div class="dialog">${e.dlg}</div><p><b>¿Qué hace usted?</b></p>
    ${orden.map(j=>`<button class="opt" data-j="${j}"><b>${'ABC'[j]}</b>${esc(e.op[j].t)}</button>`).join('')}<div id="conse"></div></div></div>`;
  } else {
    html+=`<div class="card"><h3 style="margin-top:0">Terminó su primer año</h3><p>Su recorrido quedó registrado. Antes de ver su perfil, pase por el Comité CEDAW.</p>${nextBtn('Ir al Comité CEDAW →')}</div>`;
  }
  el.innerHTML=html;
  if(idx===-1){ markStep('historia',p,maxp); $('goNext').onclick=next; return; }
  const e=ESCENAS[idx];
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(S.dec[e.id]!==undefined) return;
    const j=+b.dataset.j; S.dec[e.id]=j; postData('dec',{esc:e.id,op:j,v:e.op[j].v,sec:student.sec});
    el.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; x.classList.toggle('sel',x===b); });
    const o=e.op[j]; const cls=o.v>0?'pos':o.v<0?'neg':'neu';
    $('conse').innerHTML=`<div class="conse ${cls}"><b>Consecuencia:</b> ${o.c}<br><span class="law">${o.ley}</span></div><button class="btn gold" id="goScene" style="margin-top:12px">${idx<ESCENAS.length-1?'Siguiente situación →':'Terminar el año →'}</button>`;
    $('goScene').onclick=()=>stHistoria(el);
  });
}

/* ================= PARTE 3: COMITÉ ================= */
function stComite(el){
  const ans={};
  el.innerHTML=`<div class="card"><h2>Comité CEDAW</h2>
  <div class="din">Usted integra el comité que revisa denuncias. En cada caso decida si hay <b>discriminación</b> y cuál artículo de la <b>CEDAW</b> (Convención para la Eliminación de todas las Formas de Discriminación contra la Mujer) lo fundamenta. Un solo intento.</div>
  <details class="tip"><summary style="cursor:pointer;font-weight:600">📘 Artículos de consulta</summary><ul style="margin:6px 0 0 0;padding-left:18px">
   <li><b>Art. 1:</b> define la discriminación contra la mujer (distinción por sexo que limita derechos).</li>
   <li><b>Art. 4:</b> las medidas especiales temporales para acelerar la igualdad <u>no</u> son discriminación.</li>
   <li><b>Art. 5:</b> eliminar estereotipos; la crianza es responsabilidad común.</li>
   <li><b>Art. 7:</b> participación en la vida política y pública.</li>
   <li><b>Art. 10:</b> igualdad en la educación y eliminación de estereotipos en los materiales.</li>
   <li><b>Art. 11.1.d:</b> igual remuneración por trabajo de igual valor. <b>Art. 11.2.a:</b> prohibido el despido por embarazo.</li></ul></details>
  ${CASOS.map((c,i)=>`<div class="caso" data-i="${i}"><div class="q">Caso ${i+1}. ${c.t}</div>
   <div class="seg" data-f="r"><button data-v="D">Hay discriminación</button><button data-v="N">No es discriminación</button></div>
   <div class="seg" data-f="a">${c.ops.map(a=>`<button data-v="${a}">${a}</button>`).join('')}</div><div class="fbx"></div></div>`).join('')}
  <button class="btn gold" id="cmOk">Enviar dictamen</button><span id="cmMsg"></span><div id="cmOut"></div></div>`;
  el.querySelectorAll('.caso').forEach(cs=>{ const i=cs.dataset.i; ans[i]={};
    cs.querySelectorAll('.seg').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ ans[i][sg.dataset.f]=b.dataset.v; sg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); })); });
  function show(res){
    let ok=0; el.querySelectorAll('.caso').forEach((cs,i)=>{ const a=res[i]||{}, c=CASOS[i]; const g=a.r===c.r&&a.a===c.a; if(g) ok++;
      cs.querySelectorAll('.seg button').forEach(b=>{ b.disabled=true; b.classList.toggle('on',b.dataset.v===a.r||b.dataset.v===a.a); });
      cs.querySelector('.fbx').innerHTML=`<div class="fb ${g?'ok2':'no2'}">${g?'✓ Dictamen correcto.':'✗ Respuesta: '+(c.r==='D'?'hay discriminación':'no es discriminación')+' · '+c.a+'.'} ${c.e}</div>`; });
    return ok;
  }
  if(S.comite){ const ok=show(S.comite.resp); $('cmOk').remove(); $('cmOut').innerHTML=`<div class="tip">Dictamen enviado: <b>${ok} de ${CASOS.length}</b> casos correctos.</div>`+nextBtn(); $('goNext').onclick=next; return; }
  $('cmOk').onclick=()=>{
    if(Object.values(ans).some(a=>!a.r||!a.a)){ $('cmMsg').innerHTML=' <span class="err">Complete las dos decisiones en todos los casos.</span>'; return; }
    const ok=show(ans); S.comite={resp:ans,ok:ok}; postData('comite',S.comite); markStep('comite',ok,CASOS.length);
    $('cmOk').remove(); $('cmMsg').remove(); $('cmOut').innerHTML=`<div class="tip">Dictamen enviado: <b>${ok} de ${CASOS.length}</b> casos correctos.</div>`+nextBtn(); $('goNext').onclick=next; };
}

/* ================= PARTE 4: ASAMBLEA ================= */
function stAsamblea(el){
  el.innerHTML=`<div class="card"><h2>Asamblea paritaria</h2>
  <div class="din"><b>Participación paritaria:</b> que mujeres y hombres ocupen en igual proporción (50 %) los espacios de decisión. En Costa Rica el Código Electoral exige <b>paridad y alternancia</b>: en las listas de candidaturas se intercala mujer–hombre (o hombre–mujer), para que nadie quede siempre en los últimos lugares.</div>
  <h3>A. Arme una papeleta paritaria para el gobierno estudiantil</h3><p class="mut">Toque las candidaturas en el orden en que irán en la lista (6 puestos). Debe respetar la alternancia.</p>
  <div class="cands" id="cands"></div><div class="slots" id="slots"></div>
  <div class="row"><button class="btn ghost sm" id="ppUndo">Deshacer</button><button class="btn gold sm" id="ppOk">Validar papeleta</button><span id="ppMsg"></span></div>
  <label>¿Por qué es importante la alternancia y no solo tener 3 mujeres y 3 hombres?</label><textarea id="ppPq" rows="2" maxlength="400"></textarea></div>
  <div class="card"><h3 style="margin-top:0">B. Empoderamiento colectivo</h3><p class="mut">El empoderamiento no es solo individual: crece cuando un grupo se organiza y ejerce liderazgo. Vote por la propuesta que su sección debería impulsar y escriba una propia.</p>
  <div id="props"></div><label>Su propuesta de empoderamiento colectivo (qué, quiénes y cómo)</label><textarea id="pPropia" rows="2" maxlength="400"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn gold" id="vOk">Enviar a la asamblea</button><button class="btn ghost sm" id="vRef">↻ Ver resultados</button><span id="vMsg"></span></div>
  <div id="res" style="margin-top:12px"></div><div id="asOut"></div></div>`;
  let orden=S.papeleta?S.papeleta.orden.slice():[]; let pick=S.voto?S.voto.prop:-1; let ppOk=!!(S.papeleta&&S.papeleta.ok);
  function drawPP(){
    $('cands').innerHTML=CANDS.map((c,i)=>`<button class="cand ${c[1]} ${orden.indexOf(i)>-1?'used':''}" data-i="${i}">${c[1]==='m'?'♀':'♂'} ${c[0]}</button>`).join('');
    $('slots').innerHTML=[0,1,2,3,4,5].map(k=>`<div class="slot"><span class="p">${k+1}</span>${orden[k]!==undefined?(CANDS[orden[k]][1]==='m'?'♀ ':'♂ ')+CANDS[orden[k]][0]:'<span class="mut">—</span>'}</div>`).join('');
    if(S.papeleta){ $('cands').querySelectorAll('button').forEach(b=>b.disabled=true); ['ppUndo','ppOk'].forEach(i=>$(i).disabled=true); $('ppPq').value=S.papeleta.pq||''; $('ppPq').disabled=true;
      $('ppMsg').innerHTML=S.papeleta.ok?' <span class="ok">✓ Papeleta paritaria con alternancia.</span>':' <span class="err">La papeleta no respetó la alternancia.</span>'; return; }
    $('cands').querySelectorAll('button').forEach(b=>b.onclick=()=>{ if(orden.length<6){ orden.push(+b.dataset.i); drawPP(); } });
  }
  $('ppUndo').onclick=()=>{ orden.pop(); drawPP(); };
  $('ppOk').onclick=()=>{
    if(orden.length<6){ $('ppMsg').innerHTML=' <span class="err">Complete los 6 puestos.</span>'; return; }
    if($('ppPq').value.trim().length<15){ $('ppMsg').innerHTML=' <span class="err">Responda la pregunta.</span>'; return; }
    const g=orden.map(i=>CANDS[i][1]); ppOk=g.every((x,k)=>k===0||x!==g[k-1]);
    if(!ppOk){ $('ppMsg').innerHTML=' <span class="err">Hay dos personas del mismo sexo seguidas. Corrija el orden.</span>'; return; }
    S.papeleta={orden:orden,ok:true,pq:$('ppPq').value.trim()}; postData('papeleta',S.papeleta); drawPP(); fin(); };
  function drawProps(){

    $('props').querySelectorAll('.prop').forEach(d=>d.onclick=()=>{ pick=+d.dataset.i; drawProps(); });
  }
  function resultados(){
    const vs=allRows.filter(r=>r.tipo==='voto'&&r.d.sec===student.sec); const seen={}; vs.forEach(r=>seen[norm(r.nombre)]=r.d.prop);
    const cnt=[0,0,0,0]; Object.values(seen).forEach(i=>cnt[i]++); const tot=Math.max(1,cnt.reduce((a,b)=>a+b,0));

  }
  $('vOk').onclick=()=>{
    if(pick<0){ $('vMsg').innerHTML=' <span class="err">Elija una propuesta.</span>'; return; }
    if($('pPropia').value.trim().length<20){ $('vMsg').innerHTML=' <span class="err">Escriba su propuesta (qué, quiénes y cómo).</span>'; return; }
    S.voto={prop:pick,propia:$('pPropia').value.trim(),sec:student.sec}; postData('voto',S.voto); allRows.push({tipo:'voto',nombre:student.name,ts:now(),d:S.voto}); drawProps(); resultados(); fin(); };
  $('vRef').onclick=()=>load().then(resultados);

  drawPP(); drawProps(); if(S.voto) resultados(); fin();
}

/* ================= PARTE 5: CIERRE ================= */
function stCierre(el){
  const p=puntos(), pf=perfil(p);
  const n=v=>ESCENAS.filter(e=>S.dec[e.id]!==undefined&&e.op[S.dec[e.id]].v===v).length;
  el.innerHTML=`<div class="perfil"><div class="ic">${pf.ic}</div><div class="mut" style="color:#d6d0f7">Su perfil del primer año</div><h2>${pf.t}</h2><p style="max-width:620px;margin:6px auto 0">${pf.d}</p>
  <div class="row" style="justify-content:center;margin-top:12px"><span class="pill teal">${n(2)} equitativas</span><span class="pill gold">${n(0)} neutrales</span><span class="pill">${n(-1)+n(-2)} reproducen</span></div></div>
  <div class="card" style="margin-top:16px"><h3 style="margin-top:0">Reflexión final</h3>
  <label>¿Cuál decisión fue la más difícil y por qué?</label><textarea id="r1" rows="3" maxlength="600"></textarea>
  <label>¿Qué haría diferente en su futuro trabajo como contador o contadora?</label><textarea id="r2" rows="3" maxlength="600"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn gold" id="rOk">Enviar reflexión</button><span id="rMsg"></span></div><div id="rOut"></div></div>`;
  if(S.reflex){ $('r1').value=S.reflex.r1; $('r2').value=S.reflex.r2; ['r1','r2','rOk'].forEach(i=>$(i).disabled=true); $('rOut').innerHTML='<div class="tip"><span class="ok">✓ Curso completado.</span> Su perfil y su reflexión quedaron registrados para la plenaria.</div>'; return; }
  $('rOk').onclick=()=>{ if($('r1').value.trim().length<25||$('r2').value.trim().length<25){ $('rMsg').innerHTML=' <span class="err">Desarrolle un poco más sus respuestas.</span>'; return; }
    S.reflex={r1:$('r1').value.trim(),r2:$('r2').value.trim(),perfil:pf.t,puntos:p}; postData('reflex',S.reflex); markStep('cierre',p,ESCENAS.length*2); stCierre(el); };
}

/* ================= PANEL DOCENTE ================= */
function panel(){
  const pin=prompt('PIN del panel docente:'); if(pin!==TEACHER_PIN){ if(pin!==null) alert('PIN incorrecto.'); return; }
  $('app').innerHTML='<div class="card">Cargando…</div>';
  Promise.all([sheetGet(SH_DATA),sheetGet(SH_PROG)]).then(([r,p])=>{ allRows=parseRows(r); window.__prog=p; panelRender(SECCIONES[0]); });
}
function datosEst(nombre){ const c=cut(nombre); const mine=allRows.filter(r=>norm(r.nombre)===norm(nombre)&&r.ts>c); const o={dec:{},done:{}};
  mine.forEach(r=>{ if(r.tipo==='paso') o.done[r.d.key]=true; if(r.tipo==='dec'&&o.dec[r.d.esc]===undefined) o.dec[r.d.esc]=r.d.op; ['clasif','comite','papeleta','voto','reflex'].forEach(k=>{ if(r.tipo===k&&!o[k]) o[k]=r.d; }); }); return o; }
function sugerido(o){ const lv=(x,a,b)=>x>=a?3:x>=b?2:1; return {
  i1:o.clasif?lv(o.clasif.ok,6,4):0, i2:o.comite?lv(o.comite.ok,5,3):0, i3:o.papeleta?(o.papeleta.ok&&(o.papeleta.pq||'').length>=40?3:2):0, i4:o.voto?((o.voto.propia||'').length>=80?3:2):0 }; }
function evalDe(n){ return (allRows.filter(r=>r.tipo==='eval'&&norm(r.d.nombre)===norm(n)).pop()||{}).d||{niveles:{}}; }
function panelRender(sec){
  const nombres=[]; allRows.forEach(r=>{ if((r.tipo==='dec'||r.tipo==='voto')&&r.d.sec===sec&&nombres.map(norm).indexOf(norm(r.nombre))<0) nombres.push(r.nombre); });
  const salidas={}; (window.__prog||[]).forEach(r=>{ if(String(r.Modulo)==='incidente_salida_pantalla_'+MODULE_ID){ const k=norm(r.Estudiante); salidas[k]=(salidas[k]||0)+1; } });
  const dist={}; ESCENAS.forEach(e=>dist[e.id]=[0,0,0]); nombres.forEach(n=>{ const o=datosEst(n); Object.keys(o.dec).forEach(k=>dist[k][o.dec[k]]++); });
  $('who').textContent='Panel docente';
  $('app').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">Panel docente · Tus decisiones cuentan</h2><select id="pSec" style="width:auto;margin-left:auto">${SECCIONES.map(s=>`<option ${s===sec?'selected':''}>${s}</option>`).join('')}</select><button class="btn ghost sm" id="pOut">Salir</button></div></div>
  <div class="card"><h3 style="margin-top:0">📊 Rutas de la sección (para la plenaria)</h3>${ESCENAS.map(e=>{ const t=Math.max(1,dist[e.id].reduce((a,b)=>a+b,0)); return `<div style="margin:10px 0"><b>${e.k} · ${e.t}</b>${e.op.map((o,j)=>`<div class="row" style="margin-top:4px"><span class="pill ${o.v>0?'teal':o.v<0?'':'gold'}" style="min-width:26px">${'ABC'[j]}</span><div style="flex:1"><div class="mut" style="font-size:12px">${esc(o.t)}</div><div class="bar" style="width:${dist[e.id][j]/t*100}%;background:${o.v>0?'#2FC2AD':o.v<0?'#c0392b':'#e3b94a'}"></div></div><b>${dist[e.id][j]}</b></div>`).join('')}</div>`; }).join('')}</div>
  <div class="card"><h3 style="margin-top:0">Estudiantes y rúbrica (1–3) · RA 5</h3><p class="mut">El borde dorado indica el nivel sugerido según las respuestas; confirme con un clic.</p>
  <table class="tb"><tr><th>Estudiante</th><th>Avance</th><th>Perfil</th>${RUBRICA.map((c,i)=>`<th title="${esc(c.crit)}">Ind. ${i+1}</th>`).join('')}<th>Salidas</th><th></th></tr>
  ${nombres.map(n=>{ const o=datosEst(n), sg=sugerido(o), ev=evalDe(n); const p=ESCENAS.reduce((a,e)=>a+(o.dec[e.id]!==undefined?e.op[o.dec[e.id]].v:0),0);
    return `<tr><td><b>${esc(n)}</b></td><td>${STEPS.filter(s=>o.done[s.key]).length}/${STEPS.length}</td><td>${o.reflex?perfil(p).t:(Object.keys(o.dec).length+'/5 decisiones')}</td>
    ${RUBRICA.map(c=>`<td><div class="lv" data-n="${esc(n)}" data-c="${c.id}">${[1,2,3].map(k=>`<button class="${ev.niveles[c.id]==k?'on':''} ${sg[c.id]===k?'sug':''}" data-k="${k}">${k}</button>`).join('')}</div></td>`).join('')}
    <td>${salidas[norm(n)]||0}</td><td><button class="btn ghost sm" data-ver="${esc(n)}">Ver</button> <button class="btn ghost sm" data-reset="${esc(n)}">🔄</button></td></tr>`; }).join('')||'<tr><td colspan="9" class="mut">Sin datos en esta sección.</td></tr>'}</table>
  <details style="margin-top:10px"><summary class="mut" style="cursor:pointer">Ver criterios de la rúbrica</summary><table class="tb" style="margin-top:6px"><tr><th>Indicador</th><th>3 · Logrado</th><th>2 · En proceso</th><th>1 · No logrado</th></tr>${RUBRICA.map((c,i)=>`<tr><td><b>${i+1}.</b> ${c.crit}</td><td>${c.n3}</td><td>${c.n2}</td><td>${c.n1}</td></tr>`).join('')}</table></details></div>
  <div class="card" id="detalle"></div>`;
  document.querySelectorAll('.lv button').forEach(b=>b.onclick=()=>{ const box=b.parentElement, n=box.dataset.n; const ev=JSON.parse(JSON.stringify(evalDe(n))); ev.nombre=n; ev.niveles[box.dataset.c]=+b.dataset.k;
    postData('eval',ev,'DOCENTE'); allRows.push({tipo:'eval',nombre:'DOCENTE',ts:now(),d:ev}); box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    if(RUBRICA.every(c=>ev.niveles[c.id])){ const s=RUBRICA.reduce((a,c)=>a+ev.niveles[c.id],0);
      sheetPost(SH_PROG,{Timestamp:now(),Estudiante:n,Modulo:MODULE_ID+'_rubrica_paso',Score:String(s),Total:String(RUBRICA.length*3)});
      RUBRICA.forEach(c=>sheetPost(SH_PROG,{Timestamp:now(),Estudiante:n,Modulo:MODULE_ID+'_rubrica_ra_'+encodeURIComponent('RA5-'+c.id)+'_paso',Score:String(ev.niveles[c.id]),Total:'3'})); } });
  document.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>{ const n=b.dataset.ver, o=datosEst(n);
    $('detalle').innerHTML=`<h3 style="margin-top:0">${esc(n)}</h3>
    <p><b>Decisiones:</b></p>${ESCENAS.map(e=>o.dec[e.id]!==undefined?`<div class="mut">${e.k}: <b>${'ABC'[o.dec[e.id]]}</b> — ${esc(e.op[o.dec[e.id]].t)}</div>`:'').join('')}
    <p><b>Igualdad/equidad:</b> ${o.clasif?o.clasif.ok+'/6':'—'} · <b>Comité CEDAW:</b> ${o.comite?o.comite.ok+'/6':'—'} · <b>Papeleta:</b> ${o.papeleta?(o.papeleta.ok?'correcta':'incorrecta'):'—'}</p>
    <p><b>Por qué la alternancia:</b> ${esc(o.papeleta?o.papeleta.pq:'—')}</p>
    <p><b>Propuesta de empoderamiento:</b> ${esc(o.voto?o.voto.propia:'—')}</p>
    <p><b>Decisión más difícil:</b> ${esc(o.reflex?o.reflex.r1:'—')}</p><p><b>Qué haría diferente:</b> ${esc(o.reflex?o.reflex.r2:'—')}</p>`;
    $('detalle').scrollIntoView({behavior:'smooth'}); });
  document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{ const n=b.dataset.reset; if(!confirm('¿Reiniciar el curso para '+n+'? Deberá rehacer todas las partes.')) return;
    postData('reset',{nombre:n},'DOCENTE'); allRows.push({tipo:'reset',nombre:'DOCENTE',ts:now(),d:{nombre:n}}); alert('Reinicio registrado.'); panelRender(sec); });
  $('pSec').onchange=()=>panelRender($('pSec').value);
  $('pOut').onclick=()=>{ student={name:'',sec:''}; portada(); };
}
$('lnkDocente').onclick=e=>{ e.preventDefault(); panel(); };
portada();
})();
</script>

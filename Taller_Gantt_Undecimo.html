<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller Gantt · Undécimo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{ --bg:#050506; --card:#0e0e11; --card2:#15151a; --card3:#1c1c22; --line:#2a2a31; --line2:#3a3a44; --tx:#ECE9E1; --mut:#9b978d; --gold:#C9973F; --gold2:#F4DD7A; --teal:#2FC2AD; --coral:#EF6A5B;
  --ff:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace; }
*{ box-sizing:border-box; }
html{ scroll-padding-top:72px; }
html,body{ margin:0; background:var(--bg); color:var(--tx); font-family:var(--ff); font-size:15px; line-height:1.5; }
body{ overflow-x:hidden; }
button,input,select{ font-family:inherit; font-size:14px; }
a{ color:var(--gold2); }
.top{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; padding:10px 18px; background:rgba(5,5,6,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.logo{ width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,var(--gold),var(--gold2)); display:grid; place-items:center; color:#1a1206; font-weight:700; font-size:12px; flex:0 0 auto; }
.top h1{ font-size:16px; margin:0; font-weight:600; letter-spacing:.2px; }
.top .sub{ font-size:12px; color:var(--mut); }
.top .who{ margin-left:auto; text-align:right; font-size:12.5px; color:var(--mut); }
.top .who b{ color:var(--tx); font-weight:600; }
.wrap{ width:100%; max-width:1680px; margin:0 auto; padding:18px 22px 70px; }
@media(max-width:600px){ .wrap{ padding:12px 10px 60px; } .top{ padding:8px 12px; } .top .sub{ display:none; } }
.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
@media(max-width:600px){ .card{ padding:13px; border-radius:14px; } }
.card.soft{ background:var(--card2); }
h2{ margin:0 0 6px; font-size:22px; font-weight:600; }
h3{ margin:16px 0 8px; font-size:16px; font-weight:600; color:var(--gold2); }
.mut{ color:var(--mut); font-size:13px; }
.mono{ font-family:var(--mono); }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.grid{ display:grid; gap:16px; }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)); } .g3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.gx{ grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); }
@media(max-width:1100px){ .g3{ grid-template-columns:repeat(2,minmax(0,1fr)); } .gx{ grid-template-columns:minmax(0,1fr); } }
@media(max-width:760px){ .g2,.g3{ grid-template-columns:minmax(0,1fr); } }
.btn{ border:1px solid transparent; border-radius:11px; padding:10px 16px; font-weight:600; cursor:pointer; background:var(--card3); color:var(--tx); transition:transform .12s, background .2s, opacity .2s; }
.btn:hover{ transform:translateY(-1px); }
.btn.gold{ background:linear-gradient(135deg,var(--gold),#e0b357); color:#1a1206; }
.btn.teal{ background:var(--teal); color:#03201b; }
.btn.ghost{ background:transparent; border-color:var(--line2); }
.btn.coral{ background:var(--coral); color:#260704; }
.btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
.btn.sm{ padding:6px 11px; font-size:12.5px; border-radius:9px; }
input[type=text],input[type=number],select{ width:100%; background:var(--card2); color:var(--tx); border:1px solid var(--line2); border-radius:10px; padding:9px 11px; }
input.nin{ width:92px; text-align:center; font-family:var(--mono); }
input.win{ width:150px; font-family:var(--mono); }
input:focus,select:focus{ outline:none; border-color:var(--gold); }
input[readonly]{ opacity:.85; }
input.ok,select.ok{ border-color:var(--teal); } input.bad,select.bad{ border-color:var(--coral); }
label.lb{ display:block; font-size:13px; font-weight:600; margin:10px 0 4px; color:var(--mut); }
.pill{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600; background:var(--card3); border:1px solid var(--line2); color:var(--tx); }
.pill.gold{ background:rgba(201,151,63,.15); border-color:rgba(201,151,63,.45); color:var(--gold2); }
.pill.teal{ background:rgba(47,194,173,.12); border-color:rgba(47,194,173,.45); color:var(--teal); }
.pill.coral{ background:rgba(239,106,91,.12); border-color:rgba(239,106,91,.45); color:var(--coral); }
.note{ border-radius:12px; padding:11px 14px; font-size:13.5px; margin:10px 0; border:1px solid var(--line2); background:var(--card2); }
.note.ok{ border-color:rgba(47,194,173,.5); background:rgba(47,194,173,.08); }
.note.bad{ border-color:rgba(239,106,91,.55); background:rgba(239,106,91,.08); }
.note.gold{ border-color:rgba(201,151,63,.5); background:rgba(201,151,63,.08); }
.ok-t{ color:var(--teal); font-weight:600; } .bad-t{ color:var(--coral); font-weight:600; }
.hidden{ display:none !important; }
.hint{ font-size:12.5px; color:var(--mut); }
/* modo */
.modes{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media(max-width:760px){ .modes{ grid-template-columns:1fr; } }
.mode{ border:1px solid var(--line2); border-radius:18px; padding:20px; background:linear-gradient(160deg,var(--card2),var(--card)); position:relative; overflow:hidden; }
.mode::after{ content:''; position:absolute; right:-40px; top:-40px; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle,rgba(201,151,63,.18),transparent 70%); }
.mode.t::after{ background:radial-gradient(circle,rgba(47,194,173,.18),transparent 70%); }
.mode h2{ font-size:24px; }
/* stepper */
.steps{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; scrollbar-width:thin; }
.st{ flex:1 0 140px; min-width:140px; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:9px 12px; cursor:pointer; text-align:left; color:var(--tx); transition:border-color .2s, background .2s; }
.st .n{ font-family:var(--mono); font-size:11px; color:var(--mut); }
.st .t{ font-size:13px; font-weight:600; display:block; }
.st .s{ font-size:11.5px; color:var(--mut); }
.st.cur{ border-color:var(--gold); background:rgba(201,151,63,.08); }
.st.done .s{ color:var(--teal); }
.st.lock{ opacity:.4; cursor:not-allowed; }
/* meter */
.meter{ margin:8px 0; }
.meter .lbl{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; gap:8px; }
.meter .tr{ height:10px; background:var(--card3); border-radius:6px; overflow:hidden; }
.meter .fl{ height:100%; width:0; border-radius:6px; transition:width 1s cubic-bezier(.2,.8,.2,1); background:linear-gradient(90deg,var(--gold),var(--gold2)); }
/* tokens + bins */
.tray{ display:flex; flex-wrap:wrap; gap:8px; min-height:56px; padding:10px; border:1px dashed var(--line2); border-radius:12px; background:var(--card2); }
.tray.empty::after{ content:'(todo ubicado — toque una ficha ubicada y luego esta bandeja para devolverla)'; color:var(--mut); font-size:12px; }
.tok{ display:inline-flex; align-items:center; gap:8px; padding:8px 11px; border-radius:11px; background:var(--card3); border:1px solid var(--line2); color:var(--tx); cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none; text-align:left; font-size:13px; line-height:1.3; transition:border-color .15s, box-shadow .15s, transform .15s; }
.tok small{ display:block; color:#f2b3aa; font-size:11px; }
.tok:hover{ border-color:var(--gold); }
.tok.sel{ border-color:var(--gold2); box-shadow:0 0 0 3px rgba(244,221,122,.25); transform:translateY(-1px); }
.tok.ok{ border-color:var(--teal); } .tok.bad{ border-color:var(--coral); }
.dragghost{ position:fixed; z-index:200; pointer-events:none; padding:8px 12px; border-radius:11px; background:var(--gold); color:#1a1206; font-weight:600; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.5); transform:translate(-50%,-120%); max-width:260px; }
.armed .bin{ animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse{ 50%{ border-color:var(--gold2); } }
.bins{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:12px; }
@media(max-width:900px){ .bins{ grid-template-columns:1fr 1fr; } }
@media(max-width:520px){ .bins{ grid-template-columns:1fr; } }
.bin{ border:1.5px dashed var(--line2); border-radius:14px; padding:10px; min-height:110px; background:var(--card2); transition:border-color .2s; cursor:pointer; }
.bin h4{ margin:0 0 6px; font-size:14.5px; color:var(--gold2); }
.bin .lst{ display:flex; flex-direction:column; gap:6px; }
.prog{ display:flex; flex-direction:column; gap:8px; }
.blk{ display:grid; grid-template-columns:44px 1fr auto; align-items:center; gap:10px; background:var(--card2); border:1px solid var(--line2); border-radius:12px; padding:8px 10px; touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; transition:border-color .15s, background .2s; }
.blk .h{ font-family:var(--mono); color:var(--gold2); font-size:13px; }
.blk .t{ font-size:14px; }
.blk .ud{ display:flex; gap:4px; }
.blk .ud button{ width:34px; height:34px; border-radius:9px; border:1px solid var(--line2); background:var(--card3); color:var(--tx); cursor:pointer; font-size:14px; }
.blk.sel{ border-color:var(--gold2); box-shadow:0 0 0 3px rgba(244,221,122,.2); }
.blk.ok{ border-color:var(--teal); } .blk.bad{ border-color:var(--coral); }
/* opciones */
.opts{ display:flex; flex-direction:column; gap:7px; }
.opt{ text-align:left; background:var(--card2); border:1px solid var(--line2); border-radius:11px; padding:9px 12px; color:var(--tx); cursor:pointer; font-size:13.5px; line-height:1.4; transition:border-color .15s, background .15s; }
.opt:hover{ border-color:var(--gold); }
.opt.sel{ border-color:var(--gold2); background:rgba(201,151,63,.12); }
.opt.ok{ border-color:var(--teal); background:rgba(47,194,173,.1); }
.opt.bad{ border-color:var(--coral); background:rgba(239,106,91,.1); }
.opt:disabled{ cursor:default; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ min-width:44px; padding:8px 12px; border-radius:10px; border:1px solid var(--line2); background:var(--card2); color:var(--tx); cursor:pointer; font-weight:600; font-family:var(--mono); }
.chip.sel{ border-color:var(--gold2); background:rgba(201,151,63,.18); color:var(--gold2); }
.chip.ok{ border-color:var(--teal); } .chip.bad{ border-color:var(--coral); }
.q{ background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
.q .qh{ display:flex; gap:8px; align-items:flex-start; margin-bottom:8px; }
.q .qn{ font-family:var(--mono); font-size:11px; color:var(--mut); padding-top:3px; }
.q .qt{ font-weight:600; font-size:14px; flex:1; }
.q .qp{ font-family:var(--mono); font-size:11px; color:var(--gold2); white-space:nowrap; }
.q.ok{ border-color:rgba(47,194,173,.55); } .q.bad{ border-color:rgba(239,106,91,.55); }
.q .why{ font-size:12.5px; color:#f2b3aa; margin-top:8px; }
.q.ok .why{ color:var(--mut); }
/* gantt svg */
.plan{ width:100%; overflow-x:auto; border-radius:14px; border:1px solid var(--line); background:#09090c; }
.plan svg{ display:block; width:100%; height:auto; }
.legend{ display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--mut); margin-top:8px; align-items:center; }
.legend i{ display:inline-block; width:18px; height:10px; border-radius:3px; vertical-align:middle; margin-right:5px; }
/* cuadrícula de construcción */
.ggw{ overflow-x:auto; border:1px solid var(--line); border-radius:14px; background:#09090c; }
.gg{ --lw:250px; --cw:34px; display:inline-block; min-width:100%; }
@media(max-width:600px){ .gg{ --lw:118px; } }
.gg-r{ display:flex; border-bottom:1px solid var(--line); }
.gg-r:last-child{ border-bottom:none; }
.gg-l{ flex:0 0 var(--lw); width:var(--lw); position:sticky; left:0; z-index:3; background:#0e0e11; padding:6px 10px; font-size:13px; border-right:1px solid var(--line2); line-height:1.25; }
.gg-l b{ color:var(--gold2); font-family:var(--mono); }
.gg-l small{ display:block; color:var(--mut); font-size:11px; }
.gg-l .rd{ font-family:var(--mono); font-size:11px; color:var(--teal); }
.gg-h .gg-l{ font-weight:600; color:var(--mut); font-size:12px; display:flex; align-items:flex-end; }
.gg-days{ display:flex; }
.gg-d{ flex:0 0 var(--cw); width:var(--cw); text-align:center; font-family:var(--mono); font-size:11px; padding:4px 0; border-left:1px solid var(--line); }
.gg-d b{ display:block; color:var(--tx); font-size:12px; }
.gg-d span{ display:block; color:var(--mut); font-size:9.5px; }
.gg-d.wk{ border-left:1px solid var(--line2); }
.gg-t{ position:relative; flex:0 0 calc(var(--cw) * var(--cols)); width:calc(var(--cw) * var(--cols)); min-height:46px; cursor:crosshair;
  background-image:repeating-linear-gradient(90deg, rgba(58,58,68,.9) 0 1px, transparent 1px calc(var(--cw) * 5)), repeating-linear-gradient(90deg, rgba(42,42,49,.8) 0 1px, transparent 1px var(--cw)); }
.gg-t.ro{ cursor:default; }
.gbar{ position:absolute; top:calc(50% - 15px); height:30px; border-radius:8px; background:linear-gradient(135deg,var(--gold),#e0b357); color:#1a1206; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; touch-action:none; cursor:grab; box-shadow:0 4px 14px rgba(0,0,0,.4); transition:background .2s; user-select:none; -webkit-user-select:none; z-index:2; }
.gbar i{ position:absolute; top:0; bottom:0; width:12px; cursor:ew-resize; }
.gbar i.hl{ left:0; border-left:3px solid rgba(26,18,6,.55); border-radius:8px 0 0 8px; } .gbar i.hr{ right:0; border-right:3px solid rgba(26,18,6,.55); border-radius:0 8px 8px 0; }
.gbar.ok{ background:linear-gradient(135deg,#2FC2AD,#5fe0cc); color:#03201b; } .gbar.bad{ background:linear-gradient(135deg,#EF6A5B,#f59a8e); color:#260704; }
.gbar.crit{ background:linear-gradient(135deg,#EF6A5B,#f59a8e); color:#260704; } .gbar.ncrit{ background:linear-gradient(135deg,#2FC2AD,#5fe0cc); color:#03201b; }
.gbar.ro{ cursor:default; }
.gghost{ position:absolute; top:calc(50% - 18px); height:36px; border-radius:9px; border:2px dashed var(--gold2); pointer-events:none; z-index:1; }
.gslack{ position:absolute; top:calc(50% - 7px); height:14px; border-radius:5px; border:1.5px dashed var(--gold); pointer-events:none; }
.gpend{ position:absolute; top:calc(50% - 17px); height:34px; border-radius:8px; border:2px solid var(--gold2); background:rgba(244,221,122,.15); animation:pulse2 1.2s ease-in-out infinite; pointer-events:none; font-size:9.5px; color:var(--gold2); text-align:center; padding-top:9px; font-family:var(--mono); }
@keyframes pulse2{ 50%{ background:rgba(244,221,122,.32); } }
.gx-b{ width:24px; height:24px; border-radius:7px; border:1px solid var(--line2); background:var(--card3); color:var(--mut); cursor:pointer; font-size:12px; line-height:1; padding:0; float:right; }
.tmr{ font-family:var(--mono); font-size:20px; color:var(--gold2); background:var(--card2); border:1px solid var(--line2); border-radius:10px; padding:4px 12px; }
/* items feedback */
.fb{ list-style:none; padding:0; margin:8px 0 0; }
.fb li{ padding:8px 10px 8px 34px; border-radius:10px; margin:5px 0; position:relative; font-size:13.5px; background:var(--card2); border:1px solid var(--line); }
.fb li::before{ position:absolute; left:10px; top:8px; font-weight:700; font-family:var(--mono); }
.fb li.ok::before{ content:'✓'; color:var(--teal); } .fb li.bad::before{ content:'✗'; color:var(--coral); }
.fb li.bad{ border-color:rgba(239,106,91,.45); }
.fb li .why{ display:block; color:var(--mut); font-size:12.5px; margin-top:2px; }
.fb li.bad .why{ color:#f2b3aa; }
/* tablas */
.tb{ width:100%; border-collapse:collapse; font-size:13px; }
.tb th,.tb td{ border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top; }
.tb th{ color:var(--mut); font-weight:600; font-size:12px; }
.tb td.c,.tb th.c{ text-align:center; } .tb td.r,.tb th.r{ text-align:right; }
.lvl{ display:inline-block; padding:2px 8px; border-radius:8px; font-size:11.5px; font-weight:600; }
.lvl.l3{ background:rgba(47,194,173,.15); color:var(--teal); } .lvl.l2{ background:rgba(201,151,63,.15); color:var(--gold2); } .lvl.l1{ background:rgba(239,106,91,.15); color:var(--coral); }
.rub td.on{ outline:2px solid var(--gold); outline-offset:-2px; background:rgba(201,151,63,.07); }
.scroll{ overflow-x:auto; }
.seg{ display:inline-flex; border:1px solid var(--line2); border-radius:10px; overflow:hidden; }
.seg button{ background:var(--card2); color:var(--tx); border:none; padding:7px 11px; cursor:pointer; font-size:12.5px; border-right:1px solid var(--line2); }
.seg button:last-child{ border-right:none; }
.seg button.sel{ background:rgba(201,151,63,.25); color:var(--gold2); font-weight:600; }
.seg.ok{ border-color:var(--teal); } .seg.bad{ border-color:var(--coral); }
.rank{ counter-reset:r; list-style:none; padding:0; margin:0; }
.rank li{ display:flex; gap:10px; align-items:center; padding:7px 10px; border-radius:10px; background:var(--card2); margin:5px 0; font-size:13.5px; }
.rank li .p{ font-family:var(--mono); width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--card3); font-weight:700; flex:0 0 auto; }
.rank li:nth-child(1) .p{ background:var(--gold); color:#1a1206; } .rank li:nth-child(2) .p{ background:#bfbfc8; color:#111; } .rank li:nth-child(3) .p{ background:#a8703a; color:#120a03; }
.rank li.me{ outline:1px solid var(--gold2); }
.rank li .tm{ margin-left:auto; font-family:var(--mono); color:var(--gold2); }
.gauge{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
.gauge svg{ width:130px; height:130px; flex:0 0 auto; }
.gauge circle.v{ transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }
.casebar{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
.casebar .k{ font-family:var(--mono); font-size:11px; color:var(--mut); display:block; }
.casebar > div{ background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:8px 12px; }
.formula{ font-family:var(--mono); font-size:12.5px; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:6px 0; color:var(--gold2); }
#banner{ position:fixed; left:0; right:0; bottom:0; z-index:90; background:var(--coral); color:#1f0503; font-weight:700; text-align:center; padding:9px 12px; font-size:14px; display:none; }
#toast{ position:fixed; left:50%; bottom:56px; transform:translateX(-50%); background:var(--card3); border:1px solid var(--gold); color:var(--tx); padding:10px 16px; border-radius:12px; font-size:13.5px; z-index:120; display:none; max-width:92vw; }
#modal{ position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.84); display:none; overflow:auto; padding:20px 12px; }
#modal.on{ display:block; }
#modalIn{ max-width:1600px; margin:0 auto; }
footer{ text-align:center; color:var(--mut); font-size:12px; padding:20px 12px 40px; }
footer a{ color:var(--mut); }
.print-only{ display:none; }
@media print{
  @page{ margin:12mm; }
  html,body{ background:#fff !important; color:#111 !important; }
  .top,.steps,footer,.noprint,#banner,#toast{ display:none !important; }
  .wrap{ padding:0; max-width:none; }
  .card{ background:#fff !important; border:1px solid #bbb; color:#111; break-inside:avoid; }
  .card.soft{ background:#fff !important; }
  h2,h3{ color:#111 !important; } .mut{ color:#444 !important; }
  .tb th,.tb td{ border-color:#ccc; color:#111; }
  .lvl{ border:1px solid #888; color:#111 !important; background:#fff !important; }
  .plan{ border-color:#bbb; } .plan svg{ min-width:0 !important; }
  .print-only{ display:block; }
  .meter .tr{ background:#eee; border:1px solid #ccc; } .meter .fl{ background:#888 !important; }
  .note{ background:#fff !important; color:#111; border-color:#bbb; }
  .fb li{ background:#fff; color:#111; }
}
</style>
</head>
<body>

  root.addEventListener('pointerdown',e=>{ if(o.locked()) return; if(e.target.closest('button')) return; const t=e.target.closest('[data-tok]'); if(!t||!root.contains(t)) return;
    drag={id:t.dataset.tok,x:e.clientX,y:e.clientY,moved:false,label:t.dataset.lbl||t.textContent.trim().slice(0,60)}; });
  const mv=e=>{ if(!drag) return; if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8) return;
    if(!drag.moved){ drag.moved=true; ghost=document.createElement('div'); ghost.className='dragghost'; ghost.textContent=drag.label; document.body.appendChild(ghost); sel=drag.id; mark(); }
    ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px'; e.preventDefault(); };
  const up=e=>{ if(!drag) return; const d=drag; drag=null; if(!d.moved) return; just=Date.now(); if(ghost){ ghost.remove(); ghost=null; }
    const el=document.elementFromPoint(e.clientX,e.clientY); const s=el&&el.closest('[data-slot]'); const tr=el&&el.closest('[data-tray]');
    sel=null; if(s&&root.contains(s)) o.drop(d.id,s.dataset.slot,true); else if(tr&&root.contains(tr)) o.drop(d.id,null,true); else mark(); };
  window.addEventListener('pointermove',mv,{passive:false}); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',()=>{ if(ghost){ ghost.remove(); ghost=null; } drag=null; });
  root.addEventListener('click',e=>{ if(o.locked()||Date.now()-just<60) return; if(e.target.closest('button')) return;
    const s=e.target.closest('[data-slot]'); const t=e.target.closest('[data-tok]'); const tr=e.target.closest('[data-tray]');
    if(sel&&s&&root.contains(s)){ const id=sel; sel=null; o.drop(id,s.dataset.slot); return; }
    if(t&&root.contains(t)){ const id=t.dataset.tok; sel=(sel===id)?null:id; mark(); return; }
    if(sel&&tr&&root.contains(tr)){ const id=sel; sel=null; o.drop(id,null); return; } });
}

/* =================== GANTT (SVG oscuro, basado en ganttSVG de Gestor_Proyectos) =================== */
let SVGN=0;
function ganttSVG(C,o){ o=o||{}; const R=cpmC(C), T=R.T, cols=o.cols||T, n=C.acts.length, id=++SVGN;
  const cw=o.cw||38, lw=o.lw||250, rh=38, top=56, W=lw+cols*cw+16, H=top+n*rh+(o.legend===false?12:44)+(o.cut?22:0);
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="min-width:${Math.min(W,Math.round(lw*0.9+cols*30))}px" font-family="Space Grotesk, system-ui, sans-serif" role="img" aria-label="Gráfica de Gantt de ${esc(temaDe(C).nombre)}">
   <defs><marker id="ar${id}" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#8f8a80"/></marker></defs>
   <rect width="${W}" height="${H}" fill="#09090c"/>`;
  for(let i=0;i<n;i++) if(i%2) s+=`<rect x="0" y="${top+i*rh}" width="${W}" height="${rh}" fill="#0f0f13"/>`;
  for(let k=1;k<=cols;k++){ const x=lw+(k-1)*cw, dt=fechaDia(C,k); s+=`<text x="${x+cw/2}" y="20" font-size="12" font-weight="600" text-anchor="middle" fill="${k>T?'#5d5a54':'#ECE9E1'}" font-family="IBM Plex Mono, monospace">${k}</text><text x="${x+cw/2}" y="35" font-size="9" text-anchor="middle" fill="#9b978d">${DOW[dt.getUTCDay()]}</text><text x="${x+cw/2}" y="47" font-size="9" text-anchor="middle" fill="#9b978d">${fCorta(dt)}</text>`; }
  for(let k=0;k<=cols;k++){ const x=lw+k*cw; s+=`<line x1="${x}" x2="${x}" y1="${k%5===0?4:top-4}" y2="${top+n*rh}" stroke="${k%5===0?'#3a3a44':'#222228'}" stroke-width="${k%5===0?1.4:1}"/>`; }
  s+=`<line x1="0" x2="${W}" y1="${top}" y2="${top}" stroke="#3a3a44"/><text x="10" y="20" font-size="11" fill="#9b978d">Día hábil →</text><text x="10" y="40" font-size="11" fill="#9b978d">Fecha (${new Date(Date.parse(C.inicio)).getUTCFullYear()}) →</text>`;
  const maxc=Math.floor((lw-46)/6.6);
  C.acts.forEach((a,i)=>{ const x=R.by[a.id], y=top+i*rh; const nm=a.n.length>maxc?a.n.slice(0,maxc-1)+'…':a.n;
    s+=`<text x="10" y="${y+24}" font-size="13" font-weight="700" fill="#F4DD7A" font-family="IBM Plex Mono, monospace">${a.id}</text><text x="30" y="${y+24}" font-size="12" fill="#ECE9E1">${esc(nm)}</text>`; });
  if(o.arrows!==false) C.acts.forEach((a,i)=>{ const xs=R.by[a.id], ys=top+i*rh; a.pred.forEach(p=>{ const xp=R.by[p], ip=C.acts.findIndex(z=>z.id===p), yp=top+ip*rh;
      const x1=lw+xp.TC*cw, x2=lw+xs.IC*cw;
      if(x2-x1<8) s+=`<path d="M${x1-2},${yp+rh/2} H${x1+5} V${ys+7}" fill="none" stroke="#8f8a80" stroke-width="1.4" marker-end="url(#ar${id})"/>`;
      else s+=`<path d="M${x1-2},${yp+rh/2} H${x1+5} V${ys+rh/2} H${x2+1}" fill="none" stroke="#8f8a80" stroke-width="1.4" marker-end="url(#ar${id})"/>`; }); });
  C.acts.forEach((a,i)=>{ const x=R.by[a.id], y=top+i*rh; const bx=lw+x.IC*cw+3, bw=a.d*cw-6;
    const col=o.crit?(x.crit?'#EF6A5B':'#2FC2AD'):'#C9973F';
    if(o.holg&&x.H>0.005) s+=`<rect x="${lw+x.TC*cw+2}" y="${y+14}" width="${x.H*cw-4}" height="${rh-28}" rx="4" fill="none" stroke="#C9973F" stroke-dasharray="4 3" stroke-width="1.4"/>`;
    if(o.real){ const rd=o.real[a.id]||0; s+=`<rect x="${bx}" y="${y+8}" width="${bw}" height="${rh-16}" rx="6" fill="${col}" fill-opacity=".28" stroke="${col}" stroke-width="1"/>`;
      if(rd>0) s+=`<rect x="${bx}" y="${y+8}" width="${Math.max(4,rd*cw-(rd===a.d?6:3))}" height="${rh-16}" rx="6" fill="${col}"/>`;
      if(x.IC<o.cut||rd>0) { const tx=Math.round(rd/a.d*100)+' %'; s+=`<rect x="${bx+3}" y="${y+12}" width="${tx.length*7.2+8}" height="15" rx="4" fill="#09090c" fill-opacity=".82"/><text x="${bx+7}" y="${y+23.5}" font-size="11" font-weight="700" fill="#ECE9E1" font-family="IBM Plex Mono, monospace">${tx}</text>`; } }
    else { s+=`<rect x="${bx}" y="${y+8}" width="${bw}" height="${rh-16}" rx="6" fill="${col}"/>`; if(bw>26) s+=`<text x="${bx+bw/2}" y="${y+24}" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1206" font-family="IBM Plex Mono, monospace">${a.d}d</text>`; } });
  if(o.cut){ const x=lw+o.cut*cw; s+=`<line x1="${x}" x2="${x}" y1="${top-6}" y2="${top+n*rh+4}" stroke="#F4DD7A" stroke-width="2.5" stroke-dasharray="6 4"/><rect x="${x-58}" y="${top+n*rh+5}" width="116" height="18" rx="5" fill="#F4DD7A"/><text x="${x}" y="${top+n*rh+18}" font-size="11" font-weight="700" text-anchor="middle" fill="#1a1206">Corte: fin día ${o.cut}</text>`; }
  if(o.legend!==false){ const ly=H-14; s+=`<g font-size="11" fill="#9b978d">`+(o.crit?`<rect x="${lw}" y="${ly-9}" width="16" height="10" rx="2" fill="#EF6A5B"/><text x="${lw+21}" y="${ly}">Crítica (holgura 0)</text><rect x="${lw+150}" y="${ly-9}" width="16" height="10" rx="2" fill="#2FC2AD"/><text x="${lw+171}" y="${ly}">Con holgura</text>`:`<rect x="${lw}" y="${ly-9}" width="16" height="10" rx="2" fill="#C9973F"/><text x="${lw+21}" y="${ly}">Actividad (largo = duración)</text>`)
      +(o.holg?`<rect x="${lw+280}" y="${ly-9}" width="16" height="10" rx="2" fill="none" stroke="#C9973F" stroke-dasharray="3 2"/><text x="${lw+301}" y="${ly}">Holgura</text>`:`<path d="M${lw+280},${ly-4} H${lw+300}" stroke="#8f8a80" marker-end="url(#ar${id})"/><text x="${lw+306}" y="${ly}">Dependencia (fin → inicio)</text>`)
      +(o.real?`<text x="${lw+420}" y="${ly}">Parte sólida = avance real</text>`:'')+`</g>`; }
  return s+'</svg>'; }

function entrar(){

  Promise.all([sheetGet(SH_PROG),sheetGet(SH_DATA)]).then(([prog,casos])=>{ PROG=prog; CASOS=casos; cargarEval(); hub(); });

function cargarEval(){
  const me=norm(user.name);
  const mine=PROG.filter(r=>norm(r.Estudiante)===me&&String(r.Modulo||'').indexOf(MODULE_ID+'_')===0);
  const cut=Math.max(0,...mine.filter(r=>r.Modulo===MODULE_ID+'_reset').map(r=>tsN(r.Timestamp)));
  const after=mine.filter(r=>tsN(r.Timestamp)>cut);
  const fin=after.filter(r=>r.Modulo===MODULE_ID+'_final').pop();
  ST={sec:user.sec,cut:cut,fases:{},draft:{},n1:null,final:null};
  CASOS.filter(r=>r.CasoId===MODULE_ID+'_detalle'&&norm(r.Nombre)===me&&tsN(r.Timestamp)>cut).forEach(r=>{ let d={}; try{ d=JSON.parse(r.Texto); }catch(e){}
    if(d.fase==='construir_n1'&&!ST.n1) ST.n1={score:d.score,total:d.total,ind:d.ind,data:d.data,seg:d.seg};
    else if(FASES.some(f=>f.k===d.fase)&&!ST.fases[d.fase]) ST.fases[d.fase]={score:d.score,total:d.total,ind:d.ind,data:d.data,ts:r.Timestamp};
    else if(d.fase==='final'&&d.fecha) ST.fecha=d.fecha; });
  after.forEach(r=>{ const m=String(r.Modulo).match(new RegExp('^'+MODULE_ID+'_(etapas|leer|construir|control)_paso$')); if(m&&!ST.fases[m[1]]) ST.fases[m[1]]={score:+r.Score,total:+r.Total,ind:null,data:null,ts:r.Timestamp}; });
  const loc=loadLS();
  if(loc&&tsN(loc.ts)>cut&&loc.cut===cut){ Object.keys(loc.fases||{}).forEach(k=>{ if(!ST.fases[k]||!ST.fases[k].data) ST.fases[k]=loc.fases[k]; }); ST.draft=loc.draft||{}; if(loc.n1&&!ST.n1) ST.n1=loc.n1; if(loc.final) ST.final=loc.final; if(loc.fecha) ST.fecha=loc.fecha; if(loc.iniciado) ST.iniciado=1; }
  else if(loc){ try{ localStorage.removeItem(LSK()); }catch(e){} }
  if(fin&&!ST.final) ST.final={ts:fin.Timestamp,score:+fin.Score};
  EV=mkCase(me+'|eval|'+cut);
  bloqueado=!!ST.final; saveLS();
}
function rankingSec(sec){ const by={};
  CASOS.filter(r=>r.CasoId===MODULE_ID+'_ranking').forEach(r=>{ let d={}; try{ d=JSON.parse(r.Texto); }catch(e){ return; } if(d.seccion!==sec) return; const k=norm(r.Nombre); if(!by[k]||tsN(by[k].ts)<tsN(r.Timestamp)) by[k]={nombre:String(r.Nombre).trim(),seg:+d.seg,s1:+d.barras,ts:r.Timestamp}; });
  return Object.values(by).filter(x=>x.s1>=20).sort((a,b)=>a.seg-b.seg); }
function rankingHTML(sec,lim){ const L=rankingSec(sec).slice(0,lim||10); const me=norm(user.name);
  return L.length?`<ol class="rank">${L.map((x,i)=>`<li class="${norm(x.nombre)===me?'me':''}"><span class="p">${i+1}</span><span>${esc(x.nombre)}<div class="mut" style="font-size:11.5px">Barras ${x.s1}/25</div></span><span class="tm">${mmss(x.seg)}</span></li>`).join('')}</ol>`:'<p class="mut">Aún no hay tiempos registrados en esta sección.</p>'; }

function nuevoPR(){ const v=PR?PR.vista:0; PR=Object.assign(mkCase('prac|'+norm(user.name)+'|'+Date.now()+'|'+Math.random()),{vista:v,d:{},res:{},logged:{}}); }

/* =================== NAVEGACIÓN: EVALUACIÓN =================== */
function puedeVer(i){ if(bloqueado) return true; if(i==='inf') return !!ST.final; return i===0||!!ST.fases[FASES[i].k]||!!ST.fases[FASES[i-1].k]; }
function renderEval(){
  stopTick(); $('who').innerHTML=`<b>${esc(user.name)}</b><br>${esc(user.sec)} · ${totalScore()} / 100`;
  const steps=FASES.map((f,i)=>{ const x=ST.fases[f.k]; return `<button class="st ${vista===i?'cur':''} ${x?'done':''} ${puedeVer(i)?'':'lock'}" data-v="${i}"><span class="n">ESTACIÓN ${f.n}</span><span class="t">${f.corto}</span><span class="s">${x?'✓ '+x.score+' / '+x.total:(puedeVer(i)?'En curso · '+f.total+' pts':'Bloqueada')}</span></button>`; }).join('')
    +`<button class="st ${vista==='inf'?'cur':''} ${ST.final?'done':''} ${puedeVer('inf')?'':'lock'}" data-v="inf"><span class="n">CIERRE</span><span class="t">Resultado y rúbrica</span><span class="s">${ST.final?'✓ '+totalScore()+' / 100':'Al terminar'}</span></button>`;
  $('app').innerHTML=`${vista==='inf'?`<div class="row noprint" style="margin-bottom:10px"><button class="btn ghost sm" id="bHome">← Inicio</button></div>`:caseHTML(EV)}<div class="steps noprint">${steps}</div><div id="stage"></div>`;
  document.querySelectorAll('.st').forEach(b=>b.onclick=()=>{ const v=b.dataset.v==='inf'?'inf':+b.dataset.v; if(!puedeVer(v)) return; vista=v; renderEval(); });
  $('bHome').onclick=hub;
  const el=$('stage');
  if(vista==='inf'){ renderInforme(el); window.scrollTo(0,0); return; }
  const f=FASES[vista], k=f.k, done=ST.fases[k];
  if(done&&!done.data){ el.innerHTML=`<div class="card"><h2>${f.titulo}</h2><p class="mut">Estación registrada en la plataforma (${done.score}/${done.total}). Ya no se puede volver a contestar.</p></div>`; return; }
  const d=done?done.data:(ST.draft[k]=ST.draft[k]||{});
  const ctx={mode:'eval',X:EV,d:d,res:done?resOf(k,d):null,locked:!!done||bloqueado,save:saveLS,check:(g,dd)=>completar(k,dd||d)};
  STATIONS[k](el,ctx); window.scrollTo(0,0);
}
function resOf(k,d){ if(k==='etapas') return gradeEtapas(EV.C,EV.E,d); if(k==='leer') return gradeLeer(EV.C,EV.L,d); if(k==='control') return gradeControl(EV.C,EV.K,d); return mergeG(gradeBars(EV.C,d),gradeN2(EV.C,d)); }
function completar(k,d){
  if(ST.fases[k]||bloqueado) return; const g=resOf(k,d);
  ST.fases[k]={score:g.score,total:g.total,ind:g.ind,data:d,ts:now()}; delete ST.draft[k]; saveLS();
  postProg(user.name,MODULE_ID+'_'+k+'_paso',g.score,g.total);
  postCaso('detalle',{fase:k,seccion:user.sec,caso:EV.C.seed,score:g.score,total:g.total,ind:g.ind,data:d,errores:g.items.filter(i=>!i.ok).map(i=>i.t)});
  if(fasesHechas()===FASES.length){ finalizar(); return; }
  renderEval(); setTimeout(()=>{ const r=$('resBox'); if(r) r.scrollIntoView({behavior:'smooth',block:'start'}); },80);
}
function finalizar(){
  const tot=totalScore(), ind=totalesInd(); const fecha=now();
  INDS.forEach((i,k)=>{ const v=ind[i.id]||[0,0]; postProg(user.name,MODULE_ID+'_ind'+(k+1)+'_ra_'+i.ra+'_paso',v[0],v[1]); });
  postProg(user.name,MODULE_ID+'_final',tot,100);
  const fases={}; FASES.forEach(f=>{ const x=ST.fases[f.k]; fases[f.k]=x?[x.score,x.total]:null; });
  postCaso('detalle',{fase:'final',seccion:user.sec,caso:EV.C.seed,fecha:fecha,total:tot,de:100,fases:fases,ind:ind,niveles:INDS.reduce((o,i)=>{ const v=ind[i.id]||[0,0]; o[i.id]=nivelDe(pct(v[0],v[1])); return o; },{}),seg_construir:ST.n1?ST.n1.seg:null,salidas:salidas});
  ST.final={ts:fecha,score:tot}; ST.fecha=fecha; saveLS(); enCurso=false; bloqueado=true; vista='inf'; renderEval();
}

/* =================== RESULTADO DE ESTACIÓN =================== */
function resBox(ctx,g,k,extraBtns){ const malos=g.items.filter(i=>!i.ok), buenos=g.items.filter(i=>i.ok); const p=g.score/g.total; const i=FASES.findIndex(f=>f.k===k);
  return `<div class="card" id="resBox"><div class="row"><h3 style="margin:0">${ctx.mode==='eval'?'Resultado de la estación':'Revisión de su práctica'}</h3><span class="pill ${p>=.8?'teal':(p>=.6?'gold':'coral')}" style="margin-left:auto">${g.score} / ${g.total} pts</span></div>
   <div class="meter"><div class="tr"><div class="fl" data-w="${pct(g.score,g.total)}"></div></div></div>
   <p class="mut" style="margin:4px 0">${ctx.mode==='eval'?'Estación calificada: puede revisarla, pero ya no se puede volver a contestar.':'Práctica: corrija lo marcado y vuelva a revisar, o genere un caso nuevo. Esta nota no se guarda.'}</p>
   ${malos.length?`<h3>Lo que debe corregir (con la regla)</h3><ul class="fb">${malos.map(i=>`<li class="bad">${esc(i.t)}<span class="why">${esc(i.why)}</span></li>`).join('')}</ul>`:'<div class="note ok"><b>¡Estación perfecta!</b></div>'}
   ${buenos.length?`<details style="margin-top:8px"><summary class="mut">Ver aciertos (${buenos.length})</summary><ul class="fb">${buenos.map(i=>`<li class="ok">${esc(i.t)}${i.why?`<span class="why">${esc(i.why)}</span>`:''}</li>`).join('')}</ul></details>`:''}
   <div class="row" style="margin-top:12px">${extraBtns||''}${ctx.mode==='eval'?(i<FASES.length-1?`<button class="btn gold" data-go="${i+1}">Continuar a la estación ${i+2} →</button>`:''):`<button class="btn teal" data-newcase="1">Nuevo caso</button>${i<FASES.length-1?`<button class="btn ghost" data-pgo="${i+1}">Ir a la estación ${i+2} →</button>`:''}`}</div></div>`; }
function wireRes(el){ el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ vista=+b.dataset.go; renderEval(); });
  el.querySelectorAll('[data-pgo]').forEach(b=>b.onclick=()=>{ PR.vista=+b.dataset.pgo; renderPrac(); });
  el.querySelectorAll('[data-newcase]').forEach(b=>b.onclick=()=>{ nuevoPR(); renderPrac(); toast('Nuevo caso generado.'); });
  setTimeout(()=>el.querySelectorAll('.fl[data-w]').forEach(f=>f.style.width=f.dataset.w+'%'),60); }
const mk=(res,key)=>res&&res.marks&&res.marks[key]!==undefined?(res.marks[key]?'ok':'bad'):'';
function head(k,extra){ const f=FASES.find(x=>x.k===k); return `<div class="row"><span class="pill gold mono">ESTACIÓN ${f.n}</span><span class="pill">${f.total} pts${MODO==='eval'?'':' (práctica)'}</span>${extra||''}</div><h2 style="margin-top:8px">${f.titulo}</h2>`; }

/* =================== ESTACIÓN 1: ETAPAS =================== */
function stEtapas(el,ctx){ const {C,E}=ctx.X, d=ctx.d, lk=ctx.locked, R=ctx.res;
  if(!d.ord) d.ord=E.init.slice(); d.ent=d.ent||{}; d.cl=d.cl||{};

   <p>Antes de programar ${esc(temaDe(C).corto)}, repase cómo se administra un proyecto: es un esfuerzo <b>temporal</b>, <b>único</b> y con <b>recursos limitados</b> que pasa por seis etapas.</p>
   <h3>A. Ordene las 6 etapas <span class="mut" style="font-weight:400">(1 pt c/u)</span></h3><p class="hint">Arrastre, use las flechas, o toque una etapa y luego toque la posición donde va.</p>
   <div class="prog" id="ordE"></div>

   <h3 style="margin-top:22px">C. ¿En qué etapa ocurre? <span class="mut" style="font-weight:400">(8 situaciones · 1 pt c/u)</span></h3><p class="hint">Arrastre cada situación a su etapa, o tóquela y luego toque la etapa.</p>
   <div id="zE"><div class="tray" data-tray="1" id="trayE"></div><div class="bins">${E.lista.map(id=>`<div class="bin" data-slot="${id}"><h4>${ETA(id).n}</h4><div class="lst" id="bin_${id}"></div></div>`).join('')}</div></div>
   ${lk?'':`<div class="row" style="margin-top:16px"><button class="btn gold" id="bChk">${ctx.mode==='eval'?'Calificar estación 1':'Revisar'}</button><span class="mut" id="mChk"></span></div>`}</div>${R?resBox(ctx,R,'etapas'):''}`;
  const draw=()=>{
    $('ordE').innerHTML=d.ord.map((id,i)=>`<div class="blk ${mk(R,'o'+i)}" data-tok="${id}" data-slot="${i}" data-lbl="${ETA(id).n}"><span class="h">${i+1}</span><span class="t">${ETA(id).n}</span><span class="ud">${lk?'':`<button class="ud-b" data-up="${i}" aria-label="Subir">↑</button><button class="ud-b" data-dn="${i}" aria-label="Bajar">↓</button>`}</span></div>`).join('');
    const chip=(x,i)=>`<div class="tok ${mk(R,'s'+i)}" data-tok="s${i}" tabindex="0" role="button">${esc(x.t)}${R&&!R.marks['s'+i]&&(lk||ctx.mode==='prac')?`<small>Es ${ETA(x.e).n.toLowerCase()}</small>`:''}</div>`;
    $('trayE').innerHTML=E.sits.map((x,i)=>d.cl[i]?'':chip(x,i)).join(''); $('trayE').classList.toggle('empty',E.sits.every((x,i)=>d.cl[i]));
    E.lista.forEach(id=>{ $('bin_'+id).innerHTML=E.sits.map((x,i)=>d.cl[i]===id?chip(x,i):'').join(''); });
    if(!lk){ $('ordE').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; if(i>0){ [d.ord[i-1],d.ord[i]]=[d.ord[i],d.ord[i-1]]; ctx.save(); draw(); } });
      $('ordE').querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.dn; if(i<5){ [d.ord[i+1],d.ord[i]]=[d.ord[i],d.ord[i+1]]; ctx.save(); draw(); } });
      const falt=E.lista.filter(id=>!d.ent[id]).length+E.sits.filter((x,i)=>!d.cl[i]).length; $('bChk').disabled=falt>0; $('mChk').textContent=falt?'Faltan '+falt+' respuestas.':'Listo.'; } };
  draw(); wireRes(el); if(lk) return;
  dnd($('ordE'),{locked:()=>ctx.locked,drop:(id,slot,viaDrag)=>{ if(slot===null) return draw(); const from=d.ord.indexOf(id), to=+slot; if(from===to) return draw();
    if(viaDrag){ d.ord.splice(from,1); d.ord.splice(to,0,id); } else { [d.ord[from],d.ord[to]]=[d.ord[to],d.ord[from]]; } ctx.save(); draw(); }});
  dnd($('zE'),{locked:()=>ctx.locked,drop:(id,slot)=>{ const i=+id.slice(1); if(slot) d.cl[i]=slot; else delete d.cl[i]; ctx.save(); draw(); }});
  el.querySelectorAll('[data-ent]').forEach(s=>s.onchange=()=>{ if(s.value) d.ent[s.dataset.ent]=s.value; else delete d.ent[s.dataset.ent]; ctx.save(); draw(); });
  $('bChk').onclick=()=>ctx.check(gradeEtapas(C,E,d),d);
}

/* =================== ESTACIÓN 2: LEER UN GANTT =================== */
function stLeer(el,ctx){ const {C,L}=ctx.X, d=ctx.d, lk=ctx.locked, R=ctx.res; d.q3=d.q3||{}; d.q4=d.q4||{};
  const ids=C.acts.map(a=>a.id); const it=k=>R?R.items.find(i=>i.q===k):null;
  const why=k=>{ const x=it(k); return x&&(lk||ctx.mode==='prac')?`<div class="why">${x.ok?'✓ ':''}${esc(x.why)}</div>`:''; };
  const Q=(n,k,pts,txt,body)=>`<div class="q ${mk(R,k)}" id="q_${k}"><div class="qh"><span class="qn">${String(n).padStart(2,'0')}</span><span class="qt">${txt}</span><span class="qp">${pts} pts</span></div>${body}${why(k)}</div>`;
  const nin=(k,cls)=>`<input type="text" inputmode="numeric" class="nin ${cls||''}" data-n="${k}" value="${esc(d[k]||'')}" ${lk?'disabled':''} aria-label="respuesta ${k}">`;
  const chips=(k,lst)=>`<div class="chips">${lst.map(id=>`<button class="chip ${d[k][id]?'sel':''}" data-c="${k}" data-id="${id}" ${lk?'disabled':''}>${id}</button>`).join('')}</div>`;
  el.innerHTML=`<div class="card">${head('leer','<span class="pill">RA1-I3 · RA2-I1</span>')}
   <p>Este es el cronograma (línea base) de <b>${esc(temaDe(C).nombre)}</b>. Cada columna es un <b>día hábil</b> (debajo, su fecha). Las flechas muestran las dependencias: la actividad de llegada no puede iniciar hasta que termine la de salida.</p>
   <div class="plan">${ganttSVG(C,{arrows:true})}</div>
   <div class="grid g2" style="margin-top:16px">
    ${Q(1,'q1',4,`¿En qué día inicia y en qué día termina ${lab(C,L.q1.id)}?`,`<div class="row"><span class="mut">Inicia el día</span>${nin('q1i',mk(R,'q1i'))}<span class="mut">y termina el día</span>${nin('q1f',mk(R,'q1f'))}</div>`)}
    ${Q(2,'q2',3,`¿En qué fecha termina ${lab(C,L.q2.id)}?`,`<div class="opts">${L.q2.ops.map((o,i)=>`<button class="opt ${R?(d.q2===i?(i===L.q2.ok?'ok':'bad'):(i===L.q2.ok?'ok':'')):(d.q2===i?'sel':'')}" data-q2="${i}" ${lk?'disabled':''}>${esc(o)}</button>`).join('')}</div>`)}
    ${Q(3,'q3',4,`¿Qué actividades se realizan en paralelo (al mismo tiempo, al menos un día) con ${lab(C,L.q3.id)}? Marque todas.`,chips('q3',ids.filter(i=>i!==L.q3.id)))}
    ${Q(4,'q4',3,`¿De qué actividades depende directamente ${lab(C,L.q4.id)} (sus precedentes inmediatas)? Marque todas.`,chips('q4',ids.filter(i=>i!==L.q4.id)))}
    ${Q(5,'q5',3,'¿Cuántos días hábiles dura el proyecto completo?',`<div class="row">${nin('q5')}<span class="mut">días</span></div>`)}
    ${Q(6,'q6',4,`Si ${lab(C,L.q6.id)} se atrasa <b>${L.q6.k} días</b> (y lo demás se cumple), ¿en qué día terminaría el proyecto?`,`<div class="row"><span class="mut">Día</span>${nin('q6')}</div>`)}
    ${Q(7,'q7',4,`Si en cambio ${lab(C,L.q7.id)} se atrasa <b>${L.q7.k} día(s)</b> (y lo demás se cumple), ¿en qué día terminaría el proyecto?`,`<div class="row"><span class="mut">Día</span>${nin('q7')}</div>`)}
   </div>
   ${ctx.mode==='prac'&&!R?`<details style="margin-top:12px"><summary class="mut">Pistas</summary><div class="note">Fin del proyecto = fin de la última barra. Una actividad es <b>crítica</b> si un atraso suyo mueve la última barra; si tiene <b>holgura</b> (espacio libre hasta que la necesite su siguiente), absorbe atrasos hasta ese límite.</div></details>`:''}
   ${lk?'':`<div class="row" style="margin-top:16px"><button class="btn gold" id="bChk">${ctx.mode==='eval'?'Calificar estación 2':'Revisar'}</button><span class="mut" id="mChk"></span></div>`}</div>${R?resBox(ctx,R,'leer'):''}`;
  wireRes(el); if(lk) return;
  const upd=()=>{ const falt=['q1i','q1f','q5','q6','q7'].filter(k=>!String(d[k]||'').trim()).length+(d.q2===undefined?1:0)+(Object.values(d.q3).some(Boolean)?0:1)+(Object.values(d.q4).some(Boolean)?0:1); $('bChk').disabled=falt>0; $('mChk').textContent=falt?'Faltan '+falt+' respuestas.':'Listo.'; };
  el.querySelectorAll('[data-n]').forEach(i=>i.oninput=()=>{ d[i.dataset.n]=i.value.trim(); ctx.save(); upd(); });
  el.querySelectorAll('[data-q2]').forEach(b=>b.onclick=()=>{ d.q2=+b.dataset.q2; el.querySelectorAll('[data-q2]').forEach(x=>{ x.classList.remove('ok','bad'); x.classList.toggle('sel',x===b); }); ctx.save(); upd(); });
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ const o=d[b.dataset.c]; o[b.dataset.id]=!o[b.dataset.id]; b.classList.toggle('sel',!!o[b.dataset.id]); ctx.save(); upd(); });
  upd(); $('bChk').onclick=()=>ctx.check(gradeLeer(C,L,d),d);
}

/* =================== ESTACIÓN 3: CONSTRUIR EL GANTT =================== */
function stopTick(){ if(TICK){ clearInterval(TICK); TICK=null; } }
function gridHTML(C,cols,bars,o){ o=o||{}; const R=cpmC(C);
  const days=[...Array(cols).keys()].map(i=>{ const dt=fechaDia(C,i+1); return `<div class="gg-d ${i%5===0?'wk':''}"><b>${i+1}</b><span>${DOW[dt.getUTCDay()]} ${fCorta(dt)}</span></div>`; }).join('');
  return `<div class="ggw"><div class="gg" style="--cols:${cols}"><div class="gg-r gg-h"><div class="gg-l">Actividad</div><div class="gg-days">${days}</div></div>
   ${C.acts.map(a=>{ const b=bars[a.id]; const x=R.by[a.id];
     return `<div class="gg-r"><div class="gg-l">${o.edit?`<button class="gx-b" data-clr="${a.id}" title="Borrar barra" aria-label="Borrar barra ${a.id}">✕</button>`:''}<b>${a.id}</b> ${esc(a.n)}<small>${a.d} días · prec.: ${a.pred.join(', ')||'—'}</small><span class="rd" id="rd_${a.id}">${b?'día '+b[0]+' → '+b[1]:''}</span></div>
      <div class="gg-t ${o.edit?'':'ro'}" data-track="${a.id}">${o.ghost?`<div class="gghost" style="left:calc(var(--cw)*${x.IC});width:calc(var(--cw)*${a.d})"></div>`:''}${o.slack&&x.H>0?`<div class="gslack" style="left:calc(var(--cw)*${x.TC} + 2px);width:calc(var(--cw)*${x.H} - 4px)"></div>`:''}${b?barHTML(a.id,b,o.cls?o.cls(a.id):'',!o.edit):''}</div></div>`; }).join('')}</div></div>`; }
function barHTML(id,b,cls,ro){ return `<div class="gbar ${cls||''} ${ro?'ro':''}" data-bar="${id}" style="left:calc(var(--cw)*${b[0]-1} + 2px);width:calc(var(--cw)*${b[1]-b[0]+1} - 4px)">${ro?'':'<i class="hl"></i>'}<span>${id} · ${b[1]-b[0]+1}d</span>${ro?'':'<i class="hr"></i>'}</div>`; }
function fitCw(root,cols){ const g=root.querySelector('.gg'); if(!g) return; const W=root.querySelector('.ggw').clientWidth; const lw=parseFloat(getComputedStyle(g).getPropertyValue('--lw'))||250; const cw=Math.max(30,Math.min(60,Math.floor((W-lw-2)/cols))); g.style.setProperty('--cw',cw+'px'); }
function wireGrid(root,C,cols,d,onChange,locked){
  const pend={}; let op=null, just=0;
  const trackOf=id=>root.querySelector(`[data-track="${id}"]`);
  const cellAt=(tr,x)=>{ const r=tr.getBoundingClientRect(); return Math.max(1,Math.min(cols,Math.floor((x-r.left)/(r.width/cols))+1)); };
  const paint=id=>{ const tr=trackOf(id); const b=d.bars[id]; let el=tr.querySelector('[data-bar]');
    if(!b){ if(el) el.remove(); } else { if(!el){ tr.insertAdjacentHTML('beforeend',barHTML(id,b,'')); el=tr.querySelector('[data-bar]'); }
      el.style.left=`calc(var(--cw)*${b[0]-1} + 2px)`; el.style.width=`calc(var(--cw)*${b[1]-b[0]+1} - 4px)`; el.querySelector('span').textContent=id+' · '+(b[1]-b[0]+1)+'d'; el.classList.remove('ok','bad'); }
    const pe=tr.querySelector('.gpend'); if(pend[id]){ const h=`left:calc(var(--cw)*${pend[id]-1} + 2px);width:calc(var(--cw) - 4px)`; if(pe) pe.style.cssText=h; else tr.insertAdjacentHTML('beforeend',`<div class="gpend" style="${h}">inicio</div>`); } else if(pe) pe.remove();
    $('rd_'+id).textContent=b?'día '+b[0]+' → '+b[1]:(pend[id]?'inicio día '+pend[id]+' · toque el día final':''); };
  root.addEventListener('pointerdown',e=>{ if(locked()) return; const tr=e.target.closest('[data-track]'); if(!tr) return; const id=tr.dataset.track; const bar=e.target.closest('[data-bar]');
    if(bar){ const r=bar.getBoundingClientRect(); const edge=Math.min(14,r.width/4); const z=e.clientX-r.left<edge?'l':(r.right-e.clientX<edge?'r':'m');
      op={id:id,tr:tr,z:z,x0:e.clientX,orig:d.bars[id].slice(),moved:false}; try{ bar.setPointerCapture(e.pointerId); }catch(x){} e.preventDefault(); }
    else if(e.pointerType==='mouse'&&e.button===0){ op={id:id,tr:tr,z:'p',x0:e.clientX,anchor:cellAt(tr,e.clientX),moved:false}; e.preventDefault(); } });
  const mv=e=>{ if(!op) return; const dx=e.clientX-op.x0; if(!op.moved&&Math.abs(dx)<6) return; op.moved=true; e.preventDefault();
    const cw=op.tr.getBoundingClientRect().width/cols;
    if(op.z==='p'){ const c=cellAt(op.tr,e.clientX); d.bars[op.id]=[Math.min(op.anchor,c),Math.max(op.anchor,c)]; delete pend[op.id]; }
    else { const dc=Math.round(dx/cw); let s=op.orig[0], f=op.orig[1];
      if(op.z==='m'){ const len=f-s; s=Math.max(1,Math.min(cols-len,s+dc)); f=s+len; } else if(op.z==='l'){ s=Math.max(1,Math.min(f,s+dc)); } else { f=Math.max(s,Math.min(cols,f+dc)); }
      d.bars[op.id]=[s,f]; }
    paint(op.id); };
  window.addEventListener('pointermove',mv,{passive:false});
  window.addEventListener('pointerup',()=>{ if(!op) return; if(op.moved){ just=Date.now(); onChange(); } op=null; });
  window.addEventListener('pointercancel',()=>{ op=null; });
  root.addEventListener('click',e=>{ if(locked()||Date.now()-just<120) return; const cl=e.target.closest('[data-clr]'); if(cl){ delete d.bars[cl.dataset.clr]; delete pend[cl.dataset.clr]; paint(cl.dataset.clr); onChange(); return; }
    const tr=e.target.closest('[data-track]'); if(!tr) return; const id=tr.dataset.track; const c=cellAt(tr,e.clientX);
    if(e.target.closest('[data-bar]')&&!pend[id]) return;
    if(pend[id]===undefined){ pend[id]=c; paint(id); }
    else { const a=pend[id]; delete pend[id]; d.bars[id]=[Math.min(a,c),Math.max(a,c)]; paint(id); onChange(); } });
}
function stConstruir(el,ctx){ const {C}=ctx.X, d=ctx.d, R=cpmC(C), cols=C.cols; d.bars=d.bars||{}; d.crit=d.crit||{}; d.H=d.H||{};
  const ev=ctx.mode==='eval';
  let n1=ev?ST.n1:ctx.X.n1res; if(!ev&&d._seed!==C.seed){ d._seed=C.seed; ctx.X.n1res=null; n1=null; }
  const lk1=ev?(!!n1||ctx.locked):false; const fin=ctx.res;
  if(!d.t0&&!ctx.locked){ d.t0=Date.now(); ctx.save(); }
  if(ev&&n1&&n1.data&&n1.data.bars&&!Object.keys(d.bars).length) d.bars=JSON.parse(JSON.stringify(n1.data.bars));
  const g1=ev?((n1||ctx.locked)?gradeBars(C,d):null):n1;
  el.innerHTML=`<div class="card">${head('construir','<span class="pill">RA1-I2 · RA2-I2</span>')}
   <div class="grid gx"><div><p>Con la tabla de actividades, dibuje la gráfica de Gantt de <b>${esc(temaDe(C).nombre)}</b> programando cada actividad lo <b>más temprano posible</b> (inicio más cercano) sin violar sus precedencias.</p>
     <div class="note gold"><b>Cómo dibujar:</b> en computadora, arrastre sobre la fila desde el día de inicio hasta el día final; arrastre la barra para moverla o sus bordes para estirarla. En celular, <b>toque la celda del día de inicio y luego la del día final</b>; también puede arrastrar la barra.</div></div>
    <div class="card soft" style="margin:0"><div class="row"><b>Nivel 1 · Barras</b><span class="pill">25 pts</span><span style="margin-left:auto" class="tmr" id="tmr">${mmss(((n1&&n1.seg!=null?n1.seg*1000:((d.t1||Date.now())-(d.t0||Date.now()))))/1000)}</span></div>
     <div class="formula">IC = mayor TC de sus precedentes (0 si no tiene)</div><div class="formula">Inicia el día IC + 1 · termina el día TC = IC + duración</div>${ev?'<p class="hint" style="margin:0">El tiempo hasta calificar el nivel 1 entra al ranking de su sección.</p>':''}</div></div>
   <h3>Actividades</h3>${actTable(C)}

   <div class="legend"><span><i style="background:var(--gold)"></i>Su barra</span>${g1?'<span><i style="background:var(--teal)"></i>Correcta</span><span><i style="background:var(--coral)"></i>Con error</span><span><i style="border:2px dashed var(--gold2)"></i>Posición correcta</span>':''}</div>
   ${lk1?'':`<div class="row" style="margin-top:14px"><button class="btn gold" id="bN1">${ev?'Calificar nivel 1 (barras)':'Revisar barras'}</button><button class="btn ghost" id="bClrAll">Borrar todo</button><span class="mut" id="mN1"></span></div>`}
   ${g1?`<div class="card soft" style="margin-top:14px" id="resN1"><div class="row"><b>Nivel 1 · Barras</b><span class="pill ${g1.score>=20?'teal':(g1.score>=15?'gold':'coral')}" style="margin-left:auto">${g1.score} / 25</span>${n1&&n1.seg!=null?`<span class="pill">tiempo ${mmss(n1.seg)}</span>`:''}${!ev?`<button class="btn ghost sm" id="bSol">${ctx.X.verSol?'Ocultar':'Ver'} posición correcta</button>`:''}</div>
     <ul class="fb">${g1.items.map(i=>`<li class="${i.ok?'ok':'bad'}">${esc(i.t)}${i.ok?'':`<span class="why">${esc(i.why)}</span>`}</li>`).join('')}</ul></div>`:''}
  </div>
  ${g1?`<div class="card" id="n2Box">${n2HTML(C,d,ctx,fin)}</div>`:''}${fin?resBox(ctx,fin,'construir'):''}`;

    const upd=()=>{ const falt=C.acts.filter(a=>!d.bars[a.id]).length; $('bN1').disabled=falt>0; $('mN1').textContent=falt?'Faltan '+falt+' barra(s).':'Listo.'; ctx.save(); };
    wireGrid($('gridBox'),C,cols,d,upd,()=>lk1); upd();
    $('bClrAll').onclick=()=>{ d.bars={}; ctx.save(); stConstruir(el,ctx); };
    $('bN1').onclick=()=>{ const g=gradeBars(C,d); d.t1=Date.now(); const seg=Math.round((d.t1-d.t0)/1000);
      if(ev){ ST.n1={score:g.score,total:25,ind:g.ind,data:{bars:d.bars},seg:seg}; saveLS(); postCaso('detalle',{fase:'construir_n1',seccion:user.sec,caso:C.seed,score:g.score,total:25,ind:g.ind,data:{bars:d.bars},seg:seg});
        postCaso('ranking',{seccion:user.sec,seg:seg,barras:g.score,caso:C.seed}); }
      else { ctx.X.n1res=Object.assign({},g,{seg:seg}); const key=C.seed+'|construir_n1'; if(!PR.logged[key]){ PR.logged[key]=1; postCaso('practica',{seccion:user.sec,estacion:'construir_barras',score:g.score,total:25,seg:seg,caso:C.seed}); } }
      stopTick(); stConstruir(el,ctx); setTimeout(()=>{ const r=$('resN1'); if(r) r.scrollIntoView({behavior:'smooth',block:'start'}); },80); };
  }
  if(!ev&&g1){ $('bSol').onclick=()=>{ ctx.X.verSol=!ctx.X.verSol; stConstruir(el,ctx); }; }
  if(!ev&&n1){ /* práctica: puede seguir corrigiendo barras */ const b=$('bN1'); if(b) b.textContent='Volver a revisar barras'; }
  if(g1) wireN2(el,C,d,ctx,fin);
}
function n2HTML(C,d,ctx,fin){ const R=cpmC(C), lk=ctx.locked; const sol={}; C.acts.forEach(a=>sol[a.id]=[R.by[a.id].IC+1,R.by[a.id].TC]);
  return `<div class="row"><span class="pill gold mono">NIVEL 2</span><span class="pill">10 pts</span></div><h2 style="margin-top:8px">Ruta crítica y holguras</h2>
   <p>Esta es la programación correcta (inicio más cercano). Marque las actividades <b>críticas</b> y escriba la <b>holgura</b> de cada una, en días.</p>
   <div class="formula">TL = menor IL de sus siguientes (la última: TL = duración del proyecto) · IL = TL − duración · Holgura = IL − IC</div>
   <div id="solGrid">${gridHTML(C,C.cols,sol,{edit:false,slack:!!fin,cls:id=>fin?(R.by[id].crit?'crit':'ncrit'):''})}</div>
   <div class="scroll" style="margin-top:12px"><table class="tb"><tr><th>Act.</th><th class="c">¿Crítica?</th><th class="c">Holgura (días)</th>${fin?'<th>Solución</th>':''}</tr>
   ${C.acts.map(a=>{ const x=R.by[a.id]; const mc=fin?(fin.marks['c'+a.id]?'ok':'bad'):'', mh=fin?(fin.marks['h'+a.id]?'ok':'bad'):'';
     return `<tr><td class="mono"><b style="color:var(--gold2)">${a.id}</b> <span class="mut">${esc(a.n)}</span></td><td class="c"><div class="seg ${mc}"><button data-cr="${a.id}" data-v="1" class="${d.crit[a.id]===true?'sel':''}" ${lk?'disabled':''}>Sí</button><button data-cr="${a.id}" data-v="0" class="${d.crit[a.id]===false?'sel':''}" ${lk?'disabled':''}>No</button></div></td>
      <td class="c"><input type="text" inputmode="numeric" class="nin ${mh}" data-h="${a.id}" value="${esc(d.H[a.id]===undefined?'':d.H[a.id])}" ${lk?'disabled':''}></td>${fin?`<td class="mono" style="font-size:12px">IC ${x.IC} · TC ${x.TC} · IL ${x.IL} · TL ${x.TL} · H ${x.H}${x.crit?' · <span class="bad-t">crítica</span>':''}</td>`:''}</tr>`; }).join('')}</table></div>
   ${lk?'':`<div class="row" style="margin-top:14px"><button class="btn gold" id="bN2">${ctx.mode==='eval'?'Calificar estación 3':'Revisar nivel 2'}</button><span class="mut" id="mN2"></span></div>`}`; }
function wireN2(el,C,d,ctx,fin){ fitCw($('solGrid'),C.cols); if(ctx.locked) return;
  const upd=()=>{ const falt=C.acts.filter(a=>d.crit[a.id]===undefined||String(d.H[a.id]===undefined?'':d.H[a.id]).trim()==='').length; $('bN2').disabled=falt>0; $('mN2').textContent=falt?'Complete '+falt+' fila(s).':'Listo.'; ctx.save(); };
  el.querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>{ d.crit[b.dataset.cr]=b.dataset.v==='1'; el.querySelectorAll(`[data-cr="${b.dataset.cr}"]`).forEach(x=>x.classList.toggle('sel',x===b)); upd(); });
  el.querySelectorAll('[data-h]').forEach(i=>i.oninput=()=>{ d.H[i.dataset.h]=i.value.trim(); upd(); });
  upd();
  $('bN2').onclick=()=>{ if(ctx.mode==='eval'){ d.seg=ST.n1?ST.n1.seg:null; ctx.check(null,d); } else { const g=mergeG(ctx.X.n1res||gradeBars(C,d),gradeN2(C,d)); ctx.check(g,d); } };
}

function stControl(el,ctx){ const {C,K}=ctx.X, d=ctx.d, lk=ctx.locked, R=ctx.res; d.cls=d.cls||{}; const RR=cpmC(C);

   <div class="grid g2" style="margin-top:14px">
    <div class="q ${R?(K.cls.every(id=>R.marks['k'+id])?'ok':'bad'):''}"><div class="qh"><span class="qn">A</span><span class="qt">Clasifique el estado de cada actividad al corte</span><span class="qp">4 pts</span></div>
     ${K.cls.map(id=>{ const a=actOf(C,id); const ik=R?R.items.find(i=>i.t.indexOf(lab(C,id)+':')===0):null; return `<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span><b class="mono" style="color:var(--gold2)">${id}</b> ${esc(a.n)} <span class="mut mono">· real ${Math.round(K.real[id]/a.d*100)} % (${K.real[id]} de ${a.d} días)</span></span>
       <div class="seg ${mk(R,'k'+id)}">${['atr','dia','ade'].map(v=>`<button data-cl="${id}" data-v="${v}" class="${d.cls[id]===v?'sel':''}" ${lk?'disabled':''}>${EST_TXT[v]}</button>`).join('')}</div></div>${ik?why(ik.ok,ik.why):''}</div>`; }).join('')}</div>
    <div class="q ${R?(R.marks.b1&&R.marks.b2?'ok':'bad'):''}"><div class="qh"><span class="qn">B</span><span class="qt">Variación de tiempo de ${lab(C,K.X)}</span><span class="qp">5 pts</span></div>
     <p class="mut" style="margin:0 0 8px">Al corte lleva ${K.real[K.X]} de ${X.d} días hechos. Suponga que las demás actividades se cumplen según el plan y que ${K.X} termina lo que le falta a ritmo normal.</p>
     <div class="row"><span>¿Cuántos días de atraso lleva?</span><input type="text" inputmode="numeric" class="nin ${mk(R,'b1')}" data-n="b1" value="${esc(d.b1||'')}" ${lk?'disabled':''}></div>
     <div class="row" style="margin-top:8px"><span>¿En qué día terminaría ahora el proyecto?</span><span class="mut">Día</span><input type="text" inputmode="numeric" class="nin ${mk(R,'b2')}" data-n="b2" value="${esc(d.b2||'')}" ${lk?'disabled':''}></div>
     ${R?why(R.marks.b1,it('Atraso de')[0].why)+why(R.marks.b2,it('Nuevo fin')[0].why):''}</div>
    <div class="q ${R?(R.marks.c1&&R.marks.c2&&R.marks.c3?'ok':'bad'):''}"><div class="qh"><span class="qn">C</span><span class="qt">Variación de costo de ${lab(C,K.Y)} (terminada)</span><span class="qp">5 pts</span></div>
     <table class="tb" style="max-width:420px"><tr><td>Presupuesto (planeado)</td><td class="r mono">${fmtC(K.Bc)}</td></tr><tr><td>Costo real</td><td class="r mono">${fmtC(K.Rc)}</td></tr></table>
     <div class="row" style="margin-top:8px"><span>Variación en ₡ (real − presupuesto)</span><input type="text" inputmode="numeric" class="win ${mk(R,'c1')}" data-n="c1" value="${esc(d.c1||'')}" placeholder="ej. -25000" ${lk?'disabled':''}></div>

     <div class="row" style="margin-top:8px"><span>Interpretación</span><div class="seg ${mk(R,'c3')}">${segB('c3','sob','Sobrecosto')}${segB('c3','aho','Ahorro')}</div></div>
     ${R?why(R.marks.c1&&R.marks.c2&&R.marks.c3,it('Variación de costo')[0].why):''}<p class="hint" style="margin:6px 0 0">Escriba el signo menos si gastó menos de lo presupuestado.</p></div>
    <div class="q ${mk(R,'dAct')}"><div class="qh"><span class="qn">D</span><span class="qt">¿Qué acción correctiva recomienda para el atraso de ${lab(C,K.X)}?</span><span class="qp">3 pts</span></div>

     <tr><td>Costo total</td><td class="r mono">${fmtC(Z.Cplan)}</td><td class="r mono">${fmtC(Z.Creal)}</td><td class="c"><div class="seg ${mk(R,'e1')}">${segB('e1','si','Sí')}${segB('e1','no','No')}</div></td></tr>

    ${R?it('¿Se cumplió').map((x,i)=>why(x.ok,x.why)).join(''):''}</div>
   ${lk?'':`<div class="row" style="margin-top:16px"><button class="btn gold" id="bChk">${ctx.mode==='eval'?'Calificar estación 4 y terminar':'Revisar'}</button><span class="mut" id="mChk"></span></div>`}</div>${R?resBox(ctx,R,'control'):''}`;
  wireRes(el); if(lk) return;

  el.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>{ d.cls[b.dataset.cl]=b.dataset.v; el.querySelectorAll(`[data-cl="${b.dataset.cl}"]`).forEach(x=>x.classList.toggle('sel',x===b)); upd(); });
  el.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>{ d[b.dataset.sg]=b.dataset.v; el.querySelectorAll(`[data-sg="${b.dataset.sg}"]`).forEach(x=>x.classList.toggle('sel',x===b)); upd(); });
  el.querySelectorAll('[data-n]').forEach(i=>i.oninput=()=>{ d[i.dataset.n]=i.value.trim(); upd(); });
  el.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{ d.dAct=+b.dataset.op; el.querySelectorAll('[data-op]').forEach(x=>{ x.classList.remove('ok','bad'); x.classList.toggle('sel',x===b); }); upd(); });
  upd(); $('bChk').onclick=()=>ctx.check(gradeControl(C,K,d),d);
}

function rubricaHTML(ind,marcar){ return `<div class="scroll"><table class="tb rub"><tr><th>Indicador del programa</th><th>Logrado (3) · ≥ 80 %</th><th>En proceso (2) · 60–79 %</th><th>No logrado (1) · &lt; 60 %</th></tr>
  ${INDS.map(i=>{ const v=ind&&ind[i.id]; const lv=v?nivelDe(pct(v[0],v[1])):0; return `<tr><td><b>${i.cod}</b><div class="mut">${esc(i.nombre)}</div>${v?`<div class="mono" style="font-size:12px;margin-top:4px">${v[0]} / ${v[1]} pts · ${pct(v[0],v[1])} %</div>`:''}</td>${[3,2,1].map(n=>`<td class="${marcar&&lv===n?'on':''}">${marcar&&lv===n?`<span class="lvl l${n}">${NIVEL_TXT[n]}</span><br>`:''}${esc(i['n'+n])}</td>`).join('')}</tr>`; }).join('')}</table></div>`; }

}
function panelDatos(){
  const P=PANEL.prog.filter(r=>String(r.Modulo||'').indexOf(MODULE_ID+'_')===0||String(r.Modulo||'')==='incidente_salida_pantalla_'+MODULE_ID);
  const Cs=PANEL.casos.filter(r=>String(r.CasoId||'').indexOf(MODULE_ID+'_')===0);
  const est={};
  const get=n=>{ const k=norm(n); if(!est[k]) est[k]={nombre:String(n).trim(),sec:'',cut:0,fases:{},ind:{},final:null,salidas:0,prac:0,seg:null}; return est[k]; };
  P.forEach(r=>{ if(r.Modulo===MODULE_ID+'_reset'){ const e=get(r.Estudiante); e.cut=Math.max(e.cut,tsN(r.Timestamp)); } });
  Cs.forEach(r=>{ const e=get(r.Nombre); let d={}; try{ d=JSON.parse(r.Texto); }catch(x){} if(d.seccion) e.sec=d.seccion;
    if(r.CasoId===MODULE_ID+'_practica') e.prac++;
    if(r.CasoId===MODULE_ID+'_ranking'&&tsN(r.Timestamp)>e.cut) e.seg=+d.seg; });
  P.forEach(r=>{ const e=get(r.Estudiante); if(tsN(r.Timestamp)<=e.cut) return; const m=String(r.Modulo);
    let x; if(m==='incidente_salida_pantalla_'+MODULE_ID) e.salidas++;
    else if((x=m.match(/_(etapas|leer|construir|control)_paso$/))) e.fases[x[1]]=[+r.Score,+r.Total];
    else if((x=m.match(/_ind(\d)_ra_(.+)_paso$/))) e.ind['ind'+x[1]]=[+r.Score,+r.Total];
    else if(m===MODULE_ID+'_final') e.final=+r.Score; });
  return Object.values(est).filter(e=>Object.keys(e.fases).length||e.final!==null||e.salidas||e.sec||e.prac).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')); }
function panelRender(sec){
  const all=panelDatos(); const L=all.filter(e=>sec==='Todas'||e.sec===sec);
  const nv=v=>v&&v[1]?nivelDe(pct(v[0],v[1])):0;
  const saveC=CASOS; CASOS=PANEL.casos;
  const rk=(sec==='Todas'?SECCIONES:[sec]).map(s=>`<div><h4 style="margin:6px 0;color:var(--gold2)">${s}</h4>${rankingHTML(s,10)}</div>`).join('');
  CASOS=saveC;
  $('modalIn').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">Panel docente · Taller Gantt (11°)</h2><button class="btn ghost sm" style="margin-left:auto" id="pClose">Cerrar ✕</button></div>
   <div class="row" style="margin:12px 0">${['Todas'].concat(SECCIONES).map(s=>`<button class="btn sm ${s===sec?'gold':'ghost'}" data-sec="${s}">${s}</button>`).join('')}<button class="btn teal sm" id="pCsv" style="margin-left:auto">Exportar CSV</button></div>
   <div class="scroll"><table class="tb"><tr><th>Estudiante</th><th>Sección</th>${FASES.map(f=>`<th class="c">E${f.n} ${f.corto}<br><span style="font-weight:400">/${f.total}</span></th>`).join('')}<th class="c">Total</th><th class="c">Tiempo<br>Construir</th><th class="c">Prácticas</th><th class="c">Salidas</th>${INDS.map(i=>`<th>${i.cod}</th>`).join('')}<th></th></tr>
   ${L.map(e=>{ const tot=FASES.reduce((a,f)=>a+(e.fases[f.k]?e.fases[f.k][0]:0),0);
     return `<tr><td>${esc(e.nombre)}</td><td>${esc(e.sec||'—')}</td>${FASES.map(f=>`<td class="c mono">${e.fases[f.k]?e.fases[f.k][0]:'—'}</td>`).join('')}<td class="c mono"><b>${e.final!==null?e.final:tot}</b>${e.final!==null?'':' <span class="mut">(en curso)</span>'}</td><td class="c mono">${e.seg!=null?mmss(e.seg):'—'}</td><td class="c mono">${e.prac}</td><td class="c mono ${e.salidas?'bad-t':''}">${e.salidas}</td>
      ${INDS.map(i=>{ const l=nv(e.ind[i.id]); return `<td>${l?`<span class="lvl l${l}">${l} · ${NIVEL_TXT[l]}</span><div class="mut" style="font-size:11px;max-width:220px">${esc(i['n'+l])}</div>`:'<span class="mut">pendiente</span>'}</td>`; }).join('')}
      <td><button class="btn ghost sm" data-reset="${esc(e.nombre)}">Repetir</button></td></tr>`; }).join('')||`<tr><td colspan="${FASES.length+INDS.length+7}" class="mut">Sin datos en esta sección.</td></tr>`}</table></div>
   <p class="mut">Rúbrica 1–3 por indicador: Logrado ≥ 80 % · En proceso 60–79 % · No logrado &lt; 60 %. «Repetir» anula el intento de evaluación y el estudiante recibe un caso nuevo.</p></div>
   <div class="grid g2"><div class="card"><h3 style="margin-top:0">Ranking por sección · mejor tiempo en «Construir» (≥ 20/25 en barras)</h3><div class="grid g2">${rk}</div></div>
   <div class="card"><h3 style="margin-top:0">Rúbrica de evaluación</h3>${rubricaHTML(null,false)}</div></div>`;
  $('pClose').onclick=()=>$('modal').classList.remove('on');
  $('modalIn').querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>panelRender(b.dataset.sec));
  $('modalIn').querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{ if(!b.dataset.arm){ b.dataset.arm='1'; b.textContent='¿Confirmar?'; b.classList.add('coral'); return; }
    const n=b.dataset.reset; const ts=now(); sheetPost(SH_PROG,{Timestamp:ts,Estudiante:n,Modulo:MODULE_ID+'_reset',Score:'0',Total:'0'});
    PANEL.prog.push({Timestamp:ts,Estudiante:n,Modulo:MODULE_ID+'_reset',Score:'0',Total:'0'}); toast('Reinicio registrado para '+n+'.'); panelRender(sec); });
  $('pCsv').onclick=()=>{ const rows=[['Estudiante','Sección'].concat(FASES.map(f=>'E'+f.n+' '+f.corto+' (/'+f.total+')'),['Total (/100)','Tiempo Construir (s)','Prácticas','Salidas de pantalla'],INDS.map(i=>i.cod+' puntos'),INDS.map(i=>i.cod+' nivel'))];
    L.forEach(e=>{ const tot=FASES.reduce((a,f)=>a+(e.fases[f.k]?e.fases[f.k][0]:0),0); rows.push([e.nombre,e.sec].concat(FASES.map(f=>e.fases[f.k]?e.fases[f.k][0]:''),[e.final!==null?e.final:tot,e.seg!=null?e.seg:'',e.prac,e.salidas],INDS.map(i=>e.ind[i.id]?e.ind[i.id][0]+'/'+e.ind[i.id][1]:''),INDS.map(i=>{ const l=nv(e.ind[i.id]); return l?l+' '+NIVEL_TXT[l]:''; }))); });
    const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='TallerGantt_'+sec+'.csv'; document.body.appendChild(a); a.click(); a.remove(); };
}
$('lnkDocente').onclick=e=>{ e.preventDefault(); panel(); };
window.addEventListener('resize',()=>{ document.querySelectorAll('#gridBox,#solGrid').forEach(b=>{ const g=b.querySelector('.gg'); if(g) fitCw(b,+g.style.getPropertyValue('--cols')); }); });
portada();
})();
</script>
</body>

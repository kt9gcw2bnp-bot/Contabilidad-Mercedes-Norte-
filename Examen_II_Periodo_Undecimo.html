COP).", "Explica el funcionamiento del SICOP, según la normativa vigente y el sitio web oficial."]}, {"ra": "2.2", "nombre": "Identificar lineamientos emitidos por la Contabilidad Nacional aplicados al sector público (Gestión pública, RA 2).", "lecciones": 14, "indicadores": ["Reconoce la importancia de la Contabilidad Nacional para el sector público.", "Distingue algunos de los lineamientos emitidos por la Contabilidad Nacional aplicados al sector público."]}, {"ra": "2.3", "nombre": "Diagramar procesos de tesorería (Gestión pública, RA 3).", "lecciones": 14, "indicadores": ["Contrasta las principales características de la tesorería.", "Explica los procesos de tesorería para la administración del dinero.", "Elabora el presupuesto de tesorería, según la normativa vigente."]}, {"ra": "2.4", "nombre": "Elaborar carteles de licitación (Gestión pública, RA 4).", "lecciones": 14, "indicadores": ["Identifica las principales características del cartel de licitación.", "Confecciona carteles de licitación, según la normativa de contratación vigente."]}, {"ra": "2.5", "nombre": "Desarrollar capacidad de negociación en las PYMES (Gestión pública, RA 5).", "lecciones": 12, "indicadores": ["Distingue las principales características de la Ley 8262 de fortalecimiento de las PYMES.", "Demuestra la capacidad de negociación en las operaciones de una PYME, al resolver escenarios empresariales sencillos."]}, {"ra": "2.6", "nombre": "Fortalecer la identidad de ciudadano en el marco del Gobierno Digital (Gestión pública, RA 6).", "lecciones": 12, "indicadores": ["Reconoce la importancia del Gobierno Digital.", "Enumera los requisitos para que se desarrolle el gobierno electrónico."]}, {"ra": "3.1", "nombre": "Planificar un proyecto (Planificación y evaluación de proyectos, RA 1).", "lecciones": 16, "indicadores": ["Explica las principales características de la administración de proyectos.", "Planifica el proyecto, según las técnicas y parámetros establecidos."]}, {"ra": "3.2", "nombre": "Utilizar técnicas para la evaluación de proyectos: PERT y CPM (Planificación y evaluación de proyectos, RA 2).", "lecciones": 16, "indicadores": ["Resuelve ejercicios relativos a diagramas, reglas de tiempo y programación de proyectos.", "Calcula los tiempos de holgura e identifica rutas críticas.", "Explica el trueque costo-tiempo y la aceleración del proyecto."]}, {"ra": "3.3", "nombre": "Usar software para la administración de proyectos (Planificación y evaluación de proyectos, RA 3).", "lecciones": 16, "indicadores": ["Usa el software como herramienta para la administración de proyectos empresariales.", "Sugiere las formas de seguimiento del avance y manejo de costos."]}], "partes": [{"num": "I", "nombre": "Selección única", "instr": "Lea cada enunciado y marque la letra de la <b>única opción correcta</b>. Cada respuesta correcta vale 1 punto.", "items": [{"tipo": "su", "ra": "2.1", "en": "El SICOP es:", "ops": ["la plataforma electrónica única de compras públicas del Estado", "el sistema de facturación electrónica del Ministerio de Hacienda", "el registro de sociedades mercantiles del Registro Nacional"], "correcta": 0, "pts": 1}, {"tipo": "su", "ra": "2.1", "en": "El SICOP se basa en la experiencia del sistema de compras electrónicas de:", "ops": ["Estados Unidos", "Nueva Zelanda", "Corea del Sur"], "correcta": 2, "pts": 1}, {"tipo": "su", "ra": "2.1", "en": "La característica del SICOP que permite al proveedor consultar carteles, ofertar y dar seguimiento en un solo sitio es la:", "ops": ["firma digital", "ventanilla única", "registro único de proveedores"], "correcta": 1, "pts": 1}, {"tipo": "su", "ra": "2.2", "en": "Según las NICSP, un servicio recibido en diciembre y pagado en enero se registra:", "ops": ["en enero, por la base de efectivo", "en diciembre, por la base de devengo", "en ambos meses, en partes exactamente iguales"], "correcta": 1, "pts": 1}, {"tipo": "su", "ra": "2.3", "en": "La diferencia entre la letra de cambio y el pagaré es que en el pagaré:", "ops": ["quien firma promete pagar él mismo", "quien firma ordena a otro que pague", "no se indica la fecha de pago"], "correcta": 0, "pts": 1}, {"tipo": "su", "ra": "2.3", "en": "Según el principio de control interno de tesorería, quien autoriza, quien paga y quien registra deben ser:", "ops": ["la misma persona", "del mismo nivel jerárquico", "personas distintas"], "correcta": 2, "pts": 1}, {"tipo": "su", "ra": "2.4", "en": "Al cartel de licitación se le llama «la ley del concurso» porque:", "ops": ["es aprobado por la Asamblea Legislativa cada año", "solo lo leen los proveedores inscritos", "contiene las reglas que rigen todo el concurso"], "correcta": 2, "pts": 1}, {"tipo": "su", "ra": "2.4", "en": "Si un requisito del cartel limita la competencia y la aclaración no lo resuelve, el proveedor puede presentar un:", "ops": ["recurso de objeción", "recurso de amparo constitucional", "reclamo de garantía"], "correcta": 0, "pts": 1}, {"tipo": "su", "ra": "2.5", "en": "El ente rector encargado de calificar y apoyar a las PYMES en Costa Rica es el:", "ops": ["MICITT", "MEIC", "MOPT"], "correcta": 1, "pts": 1}, {"tipo": "su", "ra": "2.5", "en": "En una negociación, el BATNA es:", "ops": ["el precio máximo que el cliente está dispuesto a pagar", "la mejor alternativa si la negociación fracasa", "el documento que formaliza el acuerdo"], "correcta": 1, "pts": 1}, {"tipo": "su", "ra": "2.6", "en": "En Costa Rica, la rectoría del Gobierno Digital recae en el:", "ops": ["MEIC", "MIDEPLAN", "MICITT"], "correcta": 2, "pts": 1}, {"tipo": "su", "ra": "2.6", "en": "La desigualdad en el acceso a conectividad, dispositivos y conocimientos digitales se denomina:", "ops": ["brecha digital", "huella digital", "firma digital"], "correcta": 0, "pts": 1}, {"tipo": "su", "ra": "3.1", "en": "¿Cuál de las siguientes situaciones es un <b>proyecto</b> y no una operación?", "ops": ["abrir una nueva sucursal de la panadería", "hornear y vender pan todos los días", "pagar la planilla del p <script>

/* ====================== UTILIDADES ====================== */

function seedRand(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return ((h^=h>>>16)>>>0)/4294967296; }; }
function shuffled(n,key){ const r=seedRand(key); const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function parseNum(x){ if(x==null) return null; let s=String(x).trim().replace(/[₡%\s]/g,'').replace(/[−–—]/g,'-'); if(!s) return null;
  if(s.indexOf('.')>-1&&s.indexOf(',')>-1){ if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(/^-?\d{1,3}([.,]\d{3})+$/.test(s)) s=s.replace(/[.,]/g,''); else s=s.replace(',','.');
  return /^-?(\d+\.?\d*|\.\d+)$/.test(s)?parseFloat(s):null; }

function hasKey(txt,keys){ const t=' '+norm(txt)+' '; return keys.some(k=>t.indexOf(' '+norm(k))>-1||(norm(k).length>5&&t.indexOf(norm(k))>-1)); }

  if(a==null) return 0;

  if(it.tipo==='rr'){ let s=0; it.criterios.forEach(c=>{ if(c.claves&&hasKey(a||'',c.claves)) s+=c.pts; }); return s; }
  if(it.tipo==='ej'){ let s=0; it.pasos.forEach((p,i)=>{ const v=(a||{})['p'+i]; if(v==null||String(v).trim()==='') return; if(p.txt){ if(norm(v).replace(/[^a-z]/g,'')===norm(p.v).replace(/[^a-z]/g,'')) s+=p.pts; } else { const n=parseNum(v); if(n!=null&&Math.abs(n-p.v)<=(p.tol||0)+1e-9) s+=p.pts; } }); return s; }

function calificar(resp,ajustes){ const det={}; let auto=0, fin=0; ITEMS.forEach(it=>{ const s=autoScore(it,(resp||{})[it.id]); auto+=s; const aj=ajustes&&ajustes[it.id]&&ajustes[it.id].p!=null&&ajustes[it.id].p!==''?+ajustes[it.id].p:null; const f=aj!=null?aj:s; fin+=f; det[it.id]=[s,f]; }); return {auto,fin,det}; }

async function getConfig(){ if(DEMO) return lsGet('Config',{}); const d=await jsonp(API+'?action=getConfig'); return (d&&d.ok&&d.value)||{}; }

function filaCalc(r){ let resp={},aj={}; try{ resp=JSON.parse(r.Respuestas||'{}'); }catch(e){} try{ aj=JSON.parse(r.Ajustes||'{}'); }catch(e){} const c=calificar(resp,aj); return {resp,aj,c}; }
function panelRender(){ const a=adm(); const secs=['Todas'].concat(a.secciones);
  const L=PANEL.rows.filter(r=>String(r.Examen||X.id)===X.id&&(PANEL.sec==='Todas'||r.Seccion===PANEL.sec)).sort((x,y)=>String(x.Estudiante).localeCompare(String(y.Estudiante),'es'));
  const ent=L.filter(r=>r.Estado==='entregado'); const prom=ent.length?ent.reduce((s,r)=>s+nota(filaCalc(r).c.fin),0)/ent.length:0;
  $('modalIn').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">Panel docente · ${esc(X.titulo)}</h2><button class="btn ghost sm" style="margin-left:auto" id="pX">Cerrar ✕</button></div>
   ${DEMO?'<div class="note gold">Modo demostración: se muestran solo las entregas hechas en este navegador.</div>':''}
   <div class="kpis" style="margin-top:12px"><div class="kpi"><div class="v">${L.length}</div><div class="t">Estudiantes que ingresaron</div></div><div class="kpi"><div class="v">${ent.length}</div><div class="t">Pruebas entregadas</div></div><div class="kpi"><div class="v">${ent.filter(r=>r.Revisado==='SI').length}</div><div class="t">Revaloradas por usted</div></div><div class="kpi"><div class="v">${fmt2(prom)}</div><div class="t">Calificación promedio</div></div></div>
   <h3>Configuración de la aplicación</h3>
   <div class="grid2"><div><label class="lb">Periodo</label><input type="text" id="cfPer" value="${esc(a.periodo)}"></div><div><label class="lb">Fecha de aplicación</label><input type="text" id="cfFec" value="${esc(a.fecha)}" placeholder="Ej. 10 de noviembre de 2026"></div>
   <div><label class="lb">Valor porcentual (%)</label><input type="text" id="cfVal" value="${esc(a.valor)}" placeholder="Ej. 30"></div><div><label class="lb">Duración (minutos)</label><input type="number" id="cfDur" value="${a.dur}"></div>
   <div><label class="lb">Secciones (separadas por coma)</label><input type="text" id="cfSec" value="${esc(a.secciones.join(', '))}"></div><div><label class="lb">Mostrar la nota al estudiante cuando usted la revalore</label><select id="cfMos"><option value="NO">No</option><option value="SI" ${String(CFG.MostrarNotas||'').toUpperCase()==='SI'?'selected':''}>Sí</option></select></div></div>
   <div class="row" style="margin-top:12px"><button class="btn teal sm" id="cfSave">Guardar configuración</button><button class="btn sm ${a.habil?'coral':'gold'}" id="cfHab">${a.habil?'⏸ Deshabilitar el examen':'▶ Habilitar el examen'}</button><span class="mut">Estado: <b>${a.habil?'habilitado':'deshabilitado'}</b></span></div>
   <h3>Documentos</h3><div class="row"><button class="btn ghost sm" data-pdf="examen" data-ok="1">📄 Examen en PDF</button><button class="btn ghost sm" data-pdf="clave" data-ok="1">📄 Solucionario en PDF</button><button class="btn ghost sm" data-pdf="tabla">📄 Tabla de especificaciones en PDF</button></div>
   <h3>Entregas</h3><div class="row" style="margin-bottom:8px">${secs.map(s=>`<button class="btn sm ${s===PANEL.sec?'gold':'ghost'}" data-sec="${esc(s)}">${esc(s)}</button>`).join('')}<button class="btn teal sm" id="pCsv" style="margin-left:auto">Exportar CSV</button><button class="btn ghost sm" id="pRef">↻ Actualizar</button></div>
   <div class="scroll"><table class="tb"><tr><th>Estudiante</th><th>Sección</th><th>Estado</th><th class="c">Automático</th><th class="c">Final</th><th class="c">Calificación</th><th class="c">Salidas</th><th></th></tr>
   ${L.map(r=>{ const {c}=filaCalc(r); return `<tr><td>${esc(r.Estudiante)}<div class="mut">${esc(r.Cedula)}</div></td><td>${esc(r.Seccion)}</td><td>${r.Estado==='entregado'?'<span class="pill teal">entregado</span>':'<span class="pill gold">en curso</span>'} ${r.Revisado==='SI'?'<span class="pill">revalorado</span>':''}</td><td class="c">${c.auto}</td><td class="c"><b>${c.fin}</b> / ${TOTAL}</td><td class="c">${fmt2(nota(c.fin))}</td><td class="c">${+r.Incidentes||0}</td><td><button class="btn gold sm" data-rev="${esc(r.Clave)}">Revisar y revalorar</button> <button class="btn ghost sm" data-del="${esc(r.Clave)}">Reabrir</button></td></tr>`; }).join('')||`<tr><td colspan="8" class="mut">Sin entregas todavía.</td></tr>`}</table></div>
   <p class="mut">«Automático»: lo que calificó el sistema (en respuesta construida es una sugerencia por palabras clave). «Final»: incluye sus revaloraciones. «Reabrir» borra el intento para que el estudiante pueda hacer la prueba de nuevo.</p></div>
   <div class="card">${tablaResumenItems(L.filter(r=>r.Estado==='entregado'))}</div>`;
  const M=$('modalIn');
  $('pX').onclick=()=>$('modal').classList.remove('on');
  M.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{ PANEL.sec=b.dataset.sec; panelRender(); });
  $('pRef').onclick=async()=>{ PANEL.rows=await getEntregas(); panelRender(); };
  M.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>revisar(b.dataset.rev));
  M.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!b.dataset.arm){ b.dataset.arm=1; b.textContent='¿Confirmar?'; b.classList.add('coral'); return; } await delRow('Entregas','Clave',b.dataset.del); PANEL.rows=PANEL.rows.filter(r=>r.Clave!==b.dataset.del); toast('Intento borrado: el estudiante puede volver a hacer la prueba.'); panelRender(); });
  $('cfSave').onclick=async()=>{ const v={Periodo:$('cfPer').value.trim(),Fecha:$('cfFec').value.trim(),ValorPorcentual:$('cfVal').value.trim().replace('%',''),Duracion:$('cfDur').value.trim(),Secciones:$('cfSec').value.trim(),MostrarNotas:$('cfMos').value};
    for(const k of Object.keys(v)) await setCfg(k,v[k]); Object.assign(CFG,v); toast('Configuración guardada.'); panelRender(); };
  $('cfHab').onclick=async()=>{ const nv=a.habil?'NO':'SI'; await setHab(nv); toast(nv==='SI'?'Examen habilitado.':'Examen deshabilitado.'); panelRender(); };
  $('pCsv').onclick=()=>exportCsv(L);
  wirePdf(M); }
function tablaResumenItems(L){ if(!L.length) return '<h3 style="margin-top:0">Rendimiento por ítem</h3><p class="mut">Aparece cuando haya pruebas entregadas.</p>';
  return `<h3 style="margin-top:0">Rendimiento por ítem (puntaje final promedio)</h3><div class="scroll"><table class="tb"><tr><th>Ítem</th><th>Parte</th><th>RA</th><th class="c">Puntos</th><th class="c">Promedio</th><th class="c">% de logro</th></tr>${ITEMS.map(it=>{ const s=L.reduce((a,r)=>a+filaCalc(r).c.det[it.id][1],0)/L.length; return `<tr><td>${it.n}</td><td>${esc(X.partes[it.parte].num)}</td><td>${esc(it.ra)}</td><td class="c">${it.pts}</td><td class="c">${fmt2(s)}</td><td class="c">${Math.round(s/it.pts*100)} %</td></tr>`; }).join('')}</table></div>`; }
function respTexto(it,a){ if(a==null) return '(sin respuesta)';
  if(it.tipo==='su'){ return a!=null&&it.ops[a]!=null?it.ops[a].replace(/<[^>]+>/g,''):'(sin respuesta)'; }
  if(it.tipo==='corr'){ return it.filas.map((f,i)=>(i+1)+'. '+((it.opciones.find(o=>o.k===(a||[])[i])||{t:'—'}).t)+(a[i]===f.k?'  ✔':'  ✘ (correcta: '+it.opciones.find(o=>o.k===f.k).t+')')).join('\n'); }
  if(it.tipo==='rc') return (a||[]).map((x,i)=>(i+1)+'. '+(x||'—')).join('\n');
  if(it.tipo==='rr') return a||'(sin respuesta)';
  if(it.tipo==='ej') return it.pasos.map((p,i)=>String.fromCharCode(97+i)+') '+((a||{})['p'+i]||'—')+'   [esperado: '+(p.show||p.v)+']').join('\n')+'\n\nProcedimiento:\n'+((a||{}).proc||'—');
  return ''; }
function revisar(clave){ const r=PANEL.rows.find(x=>x.Clave===clave); if(!r) return; const {resp,aj}=filaCalc(r); const a=adm();
  const totalVivo=()=>{ let s=0; ITEMS.forEach(it=>{ const v=$('pt_'+it.id).value; s+=v===''?0:+v; }); $('rvTot').textContent=s; $('rvNota').textContent=fmt2(nota(s)); $('rvPorc').textContent=a.valor?fmt2(nota(s)*(+a.valor)/100)+' %':'—'; };
  $('modalIn').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">Revaloración · ${esc(r.Estudiante)}</h2><span class="pill">${esc(r.Seccion)}</span><span class="pill ${+r.Incidentes?'coral':''}">Salidas de pantalla: ${+r.Incidentes||0}</span><button class="btn ghost sm" style="margin-left:auto" id="rvBack">← Volver</button></div>
   <p class="mut">Puede cambiar el puntaje de <b>cualquier ítem en todas las partes</b> (números enteros entre 0 y el valor del ítem). El valor sugerido es el automático; en respuesta construida verifique siempre la respuesta.</p>
   <div class="kpis"><div class="kpi"><div class="v"><span id="rvTot"></span> / ${TOTAL}</div><div class="t">Puntuación obtenida</div></div><div class="kpi"><div class="v" id="rvNota"></div><div class="t">Calificación</div></div><div class="kpi"><div class="v" id="rvPorc"></div><div class="t">Porcentaje obtenido (valor ${a.valor?esc(a.valor)+' %':'sin definir'})</div></div><div class="kpi"><div class="v">${calificar(resp,null).auto}</div><div class="t">Puntaje automático</div></div></div></div>`+
   X.partes.map(p=>`<div class="card"><h3 style="margin-top:0">${esc(p.num)} parte · ${esc(p.nombre)} (${p.pts} pts)</h3>${p.items.map(it=>{ const s=autoScore(it,resp[it.id]); const cur=aj[it.id]&&aj[it.id].p!=null&&aj[it.id].p!==''?aj[it.id].p:s;
     return `<div class="rev"><div class="row"><b>${it.n}.</b><span style="flex:1">${it.en.replace(/<[^>]+>/g,'').slice(0,160)}</span><span class="pill">${esc(it.ra)}</span>${esConstruida(it)?'<span class="pill gold">revisar</span>':''}</div>
      <div class="ans">${esc(respTexto(it,resp[it.id]))}</div>
      ${it.tipo==='su'?`<div class="mut">Correcta: ${it.ops[it.correcta].replace(/<[^>]+>/g,'')}</div>`:''}${it.modelo?`<div class="mut"><b>Respuesta esperada:</b> ${it.modelo}</div>`:''}${it.criterios?`<div class="mut"><b>Criterios:</b> ${it.criterios.map(c=>c.t+' ('+c.pts+')').join(' · ')}</div>`:''}
      <div class="row" style="margin-top:8px"><span class="mut">Automático: <b>${s}</b> / ${it.pts}</span><label class="mut" for="pt_${it.id}">Puntaje final:</label><input class="pt" type="number" min="0" max="${it.pts}" step="1" id="pt_${it.id}" value="${cur}"><span class="mut">/ ${it.pts}</span><input type="text" id="cm_${it.id}" value="${esc((aj[it.id]||{}).c||'')}" placeholder="Comentario (opcional)" style="flex:1;min-width:180px"></div></div>`; }).join('')}</div>`).join('')+
   `<div class="card"><div class="row"><button class="btn gold" id="rvSave">Guardar revaloración</button><span class="mut" id="rvMsg"></span></div></div>`;
  ITEMS.forEach(it=>{ const e=$('pt_'+it.id); e.oninput=()=>{ let v=e.value===''?'':Math.round(+e.value); if(v!==''&&(v<0||v>it.pts)) v=Math.max(0,Math.min(it.pts,v)); if(String(v)!==e.value) e.value=v; totalVivo(); }; });
  totalVivo(); $('rvBack').onclick=()=>panelRender();
  $('rvSave').onclick=async()=>{ const A={}; ITEMS.forEach(it=>{ const v=$('pt_'+it.id).value, c=$('cm_'+it.id).value.trim(); const s=autoScore(it,resp[it.id]); if((v!==''&&+v!==s)||c) A[it.id]={p:v===''?null:+v,c}; if(v!==''&&+v===s&&c) A[it.id].p=+v; });
    const c=calificar(resp,A); const n=nota(c.fin); const porc=a.valor?Math.round(n*(+a.valor))/100:'';
    const upd={Clave:r.Clave,Ajustes:JSON.stringify(A),PuntajeFinal:c.fin,Nota:n,Porcentaje:porc,Revisado:'SI',RevisadoEl:nowIso()};
    await post('Entregas','Clave',upd); Object.assign(r,upd); $('rvMsg').textContent='✓ Revaloración guardada: '+c.fin+' / '+TOTAL+' · calificación '+fmt2(n); toast('Revaloración guardada.'); };
}
function exportCsv(L){ const a=adm(); const head=['Estudiante','Cédula','Sección','Estado','Inicio','Entrega','Salidas'].concat(ITEMS.map(it=>'Ítem '+it.n+' ('+it.pts+')'),['Automático','Puntuación final','Total','Calificación','Porcentaje','Revisado']);
  const rows=[head]; L.forEach(r=>{ const {c}=filaCalc(r); const n=nota(c.fin); rows.push([r.Estudiante,r.Cedula,r.Seccion,r.Estado,r.Inicio,r.Entrega||'',+r.Incidentes||0].concat(ITEMS.map(it=>c.det[it.id][1]),[c.auto,c.fin,TOTAL,fmt2(n),a.valor?fmt2(n*(+a.valor)/100):'',r.Revisado||'NO'])); });
  const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const el=document.createElement('a'); el.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); el.download=X.id+'_'+PANEL.sec+'.csv'; document.body.appendChild(el); el.click(); el.remove(); }
$('lnkDoc').onclick=e=>{ e.preventDefault(); panel(); };
window.__EX={ITEMS,TOTAL,autoScore,calificar,mostrarPrint,X};
/* ====================== ARRANQUE ====================== */
(async()=>{ const pdf=qs.get('pdf'); if(pdf){ CFG=await getConfig(); $('hT').textContent=X.titulo; if(pdf==='tabla'||qs.get('pin')===PIN) mostrarPrint(pdf,true); document.body.classList.add('printing'); return; } portada(); })();
})();
</script>
</body>

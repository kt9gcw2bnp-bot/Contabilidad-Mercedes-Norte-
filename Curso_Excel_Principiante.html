<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel Principiante · Curso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{ --bg:#050506; --card:#0e0e11; --card2:#15151a; --card3:#1c1c22; --line:#2a2a31; --line2:#3a3a44; --tx:#ECE9E1; --mut:#9b978d; --gold:#C9973F; --gold2:#F4DD7A; --teal:#2FC2AD; --coral:#EF6A5B; --blue:#5B8DEF;
  --ff:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace; }
*{ box-sizing:border-box; }
html{ scroll-padding-top:72px; }
html,body{ margin:0; background:var(--bg); color:var(--tx); font-family:var(--ff); font-size:15px; line-height:1.5; }
body{ overflow-x:hidden; }
button,input,select{ font-family:inherit; font-size:14px; }
a{ color:var(--gold2); }
.top{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; padding:10px 18px; background:rgba(5,5,6,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.logo{ width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,var(--gold),var(--gold2)); display:grid; place-items:center; color:#1a1206; font-weight:700; font-size:13px; flex:0 0 auto; }
.top h1{ font-size:16px; margin:0; font-weight:600; letter-spacing:.2px; }
.top .sub{ font-size:12px; color:var(--mut); }
.top .who{ margin-left:auto; text-align:right; font-size:12.5px; color:var(--mut); }
.top .who b{ color:var(--tx); font-weight:600; }
.wrap{ width:100%; max-width:1600px; margin:0 auto; padding:18px 22px 70px; }
@media(max-width:600px){ .wrap{ padding:12px 12px 60px; } .top{ padding:8px 12px; } .top .sub{ display:none; } }
.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
@media(max-width:600px){ .card{ padding:14px; border-radius:14px; } }
.card.soft{ background:var(--card2); }
h2{ margin:0 0 6px; font-size:22px; font-weight:600; }
h3{ margin:14px 0 8px; font-size:16px; font-weight:600; color:var(--gold2); }
.mut{ color:var(--mut); font-size:13px; }
.mono{ font-family:var(--mono); }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.grid{ display:grid; gap:16px; }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)); } .g3{ grid-template-columns:repeat(3,minmax(0,1fr)); } .g4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.gx{ grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); }
@media(max-width:1100px){ .g4{ grid-template-columns:repeat(2,minmax(0,1fr)); } .gx{ grid-template-columns:minmax(0,1fr); } }
@media(max-width:760px){ .g2,.g3,.g4{ grid-template-columns:minmax(0,1fr); } }
.btn{ border:1px solid transparent; border-radius:11px; padding:10px 16px; font-weight:600; cursor:pointer; background:var(--card3); color:var(--tx); transition:transform .12s, background .2s, opacity .2s; }
.btn:hover{ transform:translateY(-1px); }
.btn.gold{ background:linear-gradient(135deg,var(--gold),#e0b357); color:#1a1206; }
.btn.teal{ background:var(--teal); color:#03201b; }
.btn.ghost{ background:transparent; border-color:var(--line2); }
.btn.coral{ background:var(--coral); color:#260704; }
.btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
.btn.sm{ padding:6px 11px; font-size:12.5px; border-radius:9px; }
input[type=text],select{ width:100%; background:var(--card2); color:var(--tx); border:1px solid var(--line2); border-radius:10px; padding:10px 12px; }
input:focus,select:focus{ outline:none; border-color:var(--gold); }
input[readonly]{ opacity:.85; }
label.lb{ display:block; font-size:13px; font-weight:600; margin:10px 0 4px; color:var(--mut); }
.pill{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600; background:var(--card3); border:1px solid var(--line2); color:var(--tx); }
.pill.gold{ background:rgba(201,151,63,.15); border-color:rgba(201,151,63,.45); color:var(--gold2); }
.pill.teal{ background:rgba(47,194,173,.12); border-color:rgba(47,194,173,.45); color:var(--teal); }
.pill.coral{ background:rgba(239,106,91,.12); border-color:rgba(239,106,91,.45); color:var(--coral); }
.note{ border-radius:12px; padding:11px 14px; font-size:13.5px; margin:10px 0; border:1px solid var(--line2); background:var(--card2); }
.note.ok{ border-color:rgba(47,194,173,.5); background:rgba(47,194,173,.08); }
.note.bad{ border-color:rgba(239,106,91,.55); background:rgba(239,106,91,.08); }
.note.gold{ border-color:rgba(201,151,63,.5); background:rgba(201,151,63,.08); }
.ok-t{ color:var(--teal); font-weight:600; } .bad-t{ color:var(--coral); font-weight:600; }
.hidden{ display:none !important; }
/* stepper */
.steps{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; scrollbar-width:thin; }
.st{ flex:1 0 132px; min-width:132px; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:9px 12px; cursor:pointer; text-align:left; color:var(--tx); transition:border-color .2s, background .2s; }
.st .n{ font-family:var(--mono); font-size:11px; color:var(--mut); }
.st .t{ font-size:13px; font-weight:600; display:block; }
.st .s{ font-size:11.5px; color:var(--mut); }
.st.cur{ border-color:var(--gold); background:rgba(201,151,63,.08); }
.st.done .s{ color:var(--teal); }
.st.lock{ opacity:.4; cursor:not-allowed; }
/* meter */
.meter{ margin:8px 0; }
.meter .lbl{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; gap:8px; }
.meter .tr{ height:10px; background:var(--card3); border-radius:6px; overflow:hidden; }
.meter .fl{ height:100%; width:0; border-radius:6px; transition:width 1s cubic-bezier(.2,.8,.2,1); background:linear-gradient(90deg,var(--gold),var(--gold2)); }
/* tokens */
.tray{ display:flex; flex-wrap:wrap; gap:8px; min-height:56px; padding:10px; border:1px dashed var(--line2); border-radius:12px; background:var(--card2); }
.tray.empty::after{ content:'(todo ubicado — toque una ficha ubicada y luego esta bandeja para devolverla)'; color:var(--mut); font-size:12px; }
.tok{ display:inline-flex; align-items:center; gap:8px; padding:8px 11px; border-radius:11px; background:var(--card3); border:1px solid var(--line2); color:var(--tx); cursor:grab; user-select:none; -webkit-user-select:none; touch-action:none; text-align:left; font-size:13px; line-height:1.3; transition:border-color .15s, box-shadow .15s, transform .15s; }
.tok small{ display:block; color:var(--mut); font-size:11px; }
.tok:hover{ border-color:var(--gold); }
.tok.sel{ border-color:var(--gold2); box-shadow:0 0 0 3px rgba(244,221,122,.25); transform:translateY(-1px); }
.tok.ok{ border-color:var(--teal); } .tok.bad{ border-color:var(--coral); }
.tok .ic{ width:26px; height:26px; flex:0 0 auto; }
.dragghost{ position:fixed; z-index:200; pointer-events:none; padding:8px 12px; border-radius:11px; background:var(--gold); color:#1a1206; font-weight:600; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.5); transform:translate(-50%,-120%); max-width:260px; }
.armed [data-slot]{ cursor:copy; }
.armed .bin, .armed .sl-rect{ animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse{ 50%{ stroke:var(--gold2); border-color:var(--gold2); } }
.hint{ font-size:12.5px; color:var(--mut); }
/* bins */
.bins{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
@media(max-width:600px){ .bins{ grid-template-columns:1fr; } }
.bin{ border:1.5px dashed var(--line2); border-radius:14px; padding:12px; min-height:150px; background:var(--card2); transition:border-color .2s; }
.bin h4{ margin:0 0 4px; font-size:15px; }
.bin .d{ font-size:12px; color:var(--mut); margin-bottom:8px; }
.bin .lst{ display:flex; flex-direction:column; gap:6px; }
.bin.P h4{ color:var(--gold2); } .bin.E h4{ color:var(--teal); }
/* option cards */
.opts{ display:flex; flex-direction:column; gap:7px; }
.opt{ text-align:left; background:var(--card2); border:1px solid var(--line2); border-radius:11px; padding:9px 12px; color:var(--tx); cursor:pointer; font-size:13.5px; line-height:1.4; transition:border-color .15s, background .15s; }
.opt:hover{ border-color:var(--gold); }
.opt.sel{ border-color:var(--gold2); background:rgba(201,151,63,.12); }
.opt.ok{ border-color:var(--teal); background:rgba(47,194,173,.1); }
.opt.bad{ border-color:var(--coral); background:rgba(239,106,91,.1); }
.opt:disabled{ cursor:default; }
.cat{ background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:12px; }
.cat .h{ font-weight:600; font-size:14px; margin-bottom:8px; color:var(--gold2); display:flex; gap:8px; align-items:center; }
.cat .h .num{ font-family:var(--mono); font-size:11px; color:var(--mut); }
/* program list */
.prog{ display:flex; flex-direction:column; gap:8px; }
.blk{ display:grid; grid-template-columns:64px 1fr auto; align-items:center; gap:10px; background:var(--card2); border:1px solid var(--line2); border-radius:12px; padding:8px 10px; touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; transition:border-color .15s, transform .2s, background .2s; }
.blk .h{ font-family:var(--mono); color:var(--gold2); font-size:13px; }
.blk .t{ font-size:14px; }
.blk .ud{ display:flex; gap:4px; }
.blk .ud button{ width:34px; height:34px; border-radius:9px; border:1px solid var(--line2); background:var(--card3); color:var(--tx); cursor:pointer; font-size:14px; }
.blk.sel{ border-color:var(--gold2); box-shadow:0 0 0 3px rgba(244,221,122,.2); }
.blk.ok{ border-color:var(--teal); } .blk.bad{ border-color:var(--coral); }
.blk.drop{ background:rgba(201,151,63,.12); }
/* svg plans */
.plan{ width:100%; overflow-x:auto; border-radius:14px; border:1px solid var(--line); background:#0a0a0d; }
.plan svg{ display:block; width:100%; height:auto; min-width:600px; max-height:74vh; }
.plan.small svg{ min-width:520px; }
[data-slot]{ cursor:pointer; }
svg [data-slot]:focus{ outline:none; }
svg [data-slot]:focus .sl-rect{ stroke:var(--gold2); }
[data-occ]{ touch-action:none; }
.legend{ display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--mut); margin-top:8px; }
/* checklist */
.chk{ display:flex; gap:10px; align-items:flex-start; padding:9px 11px; border:1px solid var(--line2); border-radius:11px; background:var(--card2); margin:6px 0; cursor:pointer; font-size:13.5px; }
.chk input{ margin-top:3px; width:18px; height:18px; accent-color:var(--gold); flex:0 0 auto; }
.chk.ok{ border-color:var(--teal); } .chk.bad{ border-color:var(--coral); }
/* items feedback */
.fb{ list-style:none; padding:0; margin:8px 0 0; }
.fb li{ padding:8px 10px 8px 34px; border-radius:10px; margin:5px 0; position:relative; font-size:13.5px; background:var(--card2); border:1px solid var(--line); }
.fb li::before{ position:absolute; left:10px; top:8px; font-weight:700; font-family:var(--mono); }
.fb li.ok::before{ content:'✓'; color:var(--teal); } .fb li.bad::before{ content:'✗'; color:var(--coral); }
.fb li.bad{ border-color:rgba(239,106,91,.45); }
.fb li .why{ display:block; color:var(--mut); font-size:12.5px; margin-top:2px; }
.fb li.bad .why{ color:#f2b3aa; }
/* impr cards */
.imp{ border:1px solid var(--line2); border-radius:16px; padding:18px; background:linear-gradient(160deg,var(--card2),var(--card)); animation:rise .35s ease; }
@keyframes rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
.imp .clock{ font-family:var(--mono); color:var(--gold2); font-size:12px; }
.dots{ display:flex; gap:6px; margin:8px 0 12px; }
.dots i{ width:28px; height:6px; border-radius:4px; background:var(--card3); display:block; }
.dots i.d3{ background:var(--teal); } .dots i.d1{ background:var(--gold); } .dots i.d0{ background:var(--coral); } .dots i.cur{ outline:1px solid var(--gold2); }
/* gauge */
.gauge{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
.gauge svg{ width:130px; height:130px; flex:0 0 auto; }
.gauge circle.v{ transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }
/* tables */
.tb{ width:100%; border-collapse:collapse; font-size:13px; }
.tb th,.tb td{ border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top; }
.tb th{ color:var(--mut); font-weight:600; font-size:12px; }
.tb td.c,.tb th.c{ text-align:center; }
.lvl{ display:inline-block; padding:2px 8px; border-radius:8px; font-size:11.5px; font-weight:600; }
.lvl.l3{ background:rgba(47,194,173,.15); color:var(--teal); } .lvl.l2{ background:rgba(201,151,63,.15); color:var(--gold2); } .lvl.l1{ background:rgba(239,106,91,.15); color:var(--coral); }
.rub td.on{ outline:2px solid var(--gold); outline-offset:-2px; background:rgba(201,151,63,.07); }
.scroll{ overflow-x:auto; }
/* banner + toast + modal */
#banner{ position:fixed; left:0; right:0; bottom:0; z-index:90; background:var(--coral); color:#1f0503; font-weight:700; text-align:center; padding:9px 12px; font-size:14px; display:none; }
#toast{ position:fixed; left:50%; bottom:56px; transform:translateX(-50%); background:var(--card3); border:1px solid var(--gold); color:var(--tx); padding:10px 16px; border-radius:12px; font-size:13.5px; z-index:120; display:none; max-width:92vw; }
#modal{ position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.82); display:none; overflow:auto; padding:20px 12px; }
#modal.on{ display:block; }
#modalIn{ max-width:1500px; margin:0 auto; }
footer{ text-align:center; color:var(--mut); font-size:12px; padding:20px 12px 40px; }
footer a{ color:var(--mut); }
.case{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; }
.guest{ background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:9px 11px; font-size:13px; }
.guest b{ display:block; font-size:13.5px; }
.guest .r{ font-family:var(--mono); font-size:11px; color:var(--gold2); }
.print-only{ display:none; }
@media print{
  @page{ margin:14mm; }
  html,body{ background:#fff !important; color:#111 !important; }
  .top,.steps,footer,.noprint,#banner,#toast{ display:none !important; }
  .wrap{ padding:0; max-width:none; }
  .card{ background:#fff !important; border:1px solid #bbb; color:#111; break-inside:avoid; }
  .card.soft{ background:#fff !important; }
  h2,h3{ color:#111 !important; } .mut{ color:#444 !important; }
  .tb th,.tb td{ border-color:#ccc; color:#111; }
  .lvl{ border:1px solid #888; color:#111 !important; background:#fff !important; }
  .plan{ border-color:#bbb; background:#fff; } .plan svg{ min-width:0 !important; }
  .print-only{ display:block; }
  .meter .tr{ background:#eee; border:1px solid #ccc; } .meter .fl{ background:#888 !important; }
  .note{ background:#fff !important; color:#111; border-color:#bbb; }
  .fb li{ background:#fff; color:#111; } .fb li .why{ color:#333 !important; }
}
</style>
<style>
.tok{ max-width:100%; }
.bin .lst .tok{ cursor:grab; }
.imp p{ margin:6px 0; }
</style>
<style>
.fig{ background:#0b0b0e; border:1px solid var(--line); border-radius:14px; padding:10px; margin:6px 0 12px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.fig svg{ width:100%; min-width:760px; height:auto; display:block; }
@media(max-width:760px){ .fig svg{ min-width:960px; } .fig::before{ content:'↔ Deslice para ver toda la pantalla de Excel'; display:block; font-size:12px; color:var(--gold2); margin:0 4px 6px; position:sticky; left:0; } }
.fig .cap{ font-size:12.5px; color:var(--mut); margin:6px 4px 0; }
.leg{ list-style:none; padding:0; margin:8px 0 4px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px 16px; }
@media(max-width:760px){ .leg{ grid-template-columns:minmax(0,1fr); } }
.leg li{ display:flex; gap:10px; align-items:flex-start; font-size:13.5px; }
.leg li b.n{ flex:0 0 24px; height:24px; border-radius:50%; background:var(--gold); color:#1a1206; display:grid; place-items:center; font-size:12px; }
.leg li span b{ color:var(--gold2); }
.pasos{ border:1px solid rgba(47,194,173,.4); background:rgba(47,194,173,.06); border-radius:12px; padding:10px 14px; margin:10px 0; }
.pasos h4{ margin:2px 0 6px; color:var(--teal); font-size:14px; }
.pasos ol{ margin:0; padding-left:20px; } .pasos li{ margin:3px 0; font-size:13.5px; }
.lec{ font-size:14px; } .lec p{ margin:6px 0; }
.lec h4{ color:var(--gold2); margin:14px 0 4px; font-size:15px; }
kbd{ font-family:var(--mono); font-size:12px; background:var(--card3); border:1px solid var(--line2); border-bottom-width:2px; border-radius:6px; padding:1px 6px; }
code{ font-family:var(--mono); font-size:12.5px; background:#1c1c22; border:1px solid var(--line2); border-radius:6px; padding:1px 5px; color:var(--gold2); }
.dat{ font-size:12.5px; } .dat td,.dat th{ padding:4px 8px !important; } .dat td.n{ text-align:right; font-family:var(--mono); }
.dat th{ background:#1c1c22; color:var(--gold2) !important; }
.lecbtn{ margin-top:6px; }
</style>
</head>

resione <kbd>Enter</kbd> para ir directo a ella.</span></li><li><b class=\"n\">4</b><span><b>Celda activa</b>: la celda con borde verde, donde se escribe. Su dirección es letra de columna + número de fila: D2.</span></li><li><b class=\"n\">5</b><span><b>Números de fila</b>: identifican cada fila: 1, 2, 3… Una hoja tiene más de un millón de filas.</span></li><li><b class=\"n\">6</b><span><b>Barra de título</b>: muestra el nombre del archivo. Dice «Libro1» hasta que usted lo guarde con un nombre.</span></li><li><b class=\"n\">7</b><span><b>Barra de fórmulas</b>: muestra el contenido real de la celda. Aquí se revisan y corrigen las fórmulas.</span></li><li><b class=\"n\">8</b><span><b>Encabezados de columna</b>: las letras A, B, C… Un clic selecciona la columna completa.</span></li><li><b class=\"n\">9</b><span><b>Hojas del libro</b>: un archivo (libro) puede tener varias hojas: Compras, Ventas… El botón <b>+</b> agrega una; doble clic en la pestaña le cambia el nombre.</span></li><li><b class=\"n\">10</b><span><b>Zoom</b>: acerca o aleja la vista. No cambia el tamaño de impresión.</span></li></ol><div class=\"pasos\"><h4>Hágalo en Excel</h4><ol><li>Abra Excel y elija <b>Libro en blanco</b>.</li><li>Haga clic en la celda B3 y observe el cuadro de nombres.</li><li>Escriba <code>H20</code> en el cuadro de nombres y presione <kbd>Enter</kbd>.</li><li>Haga doble clic en la pestaña <b>Hoja1</b> y cámbiele el nombre a <b>Compras</b>.</li><li>Guarde con <kbd>Ctrl</kbd>+<kbd>G</kbd> (o Archivo › Guardar como) con el nombre <code>Practica_SuNombre.xlsx</code>.</li></ol></div></div>", "secs": [{"id": "f0a", "tipo": "bins", "ind": "ind1", "titulo": "¿Qué parte de la ventana es?", "pts": 1, "min": 200, "hint": "", "bins": [{"k": "cinta", "h": "Cinta de opciones"}, {"k": "barra", "h": "Barra de fórmulas"}, {"k": "nombre", "h": "Cuadro de nombres"}, {"k": "hojas", "h": "Hojas del libro"}], "items": [{"id": "i0", "t": "Muestra la fórmula que hay detrás de un resultado", "k": "barra", dle\" fill=\"#1a1206\">4</text><text x=\"1035\" y=\"243.0\" font-size=\"12.5\" font-weight=\"600\" fill=\"#ECE9E1\">Controlador de relleno:</text><text x=\"1035\" y=\"258.0\" font-size=\"12.5\" font-weight=\"600\" fill=\"#ECE9E1\">arrastre hacia abajo</text><path d=\"M1000 301.0 C813.5 301.0 813.5 301 627.0 301\" fill=\"none\" stroke=\"#C9973F\" stroke-width=\"2.4\" marker-end=\"url(#ah)\"/><circle cx=\"627.0\" cy=\"301\" r=\"4\" fill=\"none\" stroke=\"#F4DD7A\" stroke-width=\"1.5\"/><rect x=\"1000\" y=\"281.0\" width=\"208\" height=\"40\" rx=\"9\" fill=\"#15151a\" stroke=\"#C9973F\" stroke-width=\"1.4\"/><circle cx=\"1018\" cy=\"301.0\" r=\"11\" fill=\"#C9973F\"/><text x=\"1018\" y=\"305.5\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" fill=\"#1a1206\">5</text><text x=\"1035\" y=\"306.0\" font-size=\"12.5\" font-weight=\"600\" fill=\"#ECE9E1\">Se copia a D3:D6</text></svg><div class=cap>Al escribir =B2*C2, Excel colorea cada referencia. Luego, el cuadrito verde de la esquina (controlador de relleno) copia la fórmula hacia abajo.</div></div><ol class=\"leg\"><li><b class=\"n\">1</b><span><b>Signo =</b>: toda fórmula empieza con =. Sin él, Excel lo toma como texto.</span></li><li><b class=\"n\">2</b><span><b>Referencia azul</b>: al hacer clic en B2 mientras escribe, Excel la pinta de un color en la hoja y en la fórmula.</span></li><li><b class=\"n\">3</b><span><b>Referencia roja</b>: cada referencia lleva su propio color: así comprueba que la fórmula usa las celdas correctas.</span></li><li><b class=\"n\">4</b><span><b>Controlador de relleno</b>: el cuadrito de la esquina inferior derecha. Arrástrelo hacia abajo o haga doble clic en él.</span></li><li><b class=\"n\">5</b><span><b>Fórmula copiada</b>: en D3 la fórmula se ajusta sola a =B3*C3, en D4 a =B4*C4… (referencias relativas).</span></li><li><b class=\"n\">6</b><span><b>Enter</b>: confirma la fórmula. <kbd>Esc</kbd> cancela lo que está escribiendo.</span></li></ol><h4>Operadores y jerarquía</h4><d function seedRand(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return function(){ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return ((h^=h>>>16)>>>0)/4294967296; }; }
function orden(key,n){ const r=seedRand(norm(user.name)+'|'+key); const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const nivelDe=p=>p>=80?3:(p>=60?2:1);
const NIVEL_TXT={3:'Logrado',2:'En proceso',1:'No logrado'};
const pct=(s,t)=>t?Math.round(s/t*1000)/10:0;
const LETRAS='ABCDEFGH';
function parseNum(x,big){ if(x==null) return null; let s=String(x).trim().replace(/[₡%\s]/g,'').replace(/[−–—]/g,'-'); if(!s) return null;
  if(s.indexOf('.')>-1&&s.indexOf(',')>-1){ if(s.lastIndexOf(',')>s.lastIndexOf('.')) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,''); }
  else if(big&&/^-?[1-9]\d{0,2}([.,]\d{3})+$/.test(s)) s=s.replace(/[.,]/g,'');
  else s=s.replace(',','.');
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return null; return parseFloat(s); }
function numOk(c,raw){ const v=parseNum(raw,c.big); if(v===null) return false; if(Math.abs(v-c.v)<=(c.tol||0)+1e-9) return true; return (c.alts||[]).some(a=>Math.abs(v-a[0])<=a[1]+1e-9); }

/* =================== PUENTE SHEETS =================== */
function jsonp(url){ return new Promise(res=>{ const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e5); const s=document.createElement('script');
  window[cb]=d=>{ res(d); delete window[cb]; s.remove(); }; s.onerror=()=>{ res({rows:[]}); delete window[cb]; s.remove(); };
  s.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+cb; document.body.appendChild(s); setTimeout(()=>{ if(window[cb]){ res({rows:[]}); delete window[cb]; s.remove(); } },12000); }); }
function sheetGet(n){ return jsonp(SHEET_API_URL+'?sheet='+encodeURIComponent(n)).then(d=>(d&&d.rows)?d.rows:[]); }
function sheetPost(n,row){ // contrato JSON del doPost {sheet,row:[...]} con Content-Type text/plain. NO cambiar.
  return fetch(SHEET_API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({sheet:n,row:Object.keys(row).map(k=>row[k])}),keepalive:true}).catch(()=>{}); }
function postProg(est,mod,score,total){ return sheetPost(SH_PROG,{Timestamp:now(),Estudiante:est,Modulo:mod,Score:String(score),Total:String(total)}); }
function postCaso(obj){ return sheetPost(SH_DATA,{Timestamp:now(),CasoId:MODULE_ID+'_detalle',Nombre:user.name,Texto:JSON.stringify(obj)}); }
function nombrePortal(){ try{ return (new URLSearchParams(location.search).get('nombre')||'').trim()||null; }catch(e){ return null; } }

/* =================== CONTENIDO =================== */
const INDS=C.inds, FASES=C.fases;
function secMax(s){ switch(s.tipo){ case 'bins': case 'order': return s.items.length*s.pts; case 'mc': return s.qs.length*s.pts; case 'num': return s.campos.reduce((a,c)=>a+c.pts,0); case 'imp': return s.casos.length*3; } return 0; }
FASES.forEach((f,i)=>{ f.n=i; f.total=f.secs.reduce((a,s)=>a+secMax(s),0); });
const TOTAL=FASES.reduce((a,f)=>a+f.total,0);
const indCod=id=>{ const i=INDS.find(x=>x.id===id); return i?i.cod:id; };
function indsDe(f){ const s=new Set(); f.secs.forEach(x=>{ if(x.tipo==='imp') x.casos.forEach(c=>s.add(c.ind||x.ind)); else s.add(x.ind); }); return [...s].map(indCod); }

/* =================== CALIFICACIÓN =================== */
function addInd(ind,k,s,t){ ind[k]=ind[k]||[0,0]; ind[k][0]+=s; ind[k][1]+=t; }
function gradeSec(s,a,items,ind){ a=a||{}; let sc=0;
  if(s.tipo==='bins'){ const bh=k=>{ const b=s.bins.find(b=>b.k===k); return b?b.h:'(sin ubicar)'; };
    s.items.forEach(it=>{ const ok=a[it.id]===it.k; if(ok) sc+=s.pts; addInd(ind,s.ind,ok?s.pts:0,s.pts);
      items.push({ok:ok,t:'«'+it.t+'» → '+bh(a[it.id])+(ok?'':' — correcto: '+bh(it.k)),why:ok?'':(it.why||s.why||'')}); }); }
  else if(s.tipo==='order'){ const o=a.orden||[]; const T=id=>{ const x=s.items.find(y=>y.id===id); return x?x.t:'(vacío)'; };
    s.items.forEach((it,i)=>{ const ok=o[i]===it.id; if(ok) sc+=s.pts; addInd(ind,s.ind,ok?s.pts:0,s.pts);
      items.push({ok:ok,t:s.titulo+' · posición '+(i+1)+': '+T(o[i])+(ok?'':' — correcto: '+it.t),why:ok?'':(s.why||'')}); }); }
  else if(s.tipo==='mc'){ s.qs.forEach(q=>{ const i=a[q.id]; const ok=i!==undefined&&!!q.ops[i]&&q.ops[i][1]===1; if(ok) sc+=s.pts; addInd(ind,s.ind,ok?s.pts:0,s.pts);
      items.push({ok:ok,t:q.t+' ('+(i!==undefined&&q.ops[i]?q.ops[i][0]:'sin responder')+')',why:ok?'':q.why}); }); }
  else if(s.tipo==='num'){ s.campos.forEach(c=>{ const ok=numOk(c,a[c.id]); if(ok) sc+=c.pts; addInd(ind,s.ind,ok?c.pts:0,c.pts);
      items.push({ok:ok,t:c.lbl+': '+(a[c.id]||'(vacío)')+(ok?'':' — correcto: '+c.show),why:ok?'':(c.why||'')}); }); }
  else if(s.tipo==='imp'){ s.casos.forEach(c=>{ const i=a[c.id]; const p=i!==undefined?c.ops[i][1]:0; sc+=p; addInd(ind,c.ind||s.ind,p,3);
      items.push({ok:p===3,t:c.t+': '+(i!==undefined?c.ops[i][0]:'(sin decidir)')+' ('+p+'/3)',why:p===3?'':c.regla}); }); }
  return sc; }
function gradeFase(n,d){ const items=[], ind={}; let s=0; FASES[n].secs.forEach(sec=>{ s+=gradeSec(sec,d[sec.id],items,ind); }); return {score:s,total:FASES[n].total,ind:ind,items:items}; }
function faltan(s,a){ a=a||{}; switch(s.tipo){ case 'bins': return s.items.filter(it=>!a[it.id]).length; case 'order': return 0;
  case 'mc': return s.qs.filter(q=>a[q.id]===undefined).length; case 'num': return s.campos.filter(c=>parseNum(a[c.id],c.big)===null).length; case 'imp': return s.casos.filter(c=>a[c.id]===undefined).length; } return 0; }

/* =================== ESTADO =================== */
let user={name:'',sec:''}, ST=null, vista=0, enCurso=false, bloqueado=false, salidas=0;
const LSK=()=>MODULE_ID+'_'+norm(user.name);
function saveLS(){ try{ localStorage.setItem(LSK(),JSON.stringify(Object.assign({},ST,{ts:now()}))); }catch(e){} }
function loadLS(){ try{ const s=localStorage.getItem(LSK()); return s?JSON.parse(s):null; }catch(e){ return null; } }
function nuevoST(){ return {sec:user.sec,fases:{},draft:{},final:null}; }
function fasesHechas(){ return FASES.filter(f=>ST.fases[f.n]).length; }
function totalesInd(){ const ind={}; FASES.forEach(f=>{ const x=ST.fases[f.n]; if(x&&x.ind) Object.keys(x.ind).forEach(k=>addInd(ind,k,x.ind[k][0],x.ind[k][1])); }); return ind; }
function totalScore(){ return FASES.reduce((a,f)=>a+(ST.fases[f.n]?(+ST.fases[f.n].score||0):0),0); }

document.addEventListener('visibilitychange',()=>{

});

/* =================== ARRASTRE + TOQUE (motor común) =================== */
function dnd(root,o){
  let sel=null, drag=null, ghost=null, just=0;
  const mark=()=>{ root.querySelectorAll('[data-tok]').forEach(e=>e.classList.toggle('sel',!!sel&&e.dataset.tok===sel)); root.classList.toggle('armed',!!sel); };
  root.addEventListener('pointerdown',e=>{ if(o.locked()) return; if(e.target.closest('button.ud-b')) return; const t=e.target.closest('[data-tok]'); if(!t||!root.contains(t)) return;
    drag={id:t.dataset.tok,x:e.clientX,y:e.clientY,moved:false,label:t.dataset.lbl||t.textContent.trim().slice(0,60)}; });
  const mv=e=>{ if(!drag) return; if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8) return;
    if(!drag.moved){ drag.moved=true; ghost=document.createElement('div'); ghost.className='dragghost'; ghost.textContent=drag.label; document.body.appendChild(ghost); sel=drag.id; mark(); }
    ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px'; e.preventDefault(); };
  const up=e=>{ if(!drag) return; const d=drag; drag=null; if(!d.moved) return; just=Date.now(); if(ghost){ ghost.remove(); ghost=null; }
    const el=document.elementFromPoint(e.clientX,e.clientY); const s=el&&el.closest('[data-slot]'); const tr=el&&el.closest('[data-tray]');
    sel=null; if(s&&root.contains(s)) o.drop(d.id,s.dataset.slot,true); else if(tr&&root.contains(tr)) o.drop(d.id,null,true); else mark(); };
  window.addEventListener('pointermove',mv,{passive:false}); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',()=>{ if(ghost){ ghost.remove(); ghost=null; } drag=null; });
  root.addEventListener('click',e=>{ if(o.locked()||Date.now()-just<60) return; if(e.target.closest('button.ud-b')) return;
    const s=e.target.closest('[data-slot]'); const t=e.target.closest('[data-tok]'); const tr=e.target.closest('[data-tray]');
    if(sel&&s&&root.contains(s)&&!(t&&t.dataset.tok===sel)){ const id=sel; sel=null; o.drop(id,s.dataset.slot); return; }
    if(t&&root.contains(t)){ const id=t.dataset.tok; sel=(sel===id)?null:id; mark(); return; }
    if(sel&&tr&&root.contains(tr)){ const id=sel; sel=null; o.drop(id,null); return; } });
  root.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-slot],[data-tok]')&&e.target.tagName!=='BUTTON'){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); } });
}

/* =================== PORTADA =================== */
function portada(){
  const np=nombrePortal(); $('who').innerHTML='';
  $('app').innerHTML=`<div class="grid gx">
   <div class="card"><span class="pill gold">${esc(C.pill)} · ~${FASES.reduce((a,f)=>a+f.min,0)} min · ${FASES.length} fases · ${TOTAL} pts</span>
    <h2 style="margin-top:12px;font-size:28px">${esc(C.portadaTitulo)}</h2>
    ${C.portadaHTML}
    <div class="note gold"><b>Importante:</b> cada fase se califica <b>una sola vez</b> y al final obtiene su <b>informe del curso</b> con los temas que debe reforzar. Puede arrastrar las fichas o, en el celular, <b>tocar una ficha y luego tocar el lugar</b> donde va.</div>
    <div class="grid g2"><div><label class="lb" for="inNom">Nombre completo</label><input type="text" id="inNom" ${np?'readonly':''} value="${np?esc(np):''}" placeholder="Nombre y apellidos" autocomplete="off"></div>
     <div><label class="lb" for="inSec">Sección</label><select id="inSec"><option value="">Seleccione…</option>${SECCIONES.map(s=>`<option>${s}</option>`).join('')}</select></div></div>
    <div class="row" style="margin-top:14px"><button class="btn gold" id="bIn">${esc(C.botonEntrar)}</button><span id="mIn" class="mut"></span></div></div>
   <div class="card soft"><h3 style="margin-top:0">Ruta del curso</h3>
    ${FASES.map(f=>`<div class="row" style="margin:8px 0;flex-wrap:nowrap"><span class="pill mono">F${f.n}</span><div style="flex:1"><b>${esc(f.titulo)}</b><div class="mut">${f.total} pts · ~${f.min} min · ${esc(f.temas)}</div></div></div>`).join('')}
    <h3>Indicadores (rúbrica)</h3>${INDS.map(i=>`<div class="mut" style="margin:4px 0"><b style="color:var(--tx)">${i.cod}</b> · ${esc(i.nombre)}</div>`).join('')}</div></div>`;
  $('bIn').onclick=entrar; $('inNom').addEventListener('keydown',e=>{ if(e.key==='Enter') entrar(); });
}
function entrar(){
  const n=$('inNom').value.trim().replace(/\s+/g,' '), s=$('inSec').value;
  if(n.split(' ').length<2){ $('mIn').innerHTML='<span class="bad-t">Escriba su nombre y al menos un apellido.</span>'; return; }
  if(!s){ $('mIn').innerHTML='<span class="bad-t">Seleccione su sección.</span>'; return; }
  user={name:n,sec:s}; $('mIn').textContent='Cargando su avance…'; $('bIn').disabled=true;
  Promise.all([sheetGet(SH_PROG),sheetGet(SH_DATA)]).then(([prog,casos])=>{
    const me=norm(n);
    const mine=prog.filter(r=>norm(r.Estudiante)===me&&String(r.Modulo||'').indexOf(MODULE_ID+'_')===0);
    const cut=Math.max(0,...mine.filter(r=>r.Modulo===MODULE_ID+'_reset').map(r=>tsN(r.Timestamp)));
    const after=mine.filter(r=>tsN(r.Timestamp)>cut);
    const fin=after.filter(r=>r.Modulo===MODULE_ID+'_final').pop();
    ST=nuevoST();
    casos.filter(r=>r.CasoId===MODULE_ID+'_detalle'&&norm(r.Nombre)===me&&tsN(r.Timestamp)>cut).forEach(r=>{ let d={}; try{ d=JSON.parse(r.Texto); }catch(e){}
      if(typeof d.fase==='number'&&!ST.fases[d.fase]) ST.fases[d.fase]={score:d.score,total:d.total,ind:d.ind,data:d.data,ts:r.Timestamp}; if(d.fase==='final'&&d.fecha) ST.fecha=d.fecha; });
    const re=new RegExp('^'+MODULE_ID+'_fase(\\d+)_paso$');
    after.forEach(r=>{ const m=String(r.Modulo).match(re); if(m&&!ST.fases[+m[1]]) ST.fases[+m[1]]={score:+r.Score,total:+r.Total,ind:null,data:null,ts:r.Timestamp}; });
    const loc=loadLS();
    if(loc&&tsN(loc.ts)>cut){ Object.keys(loc.fases||{}).forEach(k=>{ if(!ST.fases[k]||!ST.fases[k].data) ST.fases[k]=loc.fases[k]; }); ST.draft=loc.draft||{}; if(loc.final) ST.final=loc.final; if(loc.fecha) ST.fecha=loc.fecha; }
    else if(loc){ try{ localStorage.removeItem(LSK()); }catch(e){} }
    if(fin&&!ST.final) ST.final={ts:fin.Timestamp,score:+fin.Score};
    ST.sec=s; saveLS();
    if(ST.final){ bloqueado=true; enCurso=false; vista='inf'; render(); return; }
    if(fasesHechas()===FASES.length){ finalizar(); return; }
    enCurso=true; const p=FASES.find(f=>!ST.fases[f.n]); vista=p.n; render();
  });
}

/* =================== NAVEGACIÓN =================== */
function puedeVer(k){ if(bloqueado) return true; if(k==='inf') return !!ST.final; return k===0||!!ST.fases[k]||!!ST.fases[k-1]; }
function render(){
  $('who').innerHTML=`<b>${esc(user.name)}</b><br>${esc(user.sec)} · ${totalScore()} / ${TOTAL}`;
  const steps=FASES.map(f=>{ const x=ST.fases[f.n]; return `<button class="st ${vista===f.n?'cur':''} ${x?'done':''} ${puedeVer(f.n)?'':'lock'}" data-v="${f.n}"><span class="n">FASE ${f.n}</span><span class="t">${esc(f.corto)}</span><span class="s">${x?'✓ '+x.score+' / '+x.total:(puedeVer(f.n)?'En curso · '+f.total+' pts':'Bloqueada')}</span></button>`; }).join('')
    +`<button class="st ${vista==='inf'?'cur':''} ${ST.final?'done':''} ${puedeVer('inf')?'':'lock'}" data-v="inf"><span class="n">CIERRE</span><span class="t">Informe del curso</span><span class="s">${ST.final?'✓ '+totalScore()+' / '+TOTAL:'Al terminar'}</span></button>`;
  $('app').innerHTML=`<div class="steps noprint">${steps}</div><div id="stage"></div>`;
  document.querySelectorAll('.st').forEach(b=>b.onclick=()=>{ const v=b.dataset.v==='inf'?'inf':+b.dataset.v; if(!puedeVer(v)) return; vista=v; render(); });
  const el=$('stage');
  if(vista==='inf') renderInforme(el); else renderFase(el,vista);
  window.scrollTo(0,0);
}
function cab(n,extra){ const f=FASES[n]; return `<div class="row"><span class="pill gold mono">FASE ${n}</span><span class="pill">${f.total} pts · ~${f.min} min</span>${extra||''}</div><h2 style="margin-top:8px">${esc(f.titulo)}</h2>`; }
function resultadoHTML(n){ const x=ST.fases[n]; if(!x) return '';
  const g=x.data?gradeFase(n,x.data):null; const items=g?g.items:[]; const malos=items.filter(i=>!i.ok), buenos=items.filter(i=>i.ok);
  return `<div class="card" id="res${n}"><div class="row"><h3 style="margin:0">Resultado de la fase ${n}</h3><span class="pill ${x.score/x.total>=.8?'teal':(x.score/x.total>=.6?'gold':'coral')}" style="margin-left:auto">${x.score} / ${x.total} pts</span></div>
   <div class="meter"><div class="tr"><div class="fl" data-w="${pct(x.score,x.total)}"></div></div></div>
   <p class="mut" style="margin:4px 0">Fase calificada: puede revisarla, pero ya no se puede volver a contestar.</p>
   ${malos.length?`<h3>Lo que debe repasar (con la explicación)</h3><ul class="fb">${malos.map(i=>`<li class="bad">${esc(i.t)}${i.why?`<span class="why">${esc(i.why)}</span>`:''}</li>`).join('')}</ul>`:'<div class="note ok"><b>¡Fase perfecta!</b> Domina todos los temas de esta fase.</div>'}
   ${buenos.length?`<details style="margin-top:8px"><summary class="mut">Ver aciertos (${buenos.length})</summary><ul class="fb">${buenos.map(i=>`<li class="ok">${esc(i.t)}</li>`).join('')}</ul></details>`:''}
   <div class="row" style="margin-top:12px">${n<FASES.length-1?`<button class="btn gold" data-go="${n+1}">Continuar a la fase ${n+1} →</button>`:`<button class="btn gold" data-go="inf">Ver mi informe del curso →</button>`}</div></div>`; }
function wireResultado(el){ el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ const v=b.dataset.go==='inf'?'inf':+b.dataset.go; if(v==='inf'&&!ST.final) return; if(v!=='inf'&&!puedeVer(v)) return; vista=v; render(); });
  setTimeout(()=>el.querySelectorAll('.fl[data-w]').forEach(f=>f.style.width=f.dataset.w+'%'),60); }
function completar(n,d){
  if(ST.fases[n]||bloqueado) return; const g=gradeFase(n,d);
  ST.fases[n]={score:g.score,total:g.total,ind:g.ind,data:d,ts:now()}; delete ST.draft[n]; saveLS();
  postProg(user.name,MODULE_ID+'_fase'+n+'_paso',g.score,g.total);
  postCaso({fase:n,seccion:user.sec,titulo:FASES[n].titulo,score:g.score,total:g.total,ind:g.ind,data:d,errores:g.items.filter(i=>!i.ok).map(i=>i.t)});
  if(fasesHechas()===FASES.length){ finalizar(); return; }
  render(); setTimeout(()=>{ const r=$('res'+n); if(r) r.scrollIntoView({behavior:'smooth',block:'start'}); },80);
}
function finalizar(){
  const tot=totalScore(), ind=totalesInd(); const fecha=now();
  INDS.forEach((i,k)=>{ const v=ind[i.id]||[0,0]; postProg(user.name,MODULE_ID+'_ind'+(k+1)+'_ra_'+i.cod+'_paso',v[0],v[1]); });
  postProg(user.name,MODULE_ID+'_final',tot,TOTAL);
  const fases={}; FASES.forEach(f=>{ const x=ST.fases[f.n]; fases['fase'+f.n]=x?[x.score,x.total]:null; });
  postCaso({fase:'final',seccion:user.sec,fecha:fecha,total:tot,de:TOTAL,fases:fases,ind:ind,niveles:INDS.reduce((o,i)=>{ const v=ind[i.id]||[0,0]; o[i.id]=nivelDe(pct(v[0],v[1])); return o; },{}),salidas:salidas});
  ST.final={ts:fecha,score:tot}; ST.fecha=fecha; saveLS(); enCurso=false; vista='inf'; render();
}

/* =================== SECCIONES =================== */
function initSec(s){ if(s.tipo!=='order') return {};
  let o=orden('o'+s.id,s.items.length).map(i=>s.items[i].id); if(o.every((id,i)=>id===s.items[i].id)) o.reverse(); return {orden:o}; }
function secDesc(s){ switch(s.tipo){
  case 'bins': return s.items.length+' fichas · '+s.pts+' pt c/u';
  case 'order': return s.items.length+' posiciones · '+s.pts+' pt c/u';
  case 'mc': return s.qs.length+' preguntas · '+s.pts+' pt'+(s.pts>1?'s':'')+' c/u';
  case 'num': return s.campos.length+' respuestas · '+secMax(s)+' pts';
  case 'imp': return s.casos.length+' decisiones · 3 pts c/u'; } return ''; }
function secHead(s,i){ return `<div class="row"><h3 style="margin:0">${LETRAS[i]}. ${esc(s.titulo)} <span class="mut" style="font-weight:400">(${secDesc(s)})</span></h3><span class="pill" style="margin-left:auto">${s.tipo==='imp'?'Varios indicadores':indCod(s.ind)}</span></div>${s.hint?`<p class="hint">${s.hint}</p>`:''}${s.contexto||''}`; }
function mcHTML(q,sel,locked,key){ const ord=orden(key+q.id,q.ops.length);
  return `<div class="cat"><b style="font-size:14px;display:block;margin-bottom:6px">${esc(q.t)}</b><div class="opts">${ord.map(i=>{ const s=sel===i; const cls=locked?(q.ops[i][1]?'ok':(s?'bad':'')):(s?'sel':''); return `<button class="opt ${cls}" data-q="${q.id}" data-i="${i}" ${locked?'disabled':''}>${esc(q.ops[i][0])}</button>`; }).join('')}</div>${locked&&!(q.ops[sel]||[])[1]?`<div class="mut" style="margin-top:6px;color:#f2b3aa">${esc(q.why)}</div>`:''}</div>`; }
const SEC={
 bins(s,root,a,locked,n,upd){ const ord=orden('b'+s.id,s.items.length).map(i=>s.items[i]); const bh=k=>(s.bins.find(b=>b.k===k)||{}).h||'';
  root.innerHTML=`<div id="z_${s.id}">${locked?'':`<div class="tray" data-tray="1" id="tr_${s.id}"></div><p class="hint">Arrastre cada ficha a su casilla, o tóquela y luego toque la casilla. Para devolver una ficha, tóquela y toque la bandeja.</p>`}
   <div class="bins" style="grid-template-columns:repeat(auto-fit,minmax(${s.min||220}px,1fr))">${s.bins.map((b,bi)=>`<div class="bin" data-slot="${esc(b.k)}"><h4 style="color:${bi%2?'var(--teal)':'var(--gold2)'}">${esc(b.h)}</h4>${b.d?`<div class="d">${esc(b.d)}</div>`:''}<div class="lst" id="bn_${s.id}_${bi}"></div></div>`).join('')}</div></div>`;
  const chip=it=>{ const st=locked?(a[it.id]===it.k?'ok':'bad'):''; return `<div class="tok ${st}" data-tok="${it.id}" data-lbl="${esc(it.t.slice(0,60))}" tabindex="0" role="button"><span>${esc(it.t)}${locked&&st==='bad'?`<small>Va en: ${esc(bh(it.k))}</small>`:''}</span></div>`; };
  const draw=()=>{ if(!locked){ const rest=ord.filter(it=>!a[it.id]); $('tr_'+s.id).innerHTML=rest.map(chip).join(''); $('tr_'+s.id).classList.toggle('empty',!rest.length); }
    s.bins.forEach((b,bi)=>{ $('bn_'+s.id+'_'+bi).innerHTML=ord.filter(it=>a[it.id]===b.k).map(chip).join(''); }); upd(); };
  draw(); if(locked) return;
  dnd($('z_'+s.id),{locked:()=>!!ST.fases[n],drop:(id,slot)=>{ if(slot) a[id]=slot; else delete a[id]; saveLS(); draw(); }}); },
 order(s,root,a,locked,n,upd){ const corr=s.items.map(i=>i.id); const T=id=>s.items.find(x=>x.id===id).t;
  root.innerHTML=`<div class="prog" id="z_${s.id}"></div><div id="x_${s.id}"></div>`;
  const draw=()=>{ $('z_'+s.id).innerHTML=a.orden.map((id,i)=>{ const st=locked?(corr[i]===id?'ok':'bad'):'';
     return `<div class="blk ${st}" data-tok="${id}" data-slot="${i}" data-lbl="${esc(T(id))}" tabindex="0" role="button"><span class="h">${s.etiquetas?esc(s.etiquetas[i]):(i+1)+'.'}</span><span class="t">${esc(T(id))}</span>${locked?'<span></span>':`<span class="ud"><button class="ud-b" data-up="${i}" aria-label="Subir">▲</button><button class="ud-b" data-dn="${i}" aria-label="Bajar">▼</button></span>`}</div>`; }).join('');
    if(locked){ if(a.orden.some((id,i)=>id!==corr[i])) $('x_'+s.id).innerHTML=`<details style="margin-top:8px"><summary class="mut">Ver el orden correcto</summary><ol class="mut">${s.items.map(x=>`<li>${esc(x.t)}</li>`).join('')}</ol></details>`; return; }
    $('z_'+s.id).querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; if(i>0){ [a.orden[i-1],a.orden[i]]=[a.orden[i],a.orden[i-1]]; saveLS(); draw(); } });
    $('z_'+s.id).querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.dn; if(i<a.orden.length-1){ [a.orden[i+1],a.orden[i]]=[a.orden[i],a.orden[i+1]]; saveLS(); draw(); } }); upd(); };
  draw(); if(locked) return;
  dnd($('z_'+s.id),{locked:()=>!!ST.fases[n],drop:(id,slot,viaDrag)=>{ if(slot===null) return draw(); const from=a.orden.indexOf(id), to=+slot; if(from===to) return draw();
    if(viaDrag){ a.orden.splice(from,1); a.orden.splice(to,0,id); } else { [a.orden[from],a.orden[to]]=[a.orden[to],a.orden[from]]; } saveLS(); draw(); }}); },
 mc(s,root,a,locked,n,upd){ root.innerHTML=`<div class="grid g2">${s.qs.map(q=>mcHTML(q,a[q.id],locked,'m'+s.id)).join('')}</div>`;
  if(locked) return;
  root.querySelectorAll('.opt[data-q]').forEach(b=>b.onclick=()=>{ a[b.dataset.q]=+b.dataset.i; root.querySelectorAll(`.opt[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.toggle('sel',x===b)); saveLS(); upd(); }); },
 num(s,root,a,locked,n,upd){ root.innerHTML=`<div class="grid g3">${s.campos.map(c=>{ const v=a[c.id]||''; const st=locked?(numOk(c,v)?'ok':'bad'):'';
    return `<div class="cat"><label class="lb" style="margin-top:0;color:var(--tx)" for="n_${s.id}_${c.id}">${esc(c.lbl)} <span class="mono mut" style="font-weight:400">(${c.pts} pt${c.pts>1?'s':''})</span></label><input type="text" ${c.neg?'':'inputmode="decimal"'} id="n_${s.id}_${c.id}" data-f="${c.id}" value="${esc(v)}" ${locked?'readonly':''} placeholder="${esc(c.ph||'')}" autocomplete="off" style="${st==='ok'?'border-color:var(--teal)':(st==='bad'?'border-color:var(--coral)':'')}">${locked?(st==='ok'?'<div class="ok-t" style="font-size:12.5px;margin-top:4px">✓ Correcto</div>':`<div style="font-size:12.5px;margin-top:4px;color:#f2b3aa">✗ Correcto: ${esc(c.show)}${c.why?' · '+esc(c.why):''}</div>`):''}</div>`; }).join('')}</div>`;
  if(locked) return; root.querySelectorAll('input[data-f]').forEach(i=>i.oninput=()=>{ a[i.dataset.f]=i.value; saveLS(); upd(); }); },
 imp(s,root,a,locked,n,upd){
  const card=(c,ix)=>{ const i=a[c.id]; const ord=orden('i'+s.id+c.id,c.ops.length); const ans=i!==undefined;
    return `<div class="imp" id="imp_${s.id}_${c.id}"><div class="row"><span class="clock">${esc(c.hora||'')} · Situación ${ix+1} de ${s.casos.length}</span><span class="pill" style="margin-left:auto">${indCod(c.ind||s.ind)}</span></div>
     <h3 style="margin-top:6px">${esc(c.t)}</h3><p>${esc(c.sit)}</p><p class="mut" style="margin:0 0 6px">¿Qué hace usted?</p>
     <div class="opts">${ord.map(k=>{ const o=c.ops[k]; const cls=ans?(o[1]===3?'ok':(k===i?(o[1]===1?'sel':'bad'):'')):''; return `<button class="opt ${cls}" data-c="${c.id}" data-i="${k}" ${ans?'disabled':''}>${esc(o[0])}</button>`; }).join('')}</div>
     ${ans?`<div class="note ${c.ops[i][1]===3?'ok':(c.ops[i][1]===1?'gold':'bad')}"><b>Consecuencia (${c.ops[i][1]}/3):</b> ${esc(c.ops[i][2])}<br><b>Regla:</b> ${esc(c.regla)}</div>`:''}</div>`; };
  const draw=()=>{ const actual=s.casos.findIndex(c=>a[c.id]===undefined);
    root.innerHTML=`<p class="mut" style="margin-top:0">Cada decisión es <b>definitiva</b>: al elegir verá la consecuencia y la regla. Mejor decisión 3 pts, aceptable 1 pt, inadecuada 0.</p><div class="dots">${s.casos.map(c=>{ const i=a[c.id]; return `<i class="${i!==undefined?'d'+c.ops[i][1]:''}"></i>`; }).join('')}</div>
     <div class="grid g2">${s.casos.map((c,ix)=>(locked||a[c.id]!==undefined||ix===actual)?card(c,ix):'').join('')}</div>`;
    upd(); if(locked) return;
    root.querySelectorAll('.opt[data-c]').forEach(b=>b.onclick=()=>{ if(ST.fases[n]) return; const c=b.dataset.c; if(a[c]!==undefined) return; a[c]=+b.dataset.i; saveLS(); draw();
      const nx=s.casos.find(x=>a[x.id]===undefined); const t=nx?$('imp_'+s.id+'_'+nx.id):$('bCal'); if(t) setTimeout(()=>t.scrollIntoView({behavior:'smooth',block:'center'}),60); }); };
  draw(); }
};
function renderFase(el,n){
  const f=FASES[n], done=ST.fases[n]; const locked=!!done;
  if(done&&!done.data){ el.innerHTML=`<div class="card">${cab(n)}<p class="mut">Fase registrada en la plataforma (${done.score}/${done.total}).</p></div>${resultadoHTML(n)}`; wireResultado(el); return; }
  const d=locked?done.data:(ST.draft[n]=ST.draft[n]||{});
  f.secs.forEach(s=>{ if(!d[s.id]) d[s.id]=initSec(s); });
  el.innerHTML=`<div class="card">${cab(n,`<span class="pill">${indsDe(f).join(' · ')}</span>`)}<p style="margin-bottom:0">${f.intro}</p>${f.ficha?`<div class="card soft" style="margin:14px 0 0">${f.ficha}</div>`:''}</div>
   ${f.secs.map((s,i)=>`<div class="card" id="sec_${s.id}">${secHead(s,i)}<div id="body_${s.id}" style="margin-top:10px"></div></div>`).join('')}
   ${locked?'':`<div class="card"><div class="row"><button class="btn gold" id="bCal" disabled>Calificar fase ${n}</button><span class="mut" id="mCal"></span></div></div>`}${resultadoHTML(n)}`;
  const upd=()=>{ if(locked||!$('bCal')) return; const falt=f.secs.reduce((a,s)=>a+faltan(s,d[s.id]),0); $('bCal').disabled=falt>0; $('mCal').textContent=falt?'Faltan '+falt+' respuestas.':'Listo para calificar.'; };
  f.secs.forEach(s=>SEC[s.tipo](s,$('body_'+s.id),d[s.id],locked,n,upd));
  upd();
  if(locked){ wireResultado(el); return; }
  $('bCal').onclick=()=>completar(n,d);
}

/* =================== INFORME =================== */
function rubricaHTML(ind,marcar){ return `<div class="scroll"><table class="tb rub"><tr><th>Indicador</th><th>Logrado (3) · ≥ 80 %</th><th>En proceso (2) · 60–79 %</th><th>No logrado (1) · &lt; 60 %</th></tr>
  ${INDS.map(i=>{ const v=ind&&ind[i.id]; const lv=v?nivelDe(pct(v[0],v[1])):0; return `<tr><td><b>${i.cod}</b><div class="mut">${esc(i.nombre)}</div>${v?`<div class="mono" style="font-size:12px;margin-top:4px">${v[0]} / ${v[1]} pts · ${pct(v[0],v[1])} %</div>`:''}</td>${[3,2,1].map(k=>`<td class="${marcar&&lv===k?'on':''}">${marcar&&lv===k?`<span class="lvl l${k}">${NIVEL_TXT[k]}</span><br>`:''}${esc(i['n'+k])}</td>`).join('')}</tr>`; }).join('')}</table></div>`; }
function gaugeHTML(s,t){ const r=52, Cc=2*Math.PI*r, p=t?s/t:0; return `<svg viewBox="0 0 130 130"><circle cx="65" cy="65" r="${r}" fill="none" stroke="#1c1c22" stroke-width="12"/><circle class="v" cx="65" cy="65" r="${r}" fill="none" stroke="#C9973F" stroke-width="12" stroke-linecap="round" stroke-dasharray="${Cc}" stroke-dashoffset="${Cc}" data-off="${Cc*(1-p)}" transform="rotate(-90 65 65)"/><text x="65" y="66" text-anchor="middle" font-size="28" font-weight="700" fill="#ECE9E1" font-family="Space Grotesk, sans-serif">${s}</text><text x="65" y="86" text-anchor="middle" font-size="12" fill="#9b978d" font-family="IBM Plex Mono, monospace">de ${t}</text></svg>`; }
function renderInforme(el){
  const tot=totalScore(), ind=totalesInd();
  const fecha=new Date(ST.fecha||(ST.final&&ST.final.ts)||Date.now()).toLocaleDateString('es-CR',{day:'numeric',month:'long',year:'numeric'});
  const lv=nivelDe(pct(tot,TOTAL));
  const rep=[]; FASES.forEach(f=>{ const x=ST.fases[f.n]; if(x&&x.data){ const g=gradeFase(f.n,x.data); g.items.filter(i=>!i.ok).forEach(i=>rep.push({f:f.n,t:i.t,why:i.why})); } });
  el.innerHTML=`${bloqueado?`<div class="card soft noprint"><span class="pill teal">Actividad ya completada</span><p style="margin-bottom:0">Usted ya completó esta actividad. Aquí está su resultado y su rúbrica. Solo su docente puede habilitar un nuevo intento.</p></div>`:''}
   <div class="card"><div class="row"><div><span class="pill gold">Informe del curso</span><h2 style="margin-top:8px">${esc(C.informeTitulo)}</h2>
    <div class="mut">${esc(user.name)} · Sección ${esc(user.sec)} · ${esc(fecha)}</div><div class="mut">${esc(C.materia)}</div></div>
    <div class="row noprint" style="margin-left:auto"><button class="btn gold" id="bPrint">Imprimir informe</button></div></div>
    <div class="gauge" style="margin-top:14px">${gaugeHTML(tot,TOTAL)}<div style="flex:1;min-width:240px">
     ${FASES.map(f=>{ const x=ST.fases[f.n]; return `<div class="meter"><div class="lbl"><span>F${f.n} · ${esc(f.titulo)}</span><span class="mono">${x?x.score:0} / ${f.total}</span></div><div class="tr"><div class="fl" data-w="${x?pct(x.score,f.total):0}"></div></div></div>`; }).join('')}
     <div class="mut">Nivel global: <span class="lvl l${lv}">${NIVEL_TXT[lv]}</span></div></div></div></div>
   <div class="card"><h3 style="margin-top:0">Rúbrica por indicador</h3>${rubricaHTML(ind,true)}</div>
   <div class="card"><h3 style="margin-top:0">Temas que debe reforzar <span class="mut" style="font-weight:400">(${rep.length})</span></h3>
    ${rep.length?`<ul class="fb">${rep.map(r=>`<li class="bad"><span class="mono" style="font-size:11px">F${r.f}</span> ${esc(r.t)}${r.why?`<span class="why">${esc(r.why)}</span>`:''}</li>`).join('')}</ul>`:'<div class="note ok"><b>¡Excelente!</b> No tiene temas pendientes en este curso.</div>'}</div>
   <div class="card"><h3 style="margin-top:0">Ideas clave del curso</h3><ul class="fb">${C.ideas.map(t=>`<li class="ok">${t}</li>`).join('')}</ul>
    <p class="print-only mut">Firma del estudiante: ______________________ &nbsp;&nbsp; Firma del docente: ______________________</p></div>`;
  $('bPrint').onclick=()=>window.print();
  setTimeout(()=>{ el.querySelectorAll('.fl[data-w]').forEach(f=>f.style.width=f.dataset.w+'%'); el.querySelectorAll('circle.v').forEach(c=>c.style.strokeDashoffset=c.dataset.off); },80);
}

/* =================== PANEL DOCENTE =================== */
let PANEL={prog:[],casos:[]};
function panel(){
  const pin=prompt('PIN del panel docente:'); if(pin===null) return; if(pin!==TEACHER_PIN){ toast('PIN incorrecto.'); return; }
  $('modal').classList.add('on'); $('modalIn').innerHTML='<div class="card"><p>Cargando datos…</p></div>';
  Promise.all([sheetGet(SH_PROG),sheetGet(SH_DATA)]).then(([prog,casos])=>{ PANEL={prog:prog,casos:casos}; panelRender('Todas'); });
}
function panelDatos(){
  const P=PANEL.prog.filter(r=>String(r.Modulo||'').indexOf(MODULE_ID+'_')===0||String(r.Modulo||'')==='incidente_salida_pantalla_'+MODULE_ID);
  const Cs=PANEL.casos.filter(r=>r.CasoId===MODULE_ID+'_detalle');
  const est={};
  const get=n=>{ const k=norm(n); if(!est[k]) est[k]={nombre:String(n).trim(),sec:'',cut:0,fases:{},ind:{},final:null,salidas:0}; return est[k]; };
  P.forEach(r=>{ if(r.Modulo===MODULE_ID+'_reset'){ const e=get(r.Estudiante); e.cut=Math.max(e.cut,tsN(r.Timestamp)); } });
  Cs.forEach(r=>{ const e=get(r.Nombre); let d={}; try{ d=JSON.parse(r.Texto); }catch(x){} if(d.seccion) e.sec=d.seccion; });
  P.forEach(r=>{ const e=get(r.Estudiante); if(tsN(r.Timestamp)<=e.cut) return; const m=String(r.Modulo);
    let x; if(m==='incidente_salida_pantalla_'+MODULE_ID) e.salidas++;
    else if((x=m.match(/_fase(\d+)_paso$/))) e.fases[+x[1]]=[+r.Score,+r.Total];
    else if((x=m.match(/_ind(\d+)_ra_(.+)_paso$/))) e.ind[INDS[+x[1]-1]?INDS[+x[1]-1].id:'ind'+x[1]]=[+r.Score,+r.Total];
    else if(m===MODULE_ID+'_final') e.final=+r.Score; });
  return Object.values(est).filter(e=>Object.keys(e.fases).length||e.final!==null||e.salidas||e.sec).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')); }
function panelRender(sec){
  const all=panelDatos(); const L=all.filter(e=>sec==='Todas'||e.sec===sec);
  const nv=v=>v&&v[1]?nivelDe(pct(v[0],v[1])):0;
  $('modalIn').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">Panel docente · ${esc(C.h1)}</h2><button class="btn ghost sm" style="margin-left:auto" id="pClose">Cerrar ✕</button></div>
   <div class="row" style="margin:12px 0">${['Todas'].concat(SECCIONES).map(s=>`<button class="btn sm ${s===sec?'gold':'ghost'}" data-sec="${s}">${s}</button>`).join('')}<button class="btn teal sm" id="pCsv" style="margin-left:auto">Exportar CSV</button></div>
   <div class="scroll"><table class="tb"><tr><th>Estudiante</th><th>Sección</th>${FASES.map(f=>`<th class="c">F${f.n}<br><span style="font-weight:400">/${f.total}</span></th>`).join('')}<th class="c">Total</th><th class="c">Salidas</th>${INDS.map(i=>`<th>${i.cod}</th>`).join('')}<th></th></tr>
   ${L.map(e=>{ const tot=FASES.reduce((a,f)=>a+(e.fases[f.n]?e.fases[f.n][0]:0),0);
     return `<tr><td>${esc(e.nombre)}</td><td>${esc(e.sec||'—')}</td>${FASES.map(f=>`<td class="c mono">${e.fases[f.n]?e.fases[f.n][0]:'—'}</td>`).join('')}<td class="c mono"><b>${e.final!==null?e.final:tot}</b>${e.final!==null?'':' <span class="mut">(en curso)</span>'}</td><td class="c mono ${e.salidas?'bad-t':''}">${e.salidas}</td>
      ${INDS.map(i=>{ const l=nv(e.ind[i.id]); return `<td>${l?`<span class="lvl l${l}" title="${esc(i['n'+l])}">${l} · ${NIVEL_TXT[l]}</span>`:'<span class="mut">pendiente</span>'}</td>`; }).join('')}
      <td><button class="btn ghost sm" data-reset="${esc(e.nombre)}">Repetir</button></td></tr>`; }).join('')||`<tr><td colspan="${FASES.length+INDS.length+5}" class="mut">Sin datos en esta sección.</td></tr>`}</table></div>
   <p class="mut">Rúbrica 1–3 por indicador: Logrado ≥ 80 % · En proceso 60–79 % · No logrado &lt; 60 %. «Repetir» anula el intento y permite que el estudiante rehaga la actividad.</p></div>
   <div class="card"><h3 style="margin-top:0">Rúbrica de evaluación</h3>${rubricaHTML(null,false)}</div>`;
  $('pClose').onclick=()=>$('modal').classList.remove('on');
  $('modalIn').querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>panelRender(b.dataset.sec));
  $('modalIn').querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{ if(!b.dataset.arm){ b.dataset.arm='1'; b.textContent='¿Confirmar?'; b.classList.add('coral'); return; }
    const n=b.dataset.reset; const ts=now(); sheetPost(SH_PROG,{Timestamp:ts,Estudiante:n,Modulo:MODULE_ID+'_reset',Score:'0',Total:'0'});
    PANEL.prog.push({Timestamp:ts,Estudiante:n,Modulo:MODULE_ID+'_reset',Score:'0',Total:'0'}); toast('Reinicio registrado para '+n+'.'); panelRender(sec); });
  $('pCsv').onclick=()=>{ const rows=[['Estudiante','Sección'].concat(FASES.map(f=>'Fase '+f.n+' (/'+f.total+')'),['Total (/'+TOTAL+')','Salidas de pantalla'],INDS.map(i=>i.cod+' puntos'),INDS.map(i=>i.cod+' nivel'))];
    L.forEach(e=>{ const tot=FASES.reduce((a,f)=>a+(e.fases[f.n]?e.fases[f.n][0]:0),0); rows.push([e.nombre,e.sec].concat(FASES.map(f=>e.fases[f.n]?e.fases[f.n][0]:''),[e.final!==null?e.final:tot,e.salidas],INDS.map(i=>e.ind[i.id]?e.ind[i.id][0]+'/'+e.ind[i.id][1]:''),INDS.map(i=>{ const l=nv(e.ind[i.id]); return l?l+' '+NIVEL_TXT[l]:''; }))); });
    const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=C.csv+'_'+sec+'.csv'; document.body.appendChild(a); a.click(); a.remove(); };
}
$('lnkDocente').onclick=e=>{ e.preventDefault(); panel(); };
window.__REP={gradeFase:gradeFase,FASES:FASES,TOTAL:TOTAL,parseNum:parseNum};
portada();
})();

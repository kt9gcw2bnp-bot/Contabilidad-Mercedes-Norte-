<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piso de Ventas · Técnicas modernas de ventas · 10°</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{ --bg:#050506; --card:#0e0f12; --card2:#15161b; --card3:#1c1d24; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --gold:#C9973F; --gold2:#F4DD7A; --teal:#2FC2AD; --coral:#EF6A5B; --ink:#ECEAE4; --mut:#9b9aa4; --dim:#6d6c76;
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace; }
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5; }
body{ overflow-x:hidden; }
button,input,select{ font-family:inherit; font-size:14px; color:inherit; }
a{ color:var(--gold2); }
.top{ position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; padding:10px 18px; background:rgba(5,5,6,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); flex-wrap:wrap; }
.logo{ width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,var(--gold),var(--gold2)); display:grid; place-items:center; color:#1a1406; font-weight:700; font-family:var(--mono); font-size:13px; }
.top h1{ margin:0; font-size:16px; font-weight:600; letter-spacing:.2px; }
.top .sub{ font-size:12px; color:var(--mut); }
.top .who{ margin-left:auto; text-align:right; font-size:12.5px; color:var(--mut); }
.top .who b{ color:var(--ink); }
.wrap{ width:100%; max-width:1680px; margin:0 auto; padding:16px 16px 70px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px; }
.card.soft{ background:var(--card2); }
h2{ margin:0 0 8px; font-size:21px; font-weight:600; } h3{ margin:14px 0 8px; font-size:16px; font-weight:600; }
.mut{ color:var(--mut); font-size:13px; } .mono{ font-family:var(--mono); }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:12px; border:1px solid var(--line2); color:var(--ink); background:var(--card2); }
.pill.gold{ border-color:rgba(201,151,63,.5); color:var(--gold2); } .pill.teal{ border-color:rgba(47,194,173,.5); color:var(--teal); } .pill.coral{ border-color:rgba(239,106,91,.5); color:var(--coral); }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.grid2>*,.side2>*,.stage>*,.kpis>*{ min-width:0; }
label{ display:block; font-size:12.5px; color:var(--mut); margin-bottom:4px; }
input[type=text],select{ width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line2); background:#0a0a0d; outline:none; }
input[type=text]:focus,select:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,151,63,.18); }
input[readonly]{ color:var(--mut); }
.btn{ border:1px solid transparent; border-radius:11px; padding:10px 16px; font-weight:600; cursor:pointer; background:var(--card3); color:var(--ink); transition:transform .12s, background .2s, border-color .2s; min-height:42px; }
.btn:hover{ transform:translateY(-1px); border-color:var(--line2); }
.btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
.btn.gold{ background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#1a1406; }
.btn.teal{ background:var(--teal); color:#03201b; }
.btn.ghost{ background:transparent; border-color:var(--line2); }
.btn.sm{ padding:6px 11px; min-height:34px; font-size:13px; }
.btn.coral{ background:rgba(239,106,91,.15); border-color:rgba(239,106,91,.5); color:var(--coral); }
.err{ color:var(--coral); } .ok{ color:var(--teal); }
.note{ border-radius:12px; padding:12px 14px; font-size:14px; margin-top:10px; border:1px solid var(--line); background:var(--card2); }
.note.good{ border-color:rgba(47,194,173,.45); background:rgba(47,194,173,.07); }
.note.mid{ border-color:rgba(201,151,63,.45); background:rgba(201,151,63,.07); }
.note.bad{ border-color:rgba(239,106,91,.5); background:rgba(239,106,91,.07); }
.note .tag{ font-family:var(--mono); font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; display:block; margin-bottom:4px; }
#banner{ display:none; position:fixed; left:0; right:0; bottom:0; z-index:60; background:#b3271b; color:#fff; padding:10px 16px; font-weight:600; text-align:center; box-shadow:0 -4px 18px rgba(0,0,0,.5); }
#toast{ display:none; position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:70; background:var(--card3); border:1px solid var(--gold); color:var(--ink); padding:10px 16px; border-radius:12px; }
footer{ text-align:center; color:var(--dim); font-size:12px; padding:20px 10px 60px; }
footer a{ color:var(--dim); }
/* Mapa de clientes */
.map{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.mc{ flex:1 1 180px; min-width:150px; display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:14px; background:var(--card); border:1px solid var(--line); cursor:pointer; transition:border-color .2s, transform .15s; text-align:left; }
.mc:hover{ transform:translateY(-1px); }
.mc .n{ width:30px; height:30px; flex:none; border-radius:50%; display:grid; place-items:center; font-family:var(--mono); font-weight:600; background:var(--card3); font-size:13px; }
.mc .t{ font-size:13px; line-height:1.25; } .mc .t small{ display:block; color:var(--mut); font-size:11.5px; }
.mc.cur{ border-color:var(--gold); } .mc.done .n{ background:var(--teal); color:#03201b; } .mc.lock{ opacity:.45; cursor:not-allowed; }
.mc.fin .n{ background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#1a1406; }
/* Ciclo */
.ciclo{ display:flex; gap:0; align-items:stretch; margin:0 0 14px; overflow-x:auto; padding-bottom:2px; }
.ciclo .st{ flex:1 1 0; min-width:96px; padding:8px 10px; font-size:11.5px; text-align:center; background:var(--card); border:1px solid var(--line); color:var(--dim); position:relative; }
.ciclo .st:first-child{ border-radius:12px 0 0 12px; } .ciclo .st:last-child{ border-radius:0 12px 12px 0; }
.ciclo .st.on{ color:var(--ink); background:rgba(201,151,63,.12); border-color:rgba(201,151,63,.45); }
.ciclo .st.now{ color:#1a1406; background:var(--gold2); border-color:var(--gold2); font-weight:600; }
.ciclo .st.no{ text-decoration:line-through; opacity:.5; }
.ciclo .st b{ display:block; font-family:var(--mono); font-size:10px; opacity:.75; font-weight:500; }
/* Escenario */
.stage{ display:grid; grid-template-columns:minmax(260px,330px) 1fr; gap:14px; align-items:start; }
.side{ position:sticky; top:72px; }
.avwrap{ display:flex; flex-direction:column; align-items:center; text-align:center; }
.avatar{ width:150px; height:150px; }
.avatar .mouth,.avatar .brow{ transition:d .5s; }
.gauge{ width:220px; max-width:100%; margin-top:6px; position:relative; }
.gauge svg{ width:100%; height:auto; display:block; }
.gauge .arc{ transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1), stroke .6s; }
.gauge .val{ position:absolute; left:0; right:0; top:42%; text-align:center; font-family:var(--mono); font-size:30px; font-weight:600; }
.gauge .lab{ text-align:center; font-size:11.5px; color:var(--mut); margin-top:2px; }
.delta{ position:absolute; right:6px; top:6px; font-family:var(--mono); font-weight:600; font-size:15px; padding:2px 8px; border-radius:8px; animation:floatUp 2.2s ease forwards; }
.delta.up{ color:var(--teal); background:rgba(47,194,173,.12); } .delta.down{ color:var(--coral); background:rgba(239,106,91,.12); }
@keyframes floatUp{ 0%{ opacity:0; transform:translateY(10px); } 15%{ opacity:1; transform:translateY(0); } 75%{ opacity:1; } 100%{ opacity:0; transform:translateY(-14px); } }
.ficha{ text-align:left; font-size:13px; margin-top:12px; }
.ficha .k{ color:var(--mut); font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; font-family:var(--mono); }
.tecnica{ margin-top:12px; text-align:left; border-left:3px solid var(--gold); padding:8px 10px; background:var(--card2); border-radius:0 10px 10px 0; font-size:13px; }
/* Chat */
.chat{ display:flex; flex-direction:column; gap:8px; max-height:52vh; overflow-y:auto; padding:6px 4px 6px 0; scroll-behavior:smooth; }
.bub{ max-width:82%; padding:10px 13px; border-radius:16px; font-size:14.5px; animation:pop .35s ease both; }
.bub.cli{ align-self:flex-start; background:var(--card3); border:1px solid var(--line); border-bottom-left-radius:4px; }
.bub.ven{ align-self:flex-end; background:rgba(201,151,63,.16); border:1px solid rgba(201,151,63,.4); border-bottom-right-radius:4px; }
.bub.ven.eth{ background:rgba(239,106,91,.12); border-color:rgba(239,106,91,.45); }
.bub small{ display:block; font-size:11px; color:var(--mut); margin-bottom:2px; font-family:var(--mono); }
.bub.new{ animation-delay:.05s; } .bub.later{ animation-delay:.75s; }
.coach{ align-self:center; max-width:92%; font-size:12.5px; color:var(--mut); border:1px dashed var(--line2); border-radius:10px; padding:5px 10px; animation:pop .35s ease both; }
.coach b{ color:var(--teal); font-weight:500; } .coach.e b{ color:var(--coral); }
@keyframes pop{ from{ opacity:0; transform:translateY(8px) scale(.98); } to{ opacity:1; transform:none; } }
.typing{ align-self:flex-start; display:flex; overflow:hidden; gap:4px; padding:10px 13px; background:var(--card3); border-radius:16px; animation:hideT .01s .7s forwards; }
.typing i{ width:6px; height:6px; border-radius:50%; background:var(--mut); animation:blink 1s infinite; } .typing i:nth-child(2){ animation-delay:.15s; } .typing i:nth-child(3){ animation-delay:.3s; }
@keyframes blink{ 0%,100%{ opacity:.3; } 50%{ opacity:1; } } @keyframes hideT{ to{ height:0; padding:0; margin:0; opacity:0; overflow:hidden; } }
/* Opciones */
.opts{ display:grid; gap:8px; margin-top:10px; }
.opt{ text-align:left; display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:13px; background:var(--card2); border:1px solid var(--line); cursor:pointer; transition:border-color .2s, background .2s, transform .12s; font-size:14.5px; width:100%; }
.opt:hover{ border-color:var(--gold); background:rgba(201,151,63,.07); }
.opt .k{ flex:none; width:26px; height:26px; border-radius:8px; display:grid; place-items:center; background:var(--card3); font-family:var(--mono); font-size:12px; }
.opt .tt{ display:block; font-weight:600; font-size:13px; color:var(--gold2); margin-bottom:2px; }
.act{ margin-top:12px; }
.qhead{ font-size:13px; color:var(--mut); margin-top:12px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.5px; }
/* Margen */
.dchips{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
.dchip{ padding:10px 16px; border-radius:11px; border:1px solid var(--line2); background:var(--card2); cursor:pointer; font-family:var(--mono); font-weight:600; min-width:64px; }
.dchip.on{ background:var(--gold2); color:#1a1406; border-color:var(--gold2); }
.dchip:disabled{ opacity:.35; cursor:not-allowed; }
.mtab{ width:100%; border-collapse:collapse; font-size:14px; margin-top:6px; }
.mtab th,.mtab td{ padding:7px 8px; border-bottom:1px solid var(--line); text-align:right; }
.mtab th:first-child,.mtab td:first-child{ text-align:left; }
.mtab td{ font-family:var(--mono); } .mtab td:first-child{ font-family:var(--sans); }
.mbars{ margin-top:12px; position:relative; }
.mbar{ display:flex; align-items:center; gap:8px; margin:6px 0; font-size:12.5px; }
.mbar .lb{ width:70px; color:var(--mut); }
.mbar .tr{ flex:1; height:16px; background:var(--card3); border-radius:8px; position:relative; overflow:visible; }
.mbar .fl{ height:100%; border-radius:8px; transition:width .7s cubic-bezier(.2,.8,.2,1), background .4s; }
.mbar .pol{ position:absolute; top:-5px; bottom:-5px; width:2px; background:var(--coral); }
.mbar .v{ width:70px; text-align:right; font-family:var(--mono); }
/* Factura / asiento */
.doc{ background:#0b0b0e; border:1px solid var(--line2); border-radius:14px; padding:14px; }
.doc .hd{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; border-bottom:1px dashed var(--line2); padding-bottom:10px; margin-bottom:10px; font-size:13px; }
.doc .hd b{ font-size:15px; }
.ftab{ width:100%; border-collapse:collapse; font-size:13.5px; }
.ftab th{ text-align:left; font-weight:500; color:var(--mut); font-size:12px; padding:6px; border-bottom:1px solid var(--line); }
.ftab td{ padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
.ftab input,.ftab select{ padding:7px 8px; font-family:var(--mono); font-size:13.5px; min-width:70px; }
.ftab .tot td{ border-bottom:none; }
.fld-ok{ border-color:var(--teal)!important; box-shadow:0 0 0 2px rgba(47,194,173,.18); }
.fld-bad{ border-color:var(--coral)!important; box-shadow:0 0 0 2px rgba(239,106,91,.2); }
.scroll{ overflow-x:auto; }
.side2{ display:grid; grid-template-columns:1.4fr 1fr; gap:12px; align-items:start; }
.kv{ width:100%; border-collapse:collapse; font-size:13px; }
.kv td{ padding:5px 6px; border-bottom:1px solid var(--line); } .kv td:last-child{ text-align:right; font-family:var(--mono); }
.fbl{ margin:6px 0 0; padding-left:20px; } .fbl li{ margin:3px 0; }
/* Tablero */
.kpis{ display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
.kpi{ background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
.kpi .l{ font-size:11.5px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; font-family:var(--mono); }
.kpi .v{ font-size:24px; font-weight:600; margin-top:2px; font-family:var(--mono); }
.kpi .s{ font-size:12px; color:var(--mut); }
.tb{ width:100%; border-collapse:collapse; font-size:13.5px; }
.tb th{ text-align:left; color:var(--mut); font-weight:500; font-size:12px; padding:8px; border-bottom:1px solid var(--line2); }
.tb td{ padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
.tb td.n{ font-family:var(--mono); text-align:right; white-space:nowrap; }
.tb tr.me td{ background:rgba(201,151,63,.1); }
.lvl{ display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; }
.lvl.l3{ background:rgba(47,194,173,.16); color:var(--teal); } .lvl.l2{ background:rgba(201,151,63,.18); color:var(--gold2); } .lvl.l1{ background:rgba(239,106,91,.16); color:var(--coral); }
.meter{ margin:10px 0; } .meter .lbl{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; gap:8px; }
.meter .tr{ height:12px; border-radius:6px; background:var(--card3); overflow:hidden; } .meter .fl{ height:100%; border-radius:6px; transition:width 1s; }
.big{ font-size:44px; font-weight:700; font-family:var(--mono); background:linear-gradient(135deg,var(--gold),var(--gold2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.result{ text-align:center; padding:26px 14px; }
.result .ic{ width:64px; height:64px; margin:0 auto 10px; border-radius:50%; display:grid; place-items:center; font-size:30px; font-weight:700; }
.result.win .ic{ background:rgba(47,194,173,.18); color:var(--teal); } .result.lose .ic{ background:rgba(239,106,91,.15); color:var(--coral); }
/* Modal */
#modal{ display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.75); overflow-y:auto; padding:20px 12px; }
#modal.on{ display:block; } #modalIn{ max-width:1500px; margin:0 auto; }
.cert{ display:none; }
@media (max-width:1100px){ .kpis{ grid-template-columns:repeat(3,1fr); } .side2{ grid-template-columns:1fr; } }
@media (max-width:860px){ .stage{ grid-template-columns:1fr; } .side{ position:static; } .avwrap{ flex-direction:row; flex-wrap:wrap; justify-content:center; gap:10px; } .avatar{ width:110px; height:110px; } .gauge{ width:190px; } .chat{ max-height:none; } }
@media (max-width:600px){ .grid2{ grid-template-columns:1fr; } .kpis{ grid-template-columns:repeat(2,1fr); } .wrap{ padding:12px 10px 70px; } .card{ padding:14px; } .bub{ max-width:92%; } .top h1{ font-size:14px; } .mc{ flex:1 1 140px; } .ftab input{ min-width:58px; } h2{ font-size:19px; } .kpi .v{ font-size:20px; } }
@media print{
  body{ background:#fff; color:#111; }
  .top,.map,.ciclo,footer,#banner,#toast,.noprint,#app>*:not(.printzone){ display:none!important; }
  .printzone{ display:block!important; }
  .cert{ display:block!important; color:#111; font-family:var(--sans); padding:10px; }
  .cert h1{ font-size:24px; margin:0 0 4px; } .cert table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:12.5px; }
  .cert td,.cert th{ border:1px solid #999; padding:6px; text-align:left; } .cert .sc{ font-size:30px; font-weight:700; }
  .printzone > :not(.cert){ display:none!important; }
}
</style>
</head>

<script>
(function(){

const SHEET_API_URL="https://script.google.com/macros/s/AKfycbzMGf_Gpf6UWswFPSqEBMdq-93GxGkrURsT4jtO9Jaz8yT5gyMMtp1btlcDZjRCeuAb/exec";

const $=id=>document.getElementById(id);
const num=v=>{ if(v===null||v===undefined) return NaN; const s=String(v).trim().replace(/\s/g,'').replace(/₡/g,'').replace(/ /g,''); if(s==='') return NaN; if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) return +s.replace(/\./g,''); const t=(s.indexOf(',')>-1&&s.indexOf('.')>-1)?s.replace(/\./g,'').replace(',','.'):s.replace(',','.'); return +t; };

function seedRand(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return function(){ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return ((h^=h>>>16)>>>0)/4294967296; }; }
function orden(key,n){ const r=seedRand(norm(user?user.name:'')+'|'+key); const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* =================== PUENTE SHEETS =================== */
function jsonp(url){ return new Promise(res=>{ const cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*1e5); const s=document.createElement('script');
  window[cb]=d=>{ res(d); delete window[cb]; s.remove(); }; s.onerror=()=>{ res({rows:[]}); delete window[cb]; s.remove(); };
  s.src=url+(url.indexOf('?')>-1?'&':'?')+'callback='+cb; document.body.appendChild(s); setTimeout(()=>{ if(window[cb]){ res({rows:[]}); delete window[cb]; s.remove(); } },12000); }); }
function sheetGet(n){ return jsonp(SHEET_API_URL+'?sheet='+encodeURIComponent(n)).then(d=>(d&&d.rows)?d.rows:[]); }
function sheetPost(n,row){ // contrato JSON del doPost {sheet,row:[...]} con Content-Type text/plain. NO cambiar.
  return fetch(SHEET_API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({sheet:n,row:Object.keys(row).map(k=>row[k])}),keepalive:true}).catch(()=>{}); }
function postProg(nombre,modulo,score,total){ const r={Timestamp:now(),Estudiante:nombre,Modulo:modulo,Score:String(score),Total:String(total)}; PROG.push(r); return sheetPost(SH_PROG,r); }
function postCaso(nombre,obj){ const r={Timestamp:now(),CasoId:MODULE_ID+'_detalle',Nombre:nombre,Texto:JSON.stringify(obj)}; CASOS.push(r); return sheetPost(SH_DATA,r); }
function nombrePortal(){ try{ return (new URLSearchParams(location.search).get('nombre')||'').trim()||null; }catch(e){ return null; } }

/* =================== CÁLCULOS =================== */
function lineas(c,st){ return c.pedido(st).map(([k,q])=>({k:k,n:CAT[k].n,q:q,p:CAT[k].p,c:CAT[k].c,m:q*CAT[k].p})); }
function calc(c,st,dOverride){
  const L=lineas(c,st), d=dOverride!=null?dOverride:(st.des||0);
  const bruto=L.reduce((s,l)=>s+l.m,0), costo=L.reduce((s,l)=>s+l.q*l.c,0);
  const desc=Math.round(bruto*d)/100, sub=bruto-desc, iva=Math.round(sub*IVA*100)/100, tot=sub+iva;
  const com=Math.round(sub*c.com)/100, mg=sub-costo, mgp=sub?mg/sub*100:0;
  return {L:L,d:d,bruto:bruto,costo:costo,desc:desc,sub:sub,iva:iva,tot:tot,com:com,mg:mg,mgp:mgp};
}
function confSerie(c,st){ // confianza tras cada decisión
  let v=c.conf0; const s=[v];
  st.picks.forEach((p,t)=>{ v=clamp(v+c.turns[t].o[p].d,0,100); s.push(v); });
  if(st.cie){ v=clamp(v+c.cierres[st.cie][1],0,100); s.push(v); }
  if(st.des!=null){ v=clamp(v+st.des/5*4,0,100); s.push(v); }
  return s;
}
const confNow=(c,st)=>{ const s=confSerie(c,st); return s[s.length-1]; };
function margenPts(c,st){ const d=st.des||0; return d<=c.descJust?3:(d===5?2:0); }
function antiEtica(c,st){ return st.picks.some((p,t)=>c.turns[t].o[p].eth)||st.cie==='pres'; }
function puntos(c,st){
  const dlg=st.picks.reduce((s,p,t)=>s+c.turns[t].o[p].p,0);
  const cie=st.cie?c.cierres[st.cie][0]:0, mar=st.des!=null?margenPts(c,st):0, eti=antiEtica(c,st)?0:2;
  const fac=st.fac&&st.fac.score!=null?st.fac.score:0, com=st.com&&st.com.score!=null?st.com.score:0, asi=st.asi&&st.asi.score!=null?st.asi.score:0;
  const ind2=dlg+cie+mar+eti, ind1=fac+com+asi;
  return {dlg:dlg,cie:cie,mar:mar,eti:eti,fac:fac,com:com,asi:asi,ind1:ind1,ind2:ind2,total:ind1+ind2};
}

function animarGauge(to){

  arc.style.transition=''; requestAnimationFrame(()=>{ arc.style.strokeDashoffset=L*(1-to/100); arc.style.stroke=col(to); });

function esperadoAsiento(c,st){ const k=calc(c,st); return {v:[{a:c.pago==='credito'?'CXC':'BAN',s:'d',m:k.tot},{a:'ING',s:'h',m:k.sub},{a:'IVAP',s:'h',m:k.iva}],c:[{a:'GCOM',s:'d',m:k.com},{a:'CPC',s:'h',m:k.com}],k:k}; }
function evalAsiento(rows,exp){ const R=rows.filter(r=>r.a||r.d!==''||r.h!==''); if(R.length!==exp.length) return false;
  const used=R.map(()=>false); return exp.every(e=>{ const i=R.findIndex((r,j)=>!used[j]&&r.a===e.a&&(e.s==='d'?(near(num(r.d),e.m)&&(r.h===''||num(r.h)===0)):(near(num(r.h),e.m)&&(r.d===''||num(r.d)===0)))); if(i<0) return false; used[i]=true; return true; }); }
function pistasAsiento(c,st,rv,rc,E){ const m=[]; const has=(R,a)=>R.find(r=>r.a===a);

   <div class="grid2 noprint"><div class="card"><h3 style="margin-top:0">Rúbrica · RA 2</h3>${[[IND[0],R.ind1,n1],[IND[1],R.ind2,n2]].map(([d,x,n])=>`<div class="meter"><div class="lbl"><span>${d.nombre}</span><span class="mono">${x.s} / ${x.t} · ${pct(x)} %</span></div><div class="tr"><div class="fl" style="width:${pct(x)}%;background:${n===3?'var(--teal)':(n===2?'var(--gold)':'var(--coral)')}"></div></div><div style="margin-top:6px"><span class="lvl l${n}">${n} · ${NIVEL_TXT[n]}</span> <span class="mut">${d['n'+n]}</span></div></div>`).join('')}</div>
    <div class="card"><h3 style="margin-top:0">Por cliente</h3><div class="scroll"><table class="tb"><tr><th>Cliente</th><th>Cierre</th><th>Desc.</th><th>Venta</th><th>Pts</th></tr>${pc.map(x=>`<tr><td><b>${esc(x.empresa)}</b><div class="mut">${esc(x.tecnica)}${x.etica===false?' · <span class="err">falta ética</span>':''}</div></td><td>${esc(x.cierre||'—')}</td><td class="n">${x.descuento!=null?x.descuento+' %':'—'}</td><td class="n">${x.cerrada?fm(x.subtotal):(x.cierre?'<span class="err">no cerró</span>':'—')}</td><td class="n">${x.total} / 25</td></tr>`).join('')}</table></div></div></div>
   <div class="card noprint"><div class="row"><button class="btn gold" id="bPrint">Imprimir certificado</button><button class="btn ghost" id="bRank">Ver ranking del grupo</button></div><div id="rank"></div></div>
   <div class="card noprint"><h3 style="margin-top:0">Ideas clave</h3><div class="mut" style="font-size:14px">Vender es <b>resolver un problema</b> del cliente. SPIN descubre la necesidad con preguntas; SNAP simplifica para clientes saturados; el retador enseña y Sandler califica; la venta consultiva asesora con cifras. Cada cierre afecta el <b>margen</b> y la confianza, y cada venta deja huella en el <b>ciclo contable</b>: cotización → pedido → factura electrónica → cuenta por cobrar o Bancos → cobro → comisión.</div></div>
   ${certHTML(R,n1,n2,pct)}`;
  $('bPrint').onclick=()=>window.print();
  $('bRank').onclick=()=>verRanking(R);
}
function certHTML(R,n1,n2,pct){ return `<div class="cert"><div style="border:3px double #C9973F;padding:18px"><div style="font-size:12px;color:#555">CTP Mercedes Norte · Especialidad de Contabilidad · Gestión Comercial y de Ventas · 10°</div>
  <h1>Certificado de resultado · Piso de Ventas</h1><div>RA 2: Demostrar el uso de técnicas modernas de ventas efectivas, aplicables a todo el comercio.</div>
  <p style="margin-top:12px">Estudiante: <b>${esc(user.name)}</b> · Sección: <b>${esc(R.sec||user.sec)}</b> · Fecha: <b>${new Date(R.fecha||Date.now()).toLocaleDateString('es-CR')}</b></p>
  <div class="sc">${R.total} / 100</div>
  <table><tr><th>Indicador</th><th>Puntos</th><th>Nivel</th><th>Descriptor</th></tr><tr><td>${IND[0].nombre}</td><td>${R.ind1.s} / ${R.ind1.t} (${pct(R.ind1)} %)</td><td>${n1} · ${NIVEL_TXT[n1]}</td><td>${IND[0]['n'+n1]}</td></tr><tr><td>${IND[1].nombre}</td><td>${R.ind2.s} / ${R.ind2.t} (${pct(R.ind2)} %)</td><td>${n2} · ${NIVEL_TXT[n2]}</td><td>${IND[1]['n'+n2]}</td></tr></table>
  ${R.sinDetalle?'':`<table><tr><th>Cliente</th><th>Técnica</th><th>Cierre</th><th>Venta sin IVA</th><th>Puntos</th></tr>${(R.porCliente||[]).map(x=>`<tr><td>${esc(x.empresa)}</td><td>${esc(x.tecnica)}</td><td>${esc(x.cierre)}</td><td>${x.cerrada?fm(x.subtotal):'No cerró'}</td><td>${x.total} / 25</td></tr>`).join('')}</table>
  <p>Ventas cerradas: ${R.ventas} · Ingresos: ${fm(R.ingresos)} · Comisiones: ${fm(R.comisiones)} · Margen promedio: ${fp(R.margenProm)}</p>`}
  <p style="margin-top:30px">_____________________________<br>Prof. Gerardo González González</p></div></div>`; }
function verRanking(R){
  $('rank').innerHTML='<p class="mut">Cargando ranking…</p>';
  Promise.all([sheetGet(SH_PROG),sheetGet(SH_DATA)]).then(([p,c])=>{ PROG=p; CASOS=c;
    const sec=R.sec||user.sec, by={};
    PROG.filter(r=>String(r.Modulo)===MODULE_ID+'_final').forEach(r=>{ const n=norm(r.Estudiante); if(String(r.Timestamp)<=resetCut(r.Estudiante)) return; by[n]={nombre:String(r.Estudiante).trim(),score:+r.Score||0,ts:String(r.Timestamp)}; });
    Object.values(by).forEach(x=>{ const d=detalles(x.nombre).filter(o=>o.fase==='final').pop(); x.sec=d?d.sec:null; x.ingresos=d?d.ingresos:0; x.ventas=d?d.ventas:null; });
    const L=Object.values(by).filter(x=>x.sec===sec).sort((a,b)=>b.score-a.score||b.ingresos-a.ingresos);
    const corto=n=>{ const w=n.split(/\s+/); return w[0]+(w[1]?' '+w[1][0]+'.':''); };
    $('rank').innerHTML=L.length?`<h3>Ranking · sección ${esc(sec)}</h3><div class="scroll"><table class="tb"><tr><th>#</th><th>Vendedor/a</th><th>Ventas</th><th>Ingresos</th><th>Puntaje</th></tr>${L.map((x,i)=>`<tr class="${norm(x.nombre)===norm(user.name)?'me':''}"><td class="n">${i+1}</td><td>${esc(corto(x.nombre))}</td><td class="n">${x.ventas!=null?x.ventas+' / 4':'—'}</td><td class="n">${fm(x.ingresos)}</td><td class="n">${x.score}</td></tr>`).join('')}</table></div><div class="mut">Ordenado por puntaje y luego por ingresos. Solo intentos finalizados.</div>`:'<p class="mut">Todavía no hay resultados finales en su sección.</p>'; });
}

/* =================== PANEL DOCENTE =================== */
function panel(){ const pin=prompt('PIN del panel docente:'); if(pin===null) return; if(pin!==TEACHER_PIN){ toast('PIN incorrecto.'); return; }
  attempt=false; mostrarBanner(); $('modal').classList.add('on'); $('modalIn').innerHTML='<div class="card">Cargando datos…</div>';
  Promise.all([sheetGet(SH_PROG),sheetGet(SH_DATA)]).then(([p,c])=>{ PROG=p; CASOS=c; panelRender(SECCIONES[0]); }); }
function datosEst(nombre){
  const mine=progDe(nombre), dets=detalles(nombre), g=k=>{ const r=mine.filter(x=>String(x.Modulo)===k).pop(); return r?+r.Score:null; };
  const fases=CLIENTES.map(c=>g(MODULE_ID+'_'+c.key+'_paso')); const fin=g(MODULE_ID+'_final');
  let i1=g(MODULE_ID+'_ind1_ra_RA2-I1_paso'), i2=g(MODULE_ID+'_ind2_ra_RA2-I2_paso'), t1=32, t2=68, parcial=false;
  if(i1==null||i2==null){ const ph=dets.filter(d=>/^cliente\d$/.test(d.fase)); const seen={}; let a=0,b=0,n=0; ph.forEach(d=>{ if(seen[d.fase]) return; seen[d.fase]=1; n++; a+=d.ind1?d.ind1.s:0; b+=d.ind2?d.ind2.s:0; }); i1=a; i2=b; t1=8*n; t2=17*n; parcial=true; }
  const fd=dets.filter(d=>d.fase==='final').pop();
  return {fases:fases,fin:fin,i1:i1,i2:i2,t1:t1,t2:t2,parcial:parcial,salidas:salidasDe(nombre),fd:fd,dets:dets};
}
function panelRender(sec){
  const est={}; CASOS.forEach(r=>{ if(String(r.CasoId)!==MODULE_ID+'_detalle') return; let o={}; try{ o=JSON.parse(r.Texto); }catch(e){} if(o.sec===sec) est[norm(r.Nombre)]=String(r.Nombre).trim(); });
  const nombres=Object.values(est).sort((a,b)=>a.localeCompare(b,'es'));
  const lv=(s,t,ix)=>{ if(!t) return '<span class="mut">—</span>'; const p=Math.round(s/t*100), n=nivelDe(p); return `<span class="lvl l${n}" title="${esc(IND[ix]['n'+n])}">${n} · ${NIVEL_TXT[n]}</span><div class="mut">${s}/${t} · ${p} %</div>`; };
  const filas=nombres.map(n=>({n:n,D:datosEst(n)}));
  $('modalIn').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">Panel docente · Piso de Ventas</h2><button class="btn ghost sm" style="margin-left:auto" id="pClose">Cerrar</button></div>
   <div class="row" style="margin:12px 0">${SECCIONES.map(s=>`<button class="btn sm ${s===sec?'gold':'ghost'}" data-sec="${s}">${s}</button>`).join('')}<button class="btn teal sm" id="pCsv" style="margin-left:auto">Exportar CSV</button></div>
   <div class="scroll"><table class="tb"><tr><th>Estudiante</th>${CLIENTES.map(c=>`<th>C${c.num}<div style="font-weight:400;font-size:11px">${esc(c.tecnica)}</div></th>`).join('')}<th>Total</th><th>Ind. 1 · ciclo contable</th><th>Ind. 2 · técnicas</th><th>Salidas</th><th>Estado</th><th></th></tr>
   ${filas.map(({n,D})=>`<tr><td><b>${esc(n)}</b></td>${D.fases.map(x=>`<td class="n">${x==null?'—':x+'/25'}</td>`).join('')}<td class="n"><b>${D.fin!=null?D.fin+'/100':'—'}</b></td><td>${lv(D.i1,D.t1,0)}</td><td>${lv(D.i2,D.t2,1)}</td><td class="n">${D.salidas}</td><td>${D.fin!=null?'<span class="pill teal">Finalizado</span>':(D.fases.some(x=>x!=null)?'<span class="pill gold">En curso'+(D.parcial?' · parcial':'')+'</span>':'<span class="pill">Sin datos</span>')}</td><td><button class="btn coral sm" data-reset="${esc(n)}">Repetir</button></td></tr>`).join('')||`<tr><td colspan="${CLIENTES.length+7}" class="mut">Sin datos en esta sección.</td></tr>`}</table></div>
   <div class="mut" style="margin-top:8px">Niveles: Logrado ≥ 80 % · En proceso 60–79 % · No logrado &lt; 60 %. “Repetir” registra un reinicio: el estudiante podrá hacer la actividad de nuevo (sus resultados anteriores quedan en el historial).</div></div>
   <div class="card"><h3 style="margin-top:0">Rúbrica por indicador</h3>${rubricaTabla()}</div>`;
  $('pClose').onclick=()=>{ $('modal').classList.remove('on'); if(user&&ST) { attempt=true; mostrarBanner(); } };
  $('modalIn').querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>panelRender(b.dataset.sec));
  $('modalIn').querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{ const n=b.dataset.reset;
    if(!b.dataset.conf){ b.dataset.conf='1'; b.textContent='¿Confirmar reinicio?'; setTimeout(()=>{ if(b.isConnected){ b.dataset.conf=''; b.textContent='Repetir'; } },5000); return; }
    postProg(n,MODULE_ID+'_reset',0,0); toast('Reinicio registrado para '+n+'.'); panelRender(sec); });
  $('pCsv').onclick=()=>{ const rows=[['Estudiante','Sección'].concat(CLIENTES.map(c=>'Cliente '+c.num+' ('+c.tecnica+') /25'),['Total /100','Ind1 puntos','Ind1 %','Ind1 nivel','Ind2 puntos','Ind2 %','Ind2 nivel','Ventas cerradas','Ingresos','Comisiones','Margen promedio %','Salidas de pantalla','Estado'])];
    filas.forEach(({n,D})=>{ const p1=D.t1?Math.round(D.i1/D.t1*100):0, p2=D.t2?Math.round(D.i2/D.t2*100):0;
      rows.push([n,sec].concat(D.fases.map(x=>x==null?'':x),[D.fin==null?'':D.fin,D.i1+'/'+D.t1,p1,D.t1?nivelDe(p1)+' '+NIVEL_TXT[nivelDe(p1)]:'',D.i2+'/'+D.t2,p2,D.t2?nivelDe(p2)+' '+NIVEL_TXT[nivelDe(p2)]:'',D.fd?D.fd.ventas:'',D.fd?D.fd.ingresos:'',D.fd?D.fd.comisiones:'',D.fd?D.fd.margenProm:'',D.salidas,D.fin!=null?'Finalizado':'En curso'])); });
    const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='PisoDeVentas_'+sec+'.csv'; document.body.appendChild(a); a.click(); a.remove(); };
}
$('lnkDocente').onclick=e=>{ e.preventDefault(); panel(); };

window.__pv={CLIENTES:CLIENTES,CAT:CAT,calc:calc,puntos:puntos,confNow:confNow,getST:()=>ST,getDONE:()=>DONE,UMBRAL:UMBRAL};
portada();
})();

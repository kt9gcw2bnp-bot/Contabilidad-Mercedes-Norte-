<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguros</title>
<style>
:root{
  --azul:#1d4ed8; --azul-osc:#1e3a8a; --verde:#16a34a; --rojo:#dc2626; --gris:#64748b; --fondo:#f8fafc;
}
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--fondo);margin:0;color:#0f172a;}
#app{max-width:900px;margin:0 auto;padding:24px 20px 60px;}
h1{color:var(--azul-osc);font-size:1.8rem;margin-bottom:4px;}
h2{color:var(--azul-osc);border-bottom:3px solid var(--azul);padding-bottom:6px;}
.subtitulo{color:var(--gris);margin-top:0;}
.portada{max-width:640px;margin:60px auto;text-align:center;}
.portada-caja{background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08);padding:28px;margin-top:20px;}
.portada-caja input{width:100%;padding:10px;font-size:1rem;border:1px solid #cbd5e1;border-radius:8px;margin:10px 0 16px;}
.portada-caja input[readonly]{background:#eef2f7;color:#1e3a8a;font-weight:600;cursor:default;}
.btn-primario{background:var(--azul);color:#fff;border:none;padding:12px 22px;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:600;}
.btn-primario:hover{background:var(--azul-osc);}
.btn-primario:disabled{opacity:.6;cursor:default;}
.btn-secundario{background:#e2e8f0;color:#0f172a;border:none;padding:10px 18px;border-radius:8px;font-size:.95rem;cursor:pointer;margin:4px 6px 4px 0;}
.btn-secundario:hover{background:#cbd5e1;}
.btn-link{background:none;border:none;color:var(--gris);text-decoration:underline;cursor:pointer;margin-top:18px;}
.aviso{font-size:.85rem;color:var(--gris);margin-top:14px;}
.progbar-wrap{max-width:900px;margin:0 auto;padding:10px 20px 0;}
.progbar-track{background:#e2e8f0;border-radius:6px;height:10px;overflow:hidden;}
.progbar-fill{background:var(--verde);height:100%;transition:width .3s;}
.progbar-text{font-size:.8rem;color:var(--gris);margin:4px 0 0;}
.paso-wrap{background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.06);padding:26px;margin-top:16px;}
.antologia-texto{line-height:1.65;}
.antologia-texto h3{color:var(--azul);}
.pregunta-mc{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #eef2f7;}
.opcion{display:block;padding:6px 0;cursor:pointer;}
.resultado{font-weight:600;margin-top:10px;}
.nav-footer{display:flex;justify-content:space-between;margin-top:22px;}
.asocie-col{display:inline-block;vertical-align:top;width:47%;margin-right:2%;}
.asocie-input{width:50px;padding:4px;margin-right:6px;}
.complete-input{padding:4px 8px;border:1px solid #cbd5e1;border-radius:6px;min-width:140px;}
.sopa-flex{display:flex;gap:24px;flex-wrap:wrap;}
.sopa-grid{display:grid;gap:2px;background:#cbd5e1;padding:4px;border-radius:8px;width:fit-content;}
.sopa-cell{background:#fff;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.85rem;cursor:pointer;user-select:none;}
.sopa-cell.sopa-sel{background:#bfdbfe;}
.sopa-cell.sopa-found{background:#bbf7d0;color:var(--verde);}
.sopa-lista{min-width:160px;}
.sopa-word-done{text-decoration:line-through;color:var(--verde);}
.cruci-flex{display:flex;gap:28px;flex-wrap:wrap;}
.cruci-grid{display:grid;gap:2px;background:#cbd5e1;padding:4px;border-radius:6px;width:fit-content;}
.cruci-cell{position:relative;width:2rem;height:2rem;background:#fff;}
.cruci-cell.cruci-blank{background:transparent;}
.cruci-cell input{width:100%;height:100%;border:none;text-align:center;font-weight:700;text-transform:uppercase;font-size:1rem;background:transparent;}
.cruci-cell input.cruci-ok{background:#bbf7d0;}
.cruci-cell input.cruci-bad{background:#fecaca;}
.cruci-num{position:absolute;top:0;left:2px;font-size:.55rem;color:var(--gris);}
.cruci-clues p{margin:4px 0;font-size:.9rem;}
.caso-texto{background:#eff6ff;border-left:4px solid var(--azul);padding:14px 18px;border-radius:6px;line-height:1.6;}
textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:.95rem;}
.foro-post{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:14px;}
.foro-comentario{background:#fff;border-radius:6px;padding:6px 10px;margin:6px 0;font-size:.88rem;}
.foro-nuevo-comentario{display:flex;gap:8px;margin-top:8px;}
.foro-nuevo-comentario input{flex:1;padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px;}
canvas{background:#fff;border:2px solid #cbd5e1;border-radius:10px;display:block;margin:10px 0;max-width:100%;}
.game-quiz{background:#fff7ed;border:2px solid #f59e0b;border-radius:10px;padding:16px;margin:10px 0;}
.game-quiz button{display:block;width:100%;text-align:left;margin:4px 0;}
.ok{color:var(--verde);font-weight:700;}
.bad{color:var(--rojo);font-weight:700;}
.cert-container{margin-top:20px;}
.cert{border:10px double var(--azul-osc);padding:40px;text-align:center;border-radius:10px;background:#fffdf5;}
.cert h2{border:none;color:var(--azul-osc);font-size:1.6rem;}
.cert-nombre{font-size:1.6rem;font-weight:700;color:var(--azul-osc);margin:10px 0;}
.cert-titulo-curso{font-size:1.2rem;font-weight:600;}
.cert-detalle{font-size:.85rem;color:var(--gris);}
.docente-fila{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;margin-bottom:8px;}
.docente-detalle{margin-top:8px;background:#f8fafc;padding:10px;border-radius:6px;font-size:.9rem;}
@media print{
  body.printing-cert > *:not(#app) , body.printing-cert #app > *:not(.paso-wrap){display:none !important;}
  body.printing-cert .paso-wrap > *:not(#certContainer){display:none !important;}

.progress-table{width:100%;border-collapse:collapse;margin:10px 0 18px;font-size:.88rem;}
.progress-table th,.progress-table td{border:1px solid #e2e8f0;padding:8px 10px;text-align:left;}
.progress-table th{background:#f1f5f9;}
.progress-table td.center{text-align:center;}
.status-ok{color:#0f9d78;font-weight:700;}
.status-mid{color:#b8863c;font-weight:700;}
.status-bad{color:#d9534f;font-weight:700;}
.status-pending{color:#7f8fb8;font-weight:600;}
.rubrica-nota{font-size:.78rem;color:#7f8fb8;margin:-4px 0 12px;}

<script>
/* ============================================================
   MOTOR DE CURSO INTERACTIVO — reutilizado por los 3 cursos
   Requiere que exista un objeto global CONFIG (definido antes de
   cargar este script) con la forma documentada en config_template.js
   ============================================================ */
(function(){
'use strict';

const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzMGf_Gpf6UWswFPSqEBMdq-93GxGkrURsT4jtO9Jaz8yT5gyMMtp1btlcDZjRCeuAb/exec";
const TEACHER_PIN = "9986";
const MODULE_ID = CONFIG.moduleId;
const STEPS = CONFIG.steps; // array of {key, label}
let studentName = "";
let progress = {};
STEPS.forEach(s=>{ if(s.key!=='cert') progress[s.key]=false; });
let currentIdx = 0;
let vidasAventura = 3;

/* ---------- utilidades sheet ---------- */
function jsonpRequest(url){
  return new Promise((resolve,reject)=>{
    const cbName = 'cb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    const script = document.createElement('script');
    window[cbName] = function(data){
      resolve(data);
      delete window[cbName];
      script.remove();
    };
    script.onerror = function(){ reject(new Error('jsonp error')); delete window[cbName]; script.remove(); };
    script.src = url + (url.indexOf('?')>-1?'&':'?') + 'callback=' + cbName;
    document.body.appendChild(script);
    setTimeout(()=>{ if(window[cbName]){ resolve({rows:[]}); delete window[cbName]; script.remove(); } }, 8000);
  });
}
function sheetGet(sheetName){
  return jsonpRequest(SHEET_API_URL + '?sheet=' + encodeURIComponent(sheetName))
    .then(d=> (d && d.rows) ? d.rows : []);
}
function sheetPost(sheetName, row){
  // El backend (doPost) espera JSON: { sheet, row:[valores en orden de columnas] },
  // NO un formulario. Se envía con Content-Type "text/plain" a propósito: así el
  // navegador lo trata como solicitud "simple" (sin preflight CORS, que Apps Script
  // no maneja), y el servidor igual lee el texto crudo con JSON.parse(e.postData.contents).
  const payload = { sheet: sheetName, row: Object.keys(row).map(k=>row[k]) };
  return fetch(SHEET_API_URL, {
    method:'POST',
    mode:'no-cors',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    keepalive:true
  }).catch(()=>{});
}
function sheetDelete(sheetName, matchField, matchValue){
  const match = {}; match[matchField] = matchValue;
  const payload = { sheet: sheetName, action:'delete', match };
  return fetch(SHEET_API_URL, {
    method:'POST',
    mode:'no-cors',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    keepalive:true
  }).catch(()=>{});
}

/* ---------- arranque / anti-repetición ---------- */
function checkExisting(name){
  return sheetGet('Progreso').then(rows=>{
    return rows.some(r => String(r.Estudiante).trim().toLowerCase()===name.trim().toLowerCase()
                        && String(r.Modulo).trim()===MODULE_ID
                        && String(r.Score).trim()===String(STEPS.length-1)+'/completo');
  });
}

function nombreDesdePortal(){
  try{
    const params = new URLSearchParams(window.location.search);
    const n = (params.get('nombre')||'').trim();
    return n.length>0 ? n : null;
  }catch(e){ return null; }
}
function initModule(){
  const app = document.getElementById('app');
  const nombrePortal = nombreDesdePortal();
  app.innerHTML = `
    <div class="portada">
      <h1>${CONFIG.titulo}</h1>
      <p class="subtitulo">${CONFIG.subtitulo}</p>
      <div class="portada-caja">
        <label for="inpNombre">Nombre completo del estudiante:</label>
        <input id="inpNombre" type="text" placeholder="Nombre y apellidos" autocomplete="off" ${nombrePortal ? 'readonly' : ''} value="${nombrePortal ? nombrePortal.replace(/"/g,'&quot;') : ''}">
        <button id="btnComenzar" class="btn-primario">${nombrePortal ? 'Comenzar curso' : 'Comenzar curso'}</button>
        <p class="aviso">${nombrePortal ? 'Su nombre se tomó automáticamente de su sesión en el portal.' : ''} Este curso tiene una duración estimada de 4 horas e incluye actividades evaluadas, juegos y un certificado final. Solo puede completarse una vez.</p>
      </div>
      <button id="btnDocente" class="btn-link">Panel docente</button>
    </div>`;
  document.getElementById('btnComenzar').addEventListener('click', async ()=>{
    const name = document.getElementById('inpNombre').value.trim();
    if(!name){ alert('Por favor escriba su nombre completo.'); return; }
    const btn = document.getElementById('btnComenzar');
    btn.disabled = true; btn.textContent = 'Verificando...';
    let yaHizo = false;
    try{ yaHizo = await checkExisting(name); }catch(e){ yaHizo = false; }
    if(yaHizo){
      alert('Ya existe un intento completo registrado para este nombre. Si necesita repetir el curso, pida a su docente que reinicie su intento en el panel docente.');
      btn.disabled = false; btn.textContent = 'Comenzar curso';
      return;
    }
    studentName = name;
    monitorSalidaPantalla();
    renderProgBar();
    showStep(STEPS[0].key);
  });
  document.getElementById('btnDocente').addEventListener('click', openTeacherPanel);
}

/* ---------- navegación ---------- */
function renderProgBar(){
  let bar = document.getElementById('progBarWrap');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'progBarWrap';
    bar.className = 'progbar-wrap';
    document.body.insertBefore(bar, document.getElementById('app'));
  }
  const total = STEPS.length - 1;
  const done = STEPS.filter(s=>s.key!=='cert' && progress[s.key]).length;
  const pct = Math.round((done/total)*100);
  bar.innerHTML = `<div class="progbar-track"><div class="progbar-fill" style="width:${pct}%"></div></div>
    <div class="progbar-text">${CONFIG.titulo} — ${studentName} · ${done}/${total} actividades completas</div>`;
}

function allDone(){ return STEPS.filter(s=>s.key!=='cert').every(s=>progress[s.key]); }

function mostrarAvisoGuardado_(){
  let box = document.getElementById('avisoGuardadoBox');
  if(!box){
    box = document.createElement('div');
    box.id = 'avisoGuardadoBox';
    box.style.cssText = 'position:fixed;bottom:16px;right:16px;z-index:99999;padding:10px 16px;border-radius:8px;font:14px sans-serif;color:#fff;background:#555;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:opacity .3s;';
    document.body.appendChild(box);
  }
  box.style.opacity = '1';
  box.style.background = '#555';
  box.textContent = 'Guardando avance...';
  clearTimeout(box.__t1); clearTimeout(box.__t2);
  box.__t1 = setTimeout(()=>{
    box.style.background = '#1e8e3e';
    box.textContent = 'Avance guardado ✓';
  }, 350);
  box.__t2 = setTimeout(()=>{ box.style.opacity = '0'; }, 3000);
}

function markDone(key, score, total){
  if(score===undefined) score = 1;
  if(total===undefined) total = 1;
  progress[key] = { done:true, score, total };
  renderProgBar();
  mostrarAvisoGuardado_();
  sheetPost('Progreso', {
    Timestamp: new Date().toISOString(),
    Estudiante: studentName,
    Modulo: MODULE_ID + '_' + key + '_paso',
    Score: String(score), Total: String(total)
  });
  if(allDone()){
    sheetPost('Progreso', {
      Timestamp: new Date().toISOString(),
      Estudiante: studentName,
      Modulo: MODULE_ID,
      Score: (STEPS.length-1)+'/completo', Total: String(STEPS.length-1)
    });
    showStep('cert');
  }
}

function idxOf(key){ return STEPS.findIndex(s=>s.key===key); }

/* ---------- Rúbrica de evaluación por Resultado de Aprendizaje ---------- */
function getRubrica(){
  if(CONFIG.rubrica && CONFIG.rubrica.length) return CONFIG.rubrica;
  // Respaldo automático: un indicador por cada paso del curso (si el curso no define CONFIG.rubrica)
  return STEPS.filter(s=>s.key!=='cert').map(s=>({ra:s.label, texto:s.label, steps:[s.key]}));
}
function rubricaScoreLocal(item){
  let sum=0, total=0, any=false;
  item.steps.forEach(k=>{
    const p = progress[k];
    if(p && typeof p==='object'){ sum+=p.score; total+=p.total; any=true; }
  });
  return { sum, total, pct: any && total>0 ? Math.round((sum/total)*100) : null };
}
function competencyLevel(pctVal){
  if(pctVal===null) return { label:'Sin evidencia', cls:'status-pending' };
  if(pctVal<=50) return { label:'No logrado', cls:'status-bad' };
  if(pctVal<=80) return { label:'En proceso', cls:'status-mid' };
  return { label:'Logrado', cls:'status-ok' };
}
function renderRubricaTableLocal(){
  const rows = getRubrica().map(item=>{
    const s = rubricaScoreLocal(item);
    const lvl = competencyLevel(s.pct);
    return `<tr>
      <td><strong>${item.ra}</strong><br><span style="font-weight:400;font-size:.82rem;color:#7f8fb8;">${item.texto}</span></td>
      <td class="center">${s.total>0 ? s.sum+' / '+s.total : '—'}</td>
      <td class="center">${s.pct!==null ? s.pct+'%' : '—'}</td>
      <td class="center"><span class="${lvl.cls}">${lvl.label}</span></td>
    </tr>`;
  }).join('');
  return `<h3>Avance por resultado de aprendizaje</h3>
    <p class="rubrica-nota">Escala: 0–50% No logrado · 51–80% En proceso · 81–100% Logrado.</p>
    <table class="progress-table">
      <tr><th>Indicador</th><th>Puntaje</th><th>%</th><th>Nivel</th></tr>
      ${rows}
    </table>`;
}

function showStep(key){
  currentIdx = idxOf(key);
  const app = document.getElementById('app');
  const step = STEPS[currentIdx];
  const wrap = document.createElement('div');
  wrap.className = 'paso-wrap';
  app.innerHTML = '';
  app.appendChild(wrap);
  const renderers = {
    antologia: renderAntologiaStep, mc: renderMcStep, asocie: renderAsocieStep,
    complete: renderCompleteStep, sopa: renderSopaStep, cruci: renderCruciStep,
    caso: renderCasoStep,
    dino: (w)=> (CONFIG.dinoRica ? renderDinoStepRica(w) : renderDinoStep(w)),
    aventura: (w)=> (CONFIG.aventuraRica ? renderAventuraStepRica(w) : renderAventuraStep(w)),
    cert: renderCertStep
  };
  renderers[step.type || key](wrap);
  if(key!=='cert') navFooter(wrap, key);
  window.scrollTo(0,0);
}

function navFooter(wrap, currentKey){
  const foot = document.createElement('div');
  foot.className = 'nav-footer';
  const idx = idxOf(currentKey);
  const prevBtn = document.createElement('button');
  prevBtn.textContent = '← Anterior';
  prevBtn.className = 'btn-secundario';
  prevBtn.style.visibility = idx<=0 ? 'hidden':'visible';
  prevBtn.addEventListener('click', ()=> showStep(STEPS[idx-1].key));
  const nextBtn = document.createElement('button');
  nextBtn.textContent = 'Siguiente →';
  nextBtn.className = 'btn-secundario';
  nextBtn.id = 'navNextBtn';
  nextBtn.style.visibility = idx>=STEPS.length-1 ? 'hidden':'visible';
  nextBtn.addEventListener('click', ()=> showStep(STEPS[idx+1].key));
  foot.appendChild(prevBtn); foot.appendChild(nextBtn);
  wrap.appendChild(foot);
}

function renderMcStep(wrap){
  const nStep = idxOf('mc')+1;
  wrap.innerHTML = `<h2>${nStep}. Selección única (${CONFIG.mc.length} preguntas)</h2>
    <form id="mcForm"></form>
    <button id="btnMcCheck" class="btn-primario">Comprobar</button>
    <p id="mcResultado" class="resultado"></p>`;
  const form = document.getElementById('mcForm');
  CONFIG.mc.forEach((q,i)=>{
    const div = document.createElement('div');
    div.className = 'pregunta-mc';
    div.innerHTML = `<p><strong>${i+1}.</strong> ${q.q}</p>` +
      q.opciones.map((op,j)=>`<label class="opcion"><input type="radio" name="mc${i}" value="${j}"> ${op}</label>`).join('');
    form.appendChild(div);
  });
  document.getElementById('btnMcCheck').addEventListener('click', ()=>{
    let correctas = 0;
    CONFIG.mc.forEach((q,i)=>{
      const sel = form.querySelector(`input[name="mc${i}"]:checked`);

/* ---------- 5. Sopa de letras ---------- */
function generarSopa(words, size){
  const grid = Array.from({length:size}, ()=>Array(size).fill(null));
  const dirs = [[0,1],[1,0],[1,1],[-1,1]];
  const placed = [];
  words.forEach(word=>{
    let ok = false, tries = 0;
    while(!ok && tries<200){
      tries++;
      const dir = dirs[Math.floor(Math.random()*dirs.length)];
      const row0 = Math.floor(Math.random()*size);
      const col0 = Math.floor(Math.random()*size);
      const endRow = row0 + dir[0]*(word.length-1);
      const endCol = col0 + dir[1]*(word.length-1);
      if(endRow<0||endRow>=size||endCol<0||endCol>=size) continue;
      let fits = true;
      for(let k=0;k<word.length;k++){
        const r = row0+dir[0]*k, c = col0+dir[1]*k;
        if(grid[r][c] !== null && grid[r][c] !== word[k]){ fits=false; break; }
      }
      if(!fits) continue;
      for(let k=0;k<word.length;k++){
        const r = row0+dir[0]*k, c = col0+dir[1]*k;
        grid[r][c] = word[k];
      }
      placed.push({word, row0, col0, dir});
      ok = true;
    }
  });
  const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(grid[r][c]===null) grid[r][c] = letras[Math.floor(Math.random()*letras.length)];
  return {grid, placed};
}

let sopaState = null;
function renderSopaStep(wrap){
  const nStep = idxOf('sopa')+1;
  const size = CONFIG.sopa.size || 12;
  const {grid, placed} = generarSopa(CONFIG.sopa.words.map(w=>w.toUpperCase()), size);
  sopaState = { grid, placed, found:new Set(), selecting:null };
  window.__sopaState = sopaState; // expuesto solo para pruebas automatizadas
  wrap.innerHTML = `<h2>${nStep}. Sopa de letras</h2>
    <p>Encuentre las ${placed.length} palabras. Haga clic en la primera letra y luego en la última letra de cada palabra.</p>
    <div class="sopa-flex">
      <div id="sopaGrid" class="sopa-grid" style="grid-template-columns:repeat(${size},1fr)"></div>
      <div id="sopaLista" class="sopa-lista"></div>
    </div>
    <p id="sopaResultado" class="resultado"></p>`;
  const gridDiv = document.getElementById('sopaGrid');
  const cells = [];
  for(let r=0;r<size;r++){
    for(let c=0;c<size;c++){
      const cell = document.createElement('div');
      cell.className = 'sopa-cell';
      cell.textContent = grid[r][c];
      cell.dataset.r = r; cell.dataset.c = c;
      cell.addEventListener('click', ()=> onSopaCellClick(r,c,cells));
      gridDiv.appendChild(cell);
      cells.push(cell);
    }
  }
  const lista = document.getElementById('sopaLista');
  lista.innerHTML = '<h4>Palabras</h4>' + CONFIG.sopa.words.map(w=>`<p data-word="${w.toUpperCase()}" class="sopa-word">${w}</p>`).join('');
  checkSopaComplete();
}
function cellAt(cells,r,c,size){ return cells[r*size+c]; }
function onSopaCellClick(r,c, cells){
  const size = CONFIG.sopa.size || 12;
  const st = sopaState;
  const cell = cellAt(cells,r,c,size);
  if(!st.selecting){
    st.selecting = {r,c};
    cell.classList.add('sopa-sel');
    return;
  }
  const start = st.selecting;
  st.selecting = null;
  cells.forEach(cc=>cc.classList.remove('sopa-sel'));
  if(start.r===r && start.c===c) return;
  const dr = Math.sign(r-start.r), dc = Math.sign(c-start.c);
  const match = st.placed.find(p=>{
    if(p.dir[0]!==dr || p.dir[1]!==dc) return false;
    const endR = p.row0 + p.dir[0]*(p.word.length-1);
    const endC = p.col0 + p.dir[1]*(p.word.length-1);
    return (p.row0===start.r && p.col0===start.c && endR===r && endC===c);
  });
  if(match && !st.found.has(match.word)){
    st.found.add(match.word);
    for(let k=0;k<match.word.length;k++){
      const rr = match.row0+match.dir[0]*k, cc = match.col0+match.dir[1]*k;
      cellAt(cells,rr,cc,size).classList.add('sopa-found');
    }
    const li = document.querySelector(`.sopa-word[data-word="${match.word}"]`);
    if(li) li.classList.add('sopa-word-done');
    checkSopaComplete();
  }
}
function checkSopaComplete(){
  const el = document.getElementById('sopaResultado');
  if(!el) return;
  const total = sopaState.placed.length;
  const found = sopaState.found.size;
  el.textContent = `Encontradas: ${found}/${total}`;
  if(found>=total){
    el.textContent += ' ¡Completado!';
    markDone('sopa');
  }
}

/* ---------- 6. Crucigrama ---------- */
function buildCruciCellMap(){
  const map = {}; // key "r,c" -> {letter, cells refs later}
  CONFIG.cruci.words.forEach(w=>{
    for(let k=0;k<w.word.length;k++){
      const r = w.row + (w.dir==='v'?k:0);
      const c = w.col + (w.dir==='h'?k:0);
      const key = r+','+c;
      map[key] = { letter: w.word[k].toUpperCase() };
    }
  });
  return map;
}
function renderCruciStep(wrap){
  const nStep = idxOf('cruci')+1;
  const size = CONFIG.cruci.size;
  const cellMap = buildCruciCellMap();
  wrap.innerHTML = `<h2>${nStep}. Crucigrama</h2>
    <div class="cruci-flex">
      <div id="cruciGrid" class="cruci-grid" style="grid-template-columns:repeat(${size.cols},2rem)"></div>
      <div id="cruciClues" class="cruci-clues"></div>
    </div>
    <button id="btnCruciCheck" class="btn-primario">Comprobar</button>
    <p id="cruciResultado" class="resultado"></p>`;
  const gridDiv = document.getElementById('cruciGrid');
  const numberStarts = {};
  CONFIG.cruci.words.forEach(w=>{ numberStarts[w.row+','+w.col] = w.num; });
  for(let r=0;r<size.rows;r++){
    for(let c=0;c<size.cols;c++){
      const key = r+','+c;
      const td = document.createElement('div');
      if(cellMap[key]){
        td.className = 'cruci-cell';
        td.dataset.r = r; td.dataset.c = c;
        td.dataset.answer = cellMap[key].letter;
        if(numberStarts[key]){
          const num = document.createElement('span');
          num.className = 'cruci-num'; num.textContent = numberStarts[key];
          td.appendChild(num);
        }
        const input = document.createElement('input');
        input.maxLength = 1;
        input.addEventListener('input', (e)=>{ e.target.value = e.target.value.toUpperCase().slice(-1); });
        td.appendChild(input);
      } else {
        td.className = 'cruci-cell cruci-blank';
      }
      gridDiv.appendChild(td);
    }
  }
  const clues = document.getElementById('cruciClues');
  clues.innerHTML = '<h4>Pistas</h4>' + CONFIG.cruci.words.map(w=>
    `<p><strong>${w.num}${w.dir==='h'?'H':'V'}.</strong> ${w.clue}</p>`).join('');
  document.getElementById('btnCruciCheck').addEventListener('click', ()=>{
    const cellDivs = gridDiv.querySelectorAll('.cruci-cell:not(.cruci-blank)');
    let total = cellDivs.length, correctas = 0;
    cellDivs.forEach(td=>{
      const input = td.querySelector('input');
      const ok = input.value.trim().toUpperCase() === td.dataset.answer;
      input.classList.toggle('cruci-ok', ok);
      input.classList.toggle('cruci-bad', !ok && input.value.trim()!=='');
      if(ok) correctas++;
    });
    const pct = Math.round((correctas/total)*100);
    document.getElementById('cruciResultado').textContent = `Casillas correctas: ${correctas}/${total} (${pct}%).`;
    if(correctas===total){ markDone('cruci', correctas, total); document.getElementById('cruciResultado').textContent += ' ¡Crucigrama completo!'; }
  });
}

/* ---------- 7. Estudio de caso + foro ---------- */
function caseKey(){ return MODULE_ID+'_caso'; }
function commentKey(){ return MODULE_ID+'_comentario'; }
function renderCasoStep(wrap){
  const nStep = idxOf('caso')+1;
  wrap.innerHTML = `<h2>${nStep}. Estudio de caso</h2>
    <div class="caso-texto">${CONFIG.caso.html}</div>
    <p><strong>${CONFIG.caso.pregunta}</strong></p>
    <textarea id="casoRespuesta" rows="6" placeholder="Escriba su análisis (mínimo 80 palabras)..."></textarea>
    <button id="btnCasoEnviar" class="btn-primario">Publicar mi respuesta</button>
    <p id="casoResultado" class="resultado"></p>
    <hr>
    <h3>Foro: respuestas de sus compañeros</h3>
    <div id="foroLista">Cargando...</div>`;
  loadForo();
  document.getElementById('btnCasoEnviar').addEventListener('click', ()=>{
    const texto = document.getElementById('casoRespuesta').value.trim();
    const palabras = texto.split(/\s+/).filter(Boolean).length;
    if(palabras<40){ document.getElementById('casoResultado').textContent = 'Su respuesta debe tener al menos 40 palabras.'; return; }
    sheetPost('Casos', { Timestamp: new Date().toISOString(), CasoId: caseKey(), Nombre: studentName, Texto: texto });
    document.getElementById('casoResultado').textContent = 'Respuesta publicada. ¡Gracias!';
    markDone('caso');
    setTimeout(loadForo, 1200);
  });
}
function loadForo(){
  const box = document.getElementById('foroLista');
  Promise.all([sheetGet('Casos')]).then(([rows])=>{
    const posts = rows.filter(r=>String(r.CasoId).trim()===caseKey());
    const comments = rows.filter(r=>String(r.CasoId).trim()===commentKey());
    if(!box) return;
    if(posts.length===0){ box.innerHTML = '<p>Aún no hay respuestas publicadas. ¡Sea el primero!</p>'; return; }
    box.innerHTML = posts.map(p=>{
      const nombre = p.Nombre;
      const misComentarios = comments.filter(c=> String(c.Texto).startsWith('→'+nombre+'|'));
      const comentariosHtml = misComentarios.map(c=>{
        const txt = String(c.Texto).split('|').slice(1).join('|');
        return `<div class="foro-comentario"><strong>${c.Nombre||'Compañero/a'}:</strong> ${txt}</div>`;
      }).join('');
      return `<div class="foro-post">
        <p><strong>${nombre}</strong> escribió:</p>
        <p>${p.Texto}</p>
        <div class="foro-comentarios">${comentariosHtml}</div>
        <div class="foro-nuevo-comentario">
          <input type="text" placeholder="Comentar la respuesta de ${nombre}..." data-target="${nombre}">
          <button class="btn-secundario foro-btn-comentar" data-target="${nombre}">Comentar</button>
        </div>
      </div>`;
    }).join('');
    box.querySelectorAll('.foro-btn-comentar').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const target = btn.dataset.target;
        const input = box.querySelector(`input[data-target="${CSS.escape(target)}"]`);
        enviarComentario(input, target);
      });
    });
  });
}
function enviarComentario(input, target){
  const texto = input.value.trim();
  if(!texto) return;
  sheetPost('Casos', { Timestamp: new Date().toISOString(), CasoId: commentKey(), Nombre: studentName, Texto: '→'+target+'|'+texto });
  input.value = '';
  input.disabled = true;
  setTimeout(loadForo, 1000);
}

/* ---------- 8. Juego del dinosaurio ---------- */
function renderDinoStep(wrap){
  const nStep = idxOf('dino')+1;
  wrap.innerHTML = `<h2>${nStep}. Juego: Corre y responde</h2>
    <p>Presione ESPACIO o toque la pantalla para saltar los obstáculos. Cada cierto tramo aparecerá una pregunta: respóndala bien para seguir corriendo.</p>
    <canvas id="dinoCanvas" width="700" height="220"></canvas>
    <div id="dinoOverlay"></div>
    <p id="dinoResultado" class="resultado"></p>`;
  const canvas = document.getElementById('dinoCanvas');
  const ctx = canvas.getContext('2d');
  let player = {x:50,y:170,w:24,h:30,vy:0,jumping:false};
  const groundY = 200;
  let obstacles = [];
  let frame = 0;
  let speed = 4;
  let distance = 0;
  let paused = false;
  let quizPending = false;
  let running = true;
  let nextQuizAt = 400;

  function spawnObstacle(){
    obstacles.push({x:canvas.width, w:16+Math.random()*10, h:20+Math.random()*20});
  }
  function jump(){
    if(!player.jumping && !paused){ player.vy = -10; player.jumping = true; }
  }
  window.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); jump(); } });
  canvas.addEventListener('click', jump);

  function showDinoQuiz(){
    paused = true; quizPending = true;
    const pool = CONFIG.gameQuestions;
    const q = pool[Math.floor(Math.random()*pool.length)];
    const overlay = document.getElementById('dinoOverlay');
    overlay.innerHTML = `<div class="game-quiz"><p>${q.q}</p>` +
      q.opciones.map((op,j)=>`<button class="btn-secundario dino-opt" data-i="${j}">${op}</button>`).join('') + `</div>`;
    overlay.querySelectorAll('.dino-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const ok = parseInt(btn.dataset.i,10)===q.correcta;
        overlay.innerHTML = `<p class="${ok?'ok':'bad'}">${ok?'¡Correcto! Continúa corriendo.':'Incorrecto. Intente de nuevo más adelante.'}</p>`;
        setTimeout(()=>{ overlay.innerHTML=''; paused=false; quizPending=false; nextQuizAt = distance+300+Math.random()*200; }, 900);
      });
    });
  }

  function loop(){
    if(!running) return;
    if(!paused){
      frame++;
      distance += speed;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#eef6ff'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#334155'; ctx.fillRect(0, groundY+player.h, canvas.width, 4);
      player.vy += 0.6; player.y += player.vy;
      if(player.y > 170){ player.y = 170; player.vy=0; player.jumping=false; }
      ctx.fillStyle = '#2563eb'; ctx.fillRect(player.x, player.y, player.w, player.h);
      if(frame%90===0) spawnObstacle();
      obstacles.forEach(o=> o.x -= speed);
      obstacles = obstacles.filter(o=>o.x> -30);
      ctx.fillStyle = '#dc2626';
      obstacles.forEach(o=> ctx.fillRect(o.x, groundY+player.h-o.h, o.w, o.h));
      obstacles.forEach(o=>{
        if(player.x < o.x+o.w && player.x+player.w > o.x && player.y+player.h > groundY+player.h-o.h){
          distance = Math.max(0, distance-60);
        }
      });
      ctx.fillStyle = '#0f172a';
      ctx.font = '14px sans-serif';
      ctx.fillText('Distancia: '+Math.floor(distance)+' m', 10, 20);
      if(distance >= nextQuizAt && !quizPending){ showDinoQuiz(); }
      if(distance >= 2000){
        running = false;
        document.getElementById('dinoResultado').textContent = '¡Meta alcanzada! Actividad completada.';
        markDone('dino');
        return;
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
}

  </style>
  <h2>${nStep}. Juego: Corre y responde</h2>
  <p>Toque la pantalla o presione ESPACIO para saltar los obstáculos. La velocidad aumenta con el puntaje. Si choca, deberá responder una pregunta correctamente para seguir — si falla, se reinicia el intento.</p>
  <div class="dino2-hud">
    <span class="dino2-score" id="dino2Score">Puntos: 0</span>
    <span class="dino2-best" id="dino2Best">Mejor: 0</span>
  </div>
  <div class="dino2-gamebox" id="dino2Box">
    <div class="dino2-ground"></div>
    <div class="dino2-player" id="dino2Player">🦖</div>
    <div class="dino2-startOverlay" id="dino2StartOverlay">
      <h2>🏃 Corre y Responde</h2>
      <p>Toque o presione ESPACIO para saltar los obstáculos. Si choca, responda bien para seguir — si falla, se reinicia el intento.</p>
      <button class="dino2-bigbtn" id="dino2StartBtn">▶️ Comenzar</button>
    </div>
  </div>
  <p class="dino2-controls-hint">Toque la pantalla / Espacio = saltar</p>
  <p id="dinoResultado" class="resultado"></p>`;

  const WIN_SCORE = 1000;
  let running=false, paused=false, score=0, best=0, speed=4.2, spawnTimer=0, spawnInterval=90, jumping=false;
  let obstacles=[], usedQuestions=[], animFrame=null;
  let totalCorrect=0, totalAnswered=0;

  const gameBox = wrap.querySelector('#dino2Box');
  const player = wrap.querySelector('#dino2Player');
  const scoreDisplay = wrap.querySelector('#dino2Score');
  const bestDisplay = wrap.querySelector('#dino2Best');
  const startOverlay = wrap.querySelector('#dino2StartOverlay');
  const dinoResultado = wrap.querySelector('#dinoResultado');

  function updateHUD(){
    scoreDisplay.textContent = 'Puntos: ' + Math.floor(score);
    bestDisplay.textContent = 'Mejor: ' + Math.floor(best);
  }
  function resetGameState(){
    score=0; speed=4.2; spawnInterval=90; spawnTimer=0;
    obstacles.forEach(o=>o.el.remove()); obstacles=[];
    updateHUD();
  }
  wrap.querySelector('#dino2StartBtn').addEventListener('click', ()=>{
    startOverlay.style.display='none';
    resetGameState();
    running=true; paused=false;
    loop();
  });
  function doJump(){
    if(!running||paused||jumping) return;
    jumping=true;
    player.classList.add('jump');
    player.style.transform='scaleX(-1) translateY(-70px)';
    setTimeout(()=>{
      player.style.transform='scaleX(-1) translateY(0)';
      setTimeout(()=>{ jumping=false; player.classList.remove('jump'); },480);
    },260);
  }
  gameBox.addEventListener('mousedown', doJump);
  gameBox.addEventListener('touchstart', e=>{ e.preventDefault(); doJump(); }, {passive:false});
  const dino2Keydown = e=>{
    if(e.code==='Space' && running && !paused){ e.preventDefault(); doJump(); }
  };
  document.addEventListener('keydown', dino2Keydown);

  function spawnObstacle(){
    const el=document.createElement('div');
    const isColon = Math.random()<0.5;
    el.className='dino2-obstacle'+(isColon?' dino2-colon':'');
    el.textContent = isColon ? '₡' : '💲';
    el.style.right='-30px';
    gameBox.appendChild(el);
    obstacles.push({el, x: gameBox.clientWidth+10});
  }
  function rectsOverlap(a,b){ return !(a.right<b.left || a.left>b.right || a.bottom<b.top || a.top>b.bottom); }

  function loop(){
    if(!running||paused) return;
    score += 0.12;
    if(score>=WIN_SCORE){ score=WIN_SCORE; showWin(); return; }
    speed = Math.min(16, 4.2+score*0.012);
    spawnTimer++;
    if(spawnTimer>spawnInterval){
      spawnTimer=0;
      spawnInterval = Math.max(48, 90-score*0.3);
      spawnObstacle();
    }
    const boxRect = gameBox.getBoundingClientRect();
    const playerRect = player.getBoundingClientRect();
    const playerBox = { left:playerRect.left-boxRect.left+6, right:playerRect.right-boxRect.left-6, top:playerRect.top-boxRect.top+4, bottom:playerRect.bottom-boxRect.top };
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      o.x -= speed;
      o.el.style.right='auto';
      o.el.style.left=o.x+'px';
      if(o.x<-40){ o.el.remove(); obstacles.splice(i,1); continue; }
      const oRect=o.el.getBoundingClientRect();
      const oBox={ left:oRect.left-boxRect.left+4, right:oRect.right-boxRect.left-4, top:oRect.top-boxRect.top+4, bottom:oRect.bottom-boxRect.top };
      if(!jumping && rectsOverlap(playerBox,oBox)){ handleCollision(); return; }
    }
    updateHUD();
    animFrame = requestAnimationFrame(loop);
  }
  function handleCollision(){
    paused=true;
    if(animFrame) cancelAnimationFrame(animFrame);
    best=Math.max(best,score);
    updateHUD();
    showQuestion();
  }
  function pickQuestion(){
    const pool = CONFIG.gameQuestions;
    const available = pool.filter((_,i)=>!usedQuestions.includes(i));
    const list = available.length ? available : pool;
    const chosen = list[Math.floor(Math.random()*list.length)];
    const idx = pool.indexOf(chosen);
    usedQuestions.push(idx);
    if(usedQuestions.length>=pool.length) usedQuestions=[];
    return chosen;
  }
  function showQuestion(){
    const item = pickQuestion();
    const overlay=document.createElement('div');
    overlay.className='dino2-qOverlay';
    overlay.innerHTML = `<span class="dino2-qtag">⚠️ Chocaste — respondé bien para revivir</span>
      <div class="dino2-qtext">${item.q}</div><div class="dino2-opts"></div>`;
    gameBox.appendChild(overlay);
    const optsDiv = overlay.querySelector('.dino2-opts');
    item.opciones.forEach((optText,oi)=>{
      const opt=document.createElement('div');
      opt.className='dino2-opt';
      opt.textContent=optText;
      opt.addEventListener('click', ()=>{
        if(overlay.dataset.answered) return;
        overlay.dataset.answered='1';
        optsDiv.querySelectorAll('.dino2-opt').forEach(o=>o.classList.add('locked'));
        const isCorrect = oi===item.correcta;
        opt.classList.add(isCorrect?'chosen-correct':'chosen-incorrect');
        if(!isCorrect) optsDiv.querySelectorAll('.dino2-opt')[item.correcta].classList.add('reveal-correct');
        totalAnswered++; if(isCorrect) totalCorrect++;
        setTimeout(()=>{
          overlay.remove();
          if(isCorrect){ resumeAfterCorrect(); } else { showGameOver(); }
        },1300);
      });
      optsDiv.appendChild(opt);
    });
  }
  function resumeAfterCorrect(){
    obstacles.forEach(o=>o.el.remove()); obstacles=[];
    spawnTimer=0; paused=false;
    animFrame=requestAnimationFrame(loop);
  }
  function showWin(){
    running=false; paused=false;
    if(animFrame) cancelAnimationFrame(animFrame);
    best=Math.max(best,score);
    updateHUD();
    const overlay=document.createElement('div');
    overlay.className='dino2-winOverlay';
    overlay.innerHTML=`<h2>🏆 ¡Meta alcanzada!</h2>
      <p>Llegaste a ${WIN_SCORE} puntos. Preguntas respondidas: ${totalAnswered} · Correctas: ${totalCorrect}</p>`;
    gameBox.appendChild(overlay);
    dinoResultado.textContent = '¡Meta alcanzada! Actividad completada.';
    markDone('dino');
  }
  function showGameOver(){
    running=false; paused=false;
    const overlay=document.createElement('div');
    overlay.className='dino2-overOverlay';
    overlay.innerHTML=`<h3>💥 Fin del intento</h3>
      <p>Puntaje: <strong>${Math.floor(score)}</strong> · Mejor: <strong>${Math.floor(best)}</strong></p>
      <button class="dino2-bigbtn" id="dino2RetryBtn">🔄 Reintentar</button>`;
    gameBox.appendChild(overlay);
    overlay.querySelector('#dino2RetryBtn').addEventListener('click', ()=>{
      overlay.remove(); resetGameState(); running=true; paused=false; loop();
    });
  }

  updateHUD();

  // Test/debug hook (used by the automated test suite to reach the win condition without a full real-time playthrough)
  window.__dinoRicaDebug = {
    forceWin: ()=>{ score=WIN_SCORE; showWin(); },
    getState: ()=>({score,best,running,paused}),
  };
}

/* ---------- 9. Juego de aventura (plataformas) ---------- */
function renderAventuraStep(wrap){
  const nStep = idxOf('aventura')+1;
  wrap.innerHTML = `<h2>${nStep}. Juego de aventura</h2>
    <p>Use las flechas ← → para moverse y ↑ o ESPACIO para saltar. Recoja todas las monedas y llegue a la bandera. Cuidado con los obstáculos: le harán perder una vida y deberá responder una pregunta para recuperarla.</p>
    <canvas id="avCanvas" width="700" height="300"></canvas>
    <div id="avOverlay"></div>
    <p id="avEstado">Vidas: <span id="avVidas">3</span> · Monedas: <span id="avMonedas">0</span>/<span id="avMonedasTotal">0</span></p>
    <p id="avResultado" class="resultado"></p>`;
  const canvas = document.getElementById('avCanvas');
  const ctx = canvas.getContext('2d');
  const platforms = [
    {x:0,y:270,w:700,h:30},
    {x:150,y:210,w:100,h:14},
    {x:320,y:170,w:100,h:14},
    {x:480,y:210,w:100,h:14},
    {x:600,y:150,w:80,h:14}
  ];
  const coins = [
    {x:190,y:180,r:8,got:false},
    {x:360,y:140,r:8,got:false},
    {x:520,y:180,r:8,got:false},
    {x:630,y:120,r:8,got:false},
    {x:40,y:240,r:8,got:false}
  ];
  const obstacles = [ {x:260,y:255,w:16,h:16}, {x:430,y:255,w:16,h:16} ];
  document.getElementById('avMonedasTotal').textContent = coins.length;
  let vidas = 3;
  let flag = {x:660,y:100,w:20,h:50};
  let player = {x:20,y:230,w:20,h:30,vx:0,vy:0,onGround:false};
  const keys = {};
  let paused = false, running = true;
  function keydown(e){ keys[e.code]=true; if(e.code==='Space') e.preventDefault(); }
  function keyup(e){ keys[e.code]=false; }
  window.addEventListener('keydown', keydown);
  window.addEventListener('keyup', keyup);

  function rectsOverlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

  function showAvQuiz(onResolved){
    paused = true;
    const pool = CONFIG.gameQuestions;
    const q = pool[Math.floor(Math.random()*pool.length)];
    const overlay = document.getElementById('avOverlay');
    overlay.innerHTML = `<div class="game-quiz"><p>${q.q}</p>` +
      q.opciones.map((op,j)=>`<button class="btn-secundario av-opt" data-i="${j}">${op}</button>`).join('') + `</div>`;
    overlay.querySelectorAll('.av-opt').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const ok = parseInt(btn.dataset.i,10)===q.correcta;
        overlay.innerHTML = `<p class="${ok?'ok':'bad'}">${ok?'¡Correcto! Recupera una vida.':'Incorrecto.'}</p>`;
        if(ok) vidas = Math.min(3, vidas+1);
        document.getElementById('avVidas').textContent = vidas;
        setTimeout(()=>{ overlay.innerHTML=''; paused=false; onResolved && onResolved(); }, 800);
      });
    });
  }

  function loop(){
    if(!running) return;
    if(!paused){
      if(keys['ArrowLeft']) player.vx = -3;
      else if(keys['ArrowRight']) player.vx = 3;
      else player.vx = 0;
      if((keys['ArrowUp']||keys['Space']) && player.onGround){ player.vy = -9; player.onGround=false; }
      player.vy += 0.5;
      player.x += player.vx; player.y += player.vy;
      player.onGround = false;
      platforms.forEach(p=>{
        if(player.x < p.x+p.w && player.x+player.w > p.x && player.y+player.h > p.y && player.y+player.h < p.y+p.h+12 && player.vy>=0){
          player.y = p.y - player.h; player.vy = 0; player.onGround = true;
        }
      });
      if(player.x<0) player.x=0;
      if(player.x+player.w>canvas.width) player.x = canvas.width-player.w;
      if(player.y>canvas.height){ player.x=20; player.y=230; }
      coins.forEach(c=>{
        if(!c.got && Math.hypot((player.x+player.w/2)-c.x, (player.y+player.h/2)-c.y) < c.r+16){
          c.got = true;
          document.getElementById('avMonedas').textContent = coins.filter(cc=>cc.got).length;
        }
      });
      obstacles.forEach(o=>{
        if(rectsOverlap(player,o)){
          vidas--;
          document.getElementById('avVidas').textContent = vidas;
          player.x = 20; player.y = 230; player.vy=0;
          if(vidas<=0){
            showAvQuiz(()=>{ vidas=1; document.getElementById('avVidas').textContent=vidas; });
          }
        }
      });
      if(coins.every(c=>c.got) && rectsOverlap(player, flag)){
        running = false;
        document.getElementById('avResultado').textContent = '¡Meta alcanzada con todas las monedas! Actividad completada.';
        markDone('aventura');
        return;
      }
    }
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#f0fdf4'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#166534';
    platforms.forEach(p=> ctx.fillRect(p.x,p.y,p.w,p.h));
    ctx.fillStyle = '#facc15';
    coins.forEach(c=>{ if(!c.got){ ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.fill(); } });
    ctx.fillStyle = '#dc2626';
    obstacles.forEach(o=>{
      ctx.beginPath(); ctx.moveTo(o.x,o.y+o.h); ctx.lineTo(o.x+o.w/2,o.y); ctx.lineTo(o.x+o.w,o.y+o.h); ctx.closePath(); ctx.fill();
    });
    ctx.fillStyle = coins.every(c=>c.got) ? '#16a34a' : '#94a3b8';
    ctx.fillRect(flag.x, flag.y, flag.w, flag.h);
    ctx.fillStyle = '#1d4ed8';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    requestAnimationFrame(loop);
  }
  loop();
}

/* ---------- 9b. Juego de aventura — versión rica (5 niveles, plataformas, power-ups, fantasmas) ---------- */
function renderAventuraStepRica(wrap){

  wrap.innerHTML = `<h2>${nStep}. Juego de aventura</h2>

      else { loseLife(); }
    });
    if(rectsOverlap(pRect,{x:lvl.flag.x,y:lvl.flag.y,w:20,h:26})){
      if(coinsCollected >= lvl.coins.length) onLevelComplete();
    }
  }
  function stompEnemy(i){
    enemyAlive[i]=false; enemyEls[i].classList.add('av2-squash');
    setTimeout(()=>{ enemyEls[i].style.display='none'; }, 300);
    pvy = STOMP_BOUNCE; totalStomps++;
  }
  function loseLife(){
    if(paused) return;
    paused = true; lives--; updateHUD();
    if(lives<=0){ showGameOver(); return; }
    showQuestion();
  }
  function pickQuestion(){
    const bank = CONFIG.gameQuestions;
    const avail = bank.filter((_,i)=>!usedQ.includes(i));
    const pool = avail.length?avail:bank;
    const idx = bank.indexOf(pool[Math.floor(Math.random()*pool.length)]);
    usedQ.push(idx);
    if(usedQ.length>=bank.length) usedQ=[];
    return bank[idx];
  }
  function showQuestion(){
    const item = pickQuestion();
    const overlay = document.createElement('div');
    overlay.className='av2-qoverlay';
    overlay.innerHTML = `<span class="av2-qtag">💔 Perdiste una vida — respondé bien para recuperarla</span>
      <div class="av2-qtext">${item.q}</div><div class="av2-opts"></div>`;
    gameBox.appendChild(overlay);
    const optsDiv = overlay.querySelector('.av2-opts');
    item.opciones.forEach((optText,oi)=>{
      const opt=document.createElement('div'); opt.className='av2-opt';
      opt.textContent = optText;
      opt.addEventListener('click', ()=>{
        if(overlay.dataset.answered) return;
        overlay.dataset.answered='1';
        optsDiv.querySelectorAll('.av2-opt').forEach(o=>o.classList.add('av2-locked'));
        const isCorrect = oi===item.correcta;
        opt.classList.add(isCorrect?'av2-chosen-correct':'av2-chosen-incorrect');
        if(!isCorrect) optsDiv.querySelectorAll('.av2-opt')[item.correcta].classList.add('av2-reveal-correct');
        setTimeout(()=>{
          overlay.remove();
          if(isCorrect){ lives++; updateHUD(); }
          paused=false; resetPlayerToStart();
          rafId = requestAnimationFrame(loop);
        }, 1300);
      });
      optsDiv.appendChild(opt);
    });
  }
  function showGameOver(){
    running=false; paused=false;
    const overlay = document.createElement('div');
    overlay.className='av2-overlay';
    overlay.innerHTML = `<h3>💥 Sin vidas</h3>
      <p>Llegaste al nivel ${currentLevel().levelNum} de ${LEVELS.length} · Fantasmas eliminados: ${totalStomps}</p>
      <button class="av2-btn" id="av2RetryBtn">🔄 Reintentar desde el nivel 1</button>`;
    gameBox.appendChild(overlay);
    overlay.querySelector('#av2RetryBtn').addEventListener('click', ()=>{ overlay.remove(); startGame(); });
  }
  function onLevelComplete(){
    running=false; paused=true;
    if(rafId) cancelAnimationFrame(rafId);
    const isLastLevel = currentLevelIdx >= LEVELS.length-1;
    const overlay = document.createElement('div');
    if(isLastLevel){
      overlay.className='av2-overlay av2-win';
      overlay.innerHTML = `<h3>🏆 ¡Completaste los ${LEVELS.length} niveles!</h3>
        <p>Fantasmas eliminados: ${totalStomps}</p>
        <button class="av2-btn" id="av2PlayAgainBtn">🔄 Jugar de nuevo</button>`;
    } else {
      overlay.className='av2-overlay av2-levelup';
      overlay.innerHTML = `<h3>✅ ¡Nivel ${currentLevel().levelNum} completo!</h3>
        <p>Preparate para el nivel ${currentLevel().levelNum+1}.</p>
        <button class="av2-btn" id="av2NextLevelBtn">➡️ Siguiente nivel</button>`;
    }
    gameBox.appendChild(overlay);
    if(isLastLevel){
      avResultado.textContent = '¡Meta alcanzada en los 5 niveles! Actividad completada.';
      markDone('aventura');
      overlay.querySelector('#av2PlayAgainBtn').addEventListener('click', ()=>{ overlay.remove(); startGame(); });
    } else {
      overlay.querySelector('#av2NextLevelBtn').addEventListener('click', ()=>{
        overlay.remove(); loadLevel(currentLevelIdx+1); running=true; paused=false;
        rafId = requestAnimationFrame(loop);
      });
    }
  }
  function loop(){ if(!running||paused) return; physicsStep(); rafId = requestAnimationFrame(loop); }
  function startGame(){
    lives=3; totalStomps=0; usedQ=[];
    loadLevel(0); running=true; paused=false;
    rafId = requestAnimationFrame(loop);
  }

  wrap.querySelector('#av2StartBtn').addEventListener('click', ()=>{
    wrap.querySelector('#av2StartOverlay').remove();
    startGame();
  });
  function bindHold(el,onDown,onUp){
    el.addEventListener('mousedown',onDown); el.addEventListener('mouseup',onUp); el.addEventListener('mouseleave',onUp);
    el.addEventListener('touchstart', e=>{ e.preventDefault(); onDown(); }, {passive:false});
    el.addEventListener('touchend', e=>{ e.preventDefault(); onUp(); }, {passive:false});
  }
  bindHold(wrap.querySelector('#av2LeftBtn'), ()=>leftHeld=true, ()=>leftHeld=false);
  bindHold(wrap.querySelector('#av2RightBtn'), ()=>rightHeld=true, ()=>rightHeld=false);
  wrap.querySelector('#av2JumpBtn').addEventListener('click', ()=>{ if(grounded && running && !paused){ pvy=JUMP_VELOCITY; grounded=false; } });
  const av2Keydown = e=>{
    if(!running||paused) return;
    if(e.code==='ArrowLeft') leftHeld=true;
    if(e.code==='ArrowRight') rightHeld=true;
    if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault && e.code==='Space' && e.preventDefault(); if(grounded){ pvy=JUMP_VELOCITY; grounded=false; } }
  };
  const av2Keyup = e=>{ if(e.code==='ArrowLeft') leftHeld=false; if(e.code==='ArrowRight') rightHeld=false; };
  document.addEventListener('keydown', av2Keydown);
  document.addEventListener('keyup', av2Keyup);

  // Test/debug hook (used by the automated test suite to verify all 5 levels + markDone without a full manual playthrough)
  window.__avRicaDebug = {
    start: ()=> startGame(),
    forceCompleteLevel: ()=>{ coinsState = coinsState.map(()=>false); coinsCollected = currentLevel().coins.length; onLevelComplete(); },
    getState: ()=>({ currentLevelIdx, lives, running, paused }),
  };
}

/* ---------- 10. Certificado ---------- */
function renderCertStep(wrap){
  if(!allDone()){
    const pendientes = STEPS.filter(s=>s.key!=='cert' && !progress[s.key]);
    const primerPendiente = pendientes[0];
    const listaPendientes = pendientes.map(s=>`<li>${s.label}</li>`).join('');
    wrap.innerHTML = `<h2>Certificado</h2>
      <p>Debe completar todas las actividades para desbloquear el certificado.</p>
      <p>Actividades pendientes:</p>
      <ul>${listaPendientes}</ul>
      ${renderRubricaTableLocal()}
      <button id="btnVolverPendiente" class="btn-primario">← Volver a mis actividades</button>`;
    document.getElementById('btnVolverPendiente').addEventListener('click', ()=>{
      showStep(primerPendiente ? primerPendiente.key : STEPS[0].key);
    });
    return;
  }
  wrap.innerHTML = `<h2>¡Curso completado!</h2>
    <p>Felicidades, ${studentName}. Ha finalizado todas las actividades de <strong>${CONFIG.titulo}</strong>.</p>
    ${renderRubricaTableLocal()}
    <button id="btnCert" class="btn-primario">Ver y descargar mi certificado</button>
    <div id="certContainer" class="cert-container" style="display:none">
      <div class="cert">
        <h2>Certificado de finalización</h2>
        <p class="cert-institucion">CTP Mercedes Norte — Especialidad de Contabilidad</p>
        <p class="cert-otorga">Se otorga el presente certificado a</p>
        <p class="cert-nombre">${studentName}</p>
        <p class="cert-curso">por completar satisfactoriamente el curso</p>
        <p class="cert-titulo-curso">${CONFIG.titulo}</p>
        <p class="cert-detalle">Duración estimada: 4 horas · Incluye: antología, evaluación objetiva, estudio de caso, gamificación y foro de discusión</p>
        <p class="cert-fecha">${new Date().toLocaleDateString('es-CR', {year:'numeric', month:'long', day:'numeric'})}</p>
        <p class="cert-docente">Prof. Gerardo González González</p>
      </div>
    </div>`;
  document.getElementById('btnCert').addEventListener('click', ()=>{
    document.getElementById('certContainer').style.display = 'block';
    document.body.classList.add('printing-cert');
    setTimeout(()=>{ window.print(); document.body.classList.remove('printing-cert'); }, 200);
  });
}

/* ---------- monitoreo de salida de pantalla ---------- */
function monitorSalidaPantalla(){

    if(document.hidden && studentName){
      sheetPost('Progreso', {
        Timestamp: new Date().toISOString(), Estudiante: studentName,
        Modulo: 'incidente_salida_pantalla_' + CONFIG.moduleId, Score:'salida', Total:'1'
      });
    }
  });
}

/* ---------- panel docente ---------- */
function openTeacherPanel(){
  const pin = prompt('PIN del panel docente:');
  if(pin !== TEACHER_PIN){ if(pin!==null) alert('PIN incorrecto.'); return; }
  const app = document.getElementById('app');
  app.innerHTML = `<h2>Panel docente — ${CONFIG.titulo}</h2>
    <button id="btnVolverPortada" class="btn-secundario">← Volver</button>
    <div id="listaEstudiantes">Cargando...</div>`;
  document.getElementById('btnVolverPortada').addEventListener('click', initModule);
  Promise.all([sheetGet('Progreso'), sheetGet('Casos')]).then(([prog, casos])=>{
    const pasoSuffix = '_paso';
    const incidentMod = 'incidente_salida_pantalla_' + MODULE_ID;
    const byStudent = {};
    prog.forEach(r=>{
      const mod = String(r.Modulo||'').trim();
      const name = r.Estudiante;
      if(!name) return;
      if(mod === incidentMod){
        byStudent[name] = byStudent[name] || {};
        byStudent[name].__salidas = (byStudent[name].__salidas||0) + 1;
        return;
      }
      if(!mod.startsWith(MODULE_ID)) return;
      byStudent[name] = byStudent[name] || {};
      if(mod === MODULE_ID){
        byStudent[name].__completo = true;
      } else if(mod.startsWith(MODULE_ID+'_') && mod.endsWith(pasoSuffix)){
        const stepKey = mod.slice(MODULE_ID.length+1, mod.length-pasoSuffix.length);
        byStudent[name][stepKey] = { score:Number(r.Score)||0, total:Number(r.Total)||1 };
      }
    });
    const nombres = Object.keys(byStudent).sort();
    const box = document.getElementById('listaEstudiantes');
    if(nombres.length===0){ box.innerHTML = '<p>Aún no hay estudiantes con avance guardado.</p>'; return; }
    const rubrica = getRubrica();
    const pctFor = (stepsMap, keys)=>{
      let sum=0,total=0,any=false;
      keys.forEach(k=>{ const x=stepsMap[k]; if(x){ sum+=x.score; total+=x.total; any=true; } });
      return any && total>0 ? Math.round((sum/total)*100) : null;
    };
    const levelCell = (pctVal)=>{
      const lvl = competencyLevel(pctVal);
      return `<span class="${lvl.cls}">${lvl.label}</span>`;
    };
    let html = '<p class="rubrica-nota">Nivel por indicador: 0–50% No logrado · 51–80% En proceso · 81–100% Logrado.</p>';
    html += '<table class="progress-table"><tr><th>Estudiante</th>' + rubrica.map(r=>`<th>${r.ra}</th>`).join('') + '<th>Curso completo</th><th>Salidas de pantalla</th><th>Caso</th><th>Acciones</th></tr>';
    nombres.forEach(n=>{
      const stepsMap = byStudent[n];
      const casoRow = casos.find(c=> String(c.CasoId).trim()===caseKey() && c.Nombre===n);
      const salidas = stepsMap.__salidas || 0;
      html += `<tr>
        <td>${n}</td>
        ${rubrica.map(r=> `<td class="center">${levelCell(pctFor(stepsMap, r.steps))}</td>`).join('')}
        <td class="center">${stepsMap.__completo ? '<span class="status-ok">✓ Completo</span>' : '<span class="status-pending">En curso</span>'}</td>
        <td class="center">${salidas>0 ? `<span class="status-bad">⚠ ${salidas}</span>` : '<span class="status-ok">0</span>'}</td>
        <td class="center">${casoRow ? `<button class="btn-secundario btn-ver-caso" data-n="${n}">Ver</button>` : '—'}</td>
        <td class="center"><button class="btn-secundario btn-repetir" data-n="${n}">🔄 Repetir</button></td>
      </tr>
      <tr id="detalle-row-${cssId(n)}" style="display:none"><td colspan="${rubrica.length+5}"><div class="docente-detalle">${casoRow ? casoRow.Texto : '(sin respuesta registrada)'}</div></td></tr>`;
    });
    html += '</table>';
    box.innerHTML = html;
    box.querySelectorAll('.btn-ver-caso').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const row = document.getElementById('detalle-row-'+cssId(btn.dataset.n));
        row.style.display = row.style.display==='none' ? 'table-row':'none';
      });
    });
    box.querySelectorAll('.btn-repetir').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const n = btn.dataset.n;
        if(!confirm(`¿Reiniciar el intento de ${n}? Podrá volver a realizar el curso.`)) return;
        Promise.all([
          sheetDelete('Progreso','Estudiante',n),
          sheetDelete('Casos','Nombre',n)
        ]).then(()=>{ alert('Intento reiniciado.'); openTeacherPanel(); });
      });
    });
  });
}
function cssId(s){ return String(s).replace(/[^a-zA-Z0-9]/g,'_'); }

document.addEventListener('DOMContentLoaded', initModule);
window.__engineExports = { generarSopa, buildCruciCellMap }; // para pruebas
})();

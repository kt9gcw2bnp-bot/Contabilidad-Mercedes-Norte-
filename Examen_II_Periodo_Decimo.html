   <div class="row" style="margin-top:12px"><button class="btn teal sm" id="cfSave">Guardar configuración</button><button class="btn sm ${a.habil?'coral':'gold'}" id="cfHab">${a.habil?'⏸ Deshabilitar el examen':'▶ Habilitar el examen'}</button><span class="mut">Estado: <b>${a.habil?'habilitado':'deshabilitado'}</b></span></div>
   <h3>Documentos</h3><div class="row"><button class="btn ghost sm" data-pdf="examen" data-ok="1">📄 Examen en PDF</button><button class="btn ghost sm" data-pdf="clave" data-ok="1">📄 Solucionario en PDF</button><button class="btn ghost sm" data-pdf="tabla">📄 Tabla de especificaciones en PDF</button></div>
   <h3>Entregas</h3><div class="row" style="margin-bottom:8px">${secs.map(s=>`<button class="btn sm ${s===PANEL.sec?'gold':'ghost'}" data-sec="${esc(s)}">${esc(s)}</button>`).join('')}<button class="btn teal sm" id="pCsv" style="margin-left:auto">Exportar CSV</button><button class="btn ghost sm" id="pRef">↻ Actualizar</button></div>
   <div class="scroll"><table class="tb"><tr><th>Estudiante</th><th>Sección</th><th>Estado</th><th class="c">Automático</th><th class="c">Final</th><th class="c">Calificación</th><th class="c">Salidas</th><th></th></tr>
   ${L.map(r=>{ const {c}=filaCalc(r); return `<tr><td>${esc(r.Estudiante)}<div class="mut">${esc(r.Cedula)}</div></td><td>${esc(r.Seccion)}</td><td>${r.Estado==='entregado'?'<span class="pill teal">entregado</span>':'<span class="pill gold">en curso</span>'} ${r.Revisado==='SI'?'<span class="pill">revalorado</span>':''}</td><td class="c">${c.auto}</td><td class="c"><b>${c.fin}</b> / ${TOTAL}</td><td class="c">${fmt2(nota(c.fin))}</td><td class="c">${+r.Incidentes||0}</td><td><button class="btn gold sm" data-rev="${esc(r.Clave)}">Revisar y revalorar</button> <button class="btn ghost sm" data-del="${esc(r.Clave)}">Reabrir</button></td></tr>`; }).join('')||`<tr><td colspan="8" class="mut">Sin entregas todavía.</td></tr>`}</table></div>
   <p class="mut">«Automático»: lo que calificó el sistema (en respuesta construida es una sugerencia por palabras clave). «Final»: incluye sus revaloraciones. «Reabrir» borra el intento para que el estudiante pueda hacer la prueba de nuevo.</p></div>
   <div class="card">${tablaResumenItems(L.filter(r=>r.Estado==='entregado'))}</div>`;
  const M=$('modalIn');
  $('pX').onclick=()=>$('modal').classList.remove('on');
  M.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{ PANEL.sec=b.dataset.sec; panelRender(); });
  $('pRef').onclick=async()=>{ PANEL.rows=await getEntregas(); panelRender(); };
  M.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>revisar(b.dataset.rev));
  M.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!b.dataset.arm){ b.dataset.arm=1; b.textContent='¿Confirmar?'; b.classList.add('coral'); return; } await delRow('Entregas','Clave',b.dataset.del); PANEL.rows=PANEL.rows.filter(r=>r.Clave!==b.dataset.del); toast('Intento borrado: el estudiante puede volver a hacer la prueba.'); panelRender(); });
  $('cfSave').onclick=async()=>{ const v={Periodo:$('cfPer').value.trim(),Fecha:$('cfFec').value.trim(),ValorPorcentual:$('cfVal').value.trim().replace('%',''),Duracion:$('cfDur').value.trim(),Secciones:$('cfSec').value.trim(),MostrarNotas:$('cfMos').value};
    for(const k of Object.keys(v)) await setCfg(k,v[k]); Object.assign(CFG,v); toast('Configuración guardada.'); panelRender(); };
  $('cfHab').onclick=async()=>{ const nv=a.habil?'NO':'SI'; await setCfg('Habilitado',nv); CFG.Habilitado=nv; toast(nv==='SI'?'Examen habilitado.':'Examen deshabilitado.'); panelRender(); };
  $('pCsv').onclick=()=>exportCsv(L);
  wirePdf(M); }
function tablaResumenItems(L){ if(!L.length) return '<h3 style="margin-top:0">Rendimiento por ítem</h3><p class="mut">Aparece cuando haya pruebas entregadas.</p>';
  return `<h3 style="margin-top:0">Rendimiento por ítem (puntaje final promedio)</h3><div class="scroll"><table class="tb"><tr><th>Ítem</th><th>Parte</th><th>RA</th><th class="c">Puntos</th><th class="c">Promedio</th><th class="c">% de logro</th></tr>${ITEMS.map(it=>{ const s=L.reduce((a,r)=>a+filaCalc(r).c.det[it.id][1],0)/L.length; return `<tr><td>${it.n}</td><td>${esc(X.partes[it.parte].num)}</td><td>${esc(it.ra)}</td><td class="c">${it.pts}</td><td class="c">${fmt2(s)}</td><td class="c">${Math.round(s/it.pts*100)} %</td></tr>`; }).join('')}</table></div>`; }
function respTexto(it,a){ if(a==null) return '(sin respuesta)';
  if(it.tipo==='su'){ return a!=null&&it.ops[a]!=null?it.ops[a].replace(/<[^>]+>/g,''):'(sin respuesta)'; }
  if(it.tipo==='corr'){ return it.filas.map((f,i)=>(i+1)+'. '+((it.opciones.find(o=>o.k===(a||[])[i])||{t:'—'}).t)+(a[i]===f.k?'  ✔':'  ✘ (correcta: '+it.opciones.find(o=>o.k===f.k).t+')')).join('\n'); }
  if(it.tipo==='rc') return (a||[]).map((x,i)=>(i+1)+'. '+(x||'—')).join('\n');
  if(it.tipo==='rr') return a||'(sin respuesta)';
  if(it.tipo==='ej') return it.pasos.map((p,i)=>String.fromCharCode(97+i)+') '+((a||{})['p'+i]||'—')+'   [esperado: '+(p.show||p.v)+']').join('\n')+'\n\nProcedimiento:\n'+((a||{}).proc||'—');
  return ''; }
function revisar(clave){ const r=PANEL.rows.find(x=>x.Clave===clave); if(!r) return; const {resp,aj}=filaCalc(r); const a=adm();
  const totalVivo=()=>{ let s=0; ITEMS.forEach(it=>{ const v=$('pt_'+it.id).value; s+=v===''?0:+v; }); $('rvTot').textContent=s; $('rvNota').textContent=fmt2(nota(s)); $('rvPorc').textContent=a.valor?fmt2(nota(s)*(+a.valor)/100)+' %':'—'; };
  $('modalIn').innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">Revaloración · ${esc(r.Estudiante)}</h2><span class="pill">${esc(r.Seccion)}</span><span class="pill ${+r.Incidentes?'coral':''}">Salidas de pantalla: ${+r.Incidentes||0}</span><button class="btn ghost sm" style="margin-left:auto" id="rvBack">← Volver</button></div>
   <p class="mut">Puede cambiar el puntaje de <b>cualquier ítem en todas las partes</b> (números enteros entre 0 y el valor del ítem). El valor sugerido es el automático; en respuesta construida verifique siempre la respuesta.</p>
   <div class="kpis"><div class="kpi"><div class="v"><span id="rvTot"></span> / ${TOTAL}</div><div class="t">Puntuación obtenida</div></div><div class="kpi"><div class="v" id="rvNota"></div><div class="t">Calificación</div></div><div class="kpi"><div class="v" id="rvPorc"></div><div class="t">Porcentaje obtenido (valor ${a.valor?esc(a.valor)+' %':'sin definir'})</div></div><div class="kpi"><div class="v">${calificar(resp,null).auto}</div><div class="t">Puntaje automático</div></div></div></div>`+
   X.partes.map(p=>`<div class="card"><h3 style="margin-top:0">${esc(p.num)} parte · ${esc(p.nombre)} (${p.pts} pts)</h3>${p.items.map(it=>{ const s=autoScore(it,resp[it.id]); const cur=aj[it.id]&&aj[it.id].p!=null&&aj[it.id].p!==''?aj[it.id].p:s;
     return `<div class="rev"><div class="row"><b>${it.n}.</b><span style="flex:1">${it.en.replace(/<[^>]+>/g,'').slice(0,160)}</span><span class="pill">${esc(it.ra)}</span>${esConstruida(it)?'<span class="pill gold">revisar</span>':''}</div>
      <div class="ans">${esc(respTexto(it,resp[it.id]))}</div>
      ${it.tipo==='su'?`<div class="mut">Correcta: ${it.ops[it.correcta].replace(/<[^>]+>/g,'')}</div>`:''}${it.modelo?`<div class="mut"><b>Respuesta esperada:</b> ${it.modelo}</div>`:''}${it.criterios?`<div class="mut"><b>Criterios:</b> ${it.criterios.map(c=>c.t+' ('+c.pts+')').join(' · ')}</div>`:''}
      <div class="row" style="margin-top:8px"><span class="mut">Automático: <b>${s}</b> / ${it.pts}</span><label class="mut" for="pt_${it.id}">Puntaje final:</label><input class="pt" type="number" min="0" max="${it.pts}" step="1" id="pt_${it.id}" value="${cur}"><span class="mut">/ ${it.pts}</span><input type="text" id="cm_${it.id}" value="${esc((aj[it.id]||{}).c||'')}" placeholder="Comentario (opcional)" style="flex:1;min-width:180px"></div></div>`; }).join('')}</div>`).join('')+
   `<div class="card"><div class="row"><button class="btn gold" id="rvSave">Guardar revaloración</button><span class="mut" id="rvMsg"></span></div></div>`;
  ITEMS.forEach(it=>{ const e=$('pt_'+it.id); e.oninput=()=>{ let v=e.value===''?'':Math.round(+e.value); if(v!==''&&(v<0||v>it.pts)) v=Math.max(0,Math.min(it.pts,v)); if(String(v)!==e.value) e.value=v; totalVivo(); }; });
  totalVivo(); $('rvBack').onclick=()=>panelRender();
  $('rvSave').onclick=async()=>{ const A={}; ITEMS.forEach(it=>{ const v=$('pt_'+it.id).value, c=$('cm_'+it.id).value.trim(); const s=autoScore(it,resp[it.id]); if((v!==''&&+v!==s)||c) A[it.id]={p:v===''?null:+v,c}; if(v!==''&&+v===s&&c) A[it.id].p=+v; });
    const c=calificar(resp,A); const n=nota(c.fin); const porc=a.valor?Math.round(n*(+a.valor))/100:'';
    const upd={Clave:r.Clave,Ajustes:JSON.stringify(A),PuntajeFinal:c.fin,Nota:n,Porcentaje:porc,Revisado:'SI',RevisadoEl:nowIso()};
    await post('Entregas','Clave',upd); Object.assign(r,upd); $('rvMsg').textContent='✓ Revaloración guardada: '+c.fin+' / '+TOTAL+' · calificación '+fmt2(n); toast('Revaloración guardada.'); };
}
function exportCsv(L){ const a=adm(); const head=['Estudiante','Cédula','Sección','Estado','Inicio','Entrega','Salidas'].concat(ITEMS.map(it=>'Ítem '+it.n+' ('+it.pts+')'),['Automático','Puntuación final','Total','Calificación','Porcentaje','Revisado']);
  const rows=[head]; L.forEach(r=>{ const {c}=filaCalc(r); const n=nota(c.fin); rows.push([r.Estudiante,r.Cedula,r.Seccion,r.Estado,r.Inicio,r.Entrega||'',+r.Incidentes||0].concat(ITEMS.map(it=>c.det[it.id][1]),[c.auto,c.fin,TOTAL,fmt2(n),a.valor?fmt2(n*(+a.valor)/100):'',r.Revisado||'NO'])); });
  const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const el=document.createElement('a'); el.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); el.download=X.id+'_'+PANEL.sec+'.csv'; document.body.appendChild(el); el.click(); el.remove(); }
$('lnkDoc').onclick=e=>{ e.preventDefault(); panel(); };
window.__EX={ITEMS,TOTAL,autoScore,calificar,mostrarPrint,X};
/* ====================== ARRANQUE ====================== */
(async()=>{ const pdf=qs.get('pdf'); if(pdf){ CFG=await getConfig(); $('hT').textContent=X.titulo; if(pdf==='tabla'||qs.get('pin')===PIN) mostrarPrint(pdf,true); document.body.classList.add('printing'); return; } portada(); })();
})();
</script>
</body>

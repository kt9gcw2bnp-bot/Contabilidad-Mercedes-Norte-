<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Contable · CTP Mercedes Norte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050506; --bg-panel:rgba(18,18,20,.78); --bg-card:rgba(24,24,27,.82);
  --gold:#C9973F; --gold-light:#F4DD7A;
  --teal:#2FC2AD; --coral:#EF6A5B;
  --ink:#EDEDED; --muted:#9AA0A6; --line:rgba(255,255,255,.09);
  --sans:'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono:'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}

/* ---------- fondo animado (libro contable) ---------- */
#bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block;}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 30% 40%, rgba(201,151,63,.10), transparent 55%),
             radial-gradient(ellipse at 85% 80%, rgba(47,194,173,.08), transparent 50%),
             radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.75) 100%);}
#app{position:relative;z-index:2;}

/* ============ PANTALLA DE INGRESO ============ */
.login-screen{min-height:100vh;display:grid;grid-template-columns:1.25fr 1fr;align-items:stretch;}
.hero{display:flex;flex-direction:column;justify-content:space-between;padding:48px 6vw 40px;}
.brand{display:flex;align-items:center;gap:14px;}
.brand img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;box-shadow:0 0 0 1px rgba(201,151,63,.5),0 8px 30px rgba(0,0,0,.6);}
.brand .b1{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--gold-light);text-transform:uppercase;}
.brand .b2{font-size:15px;font-weight:600;color:#fff;margin-top:2px;}
.hero-main h1{font-size:clamp(40px,5.6vw,84px);line-height:.98;margin:0;font-weight:700;letter-spacing:-1.5px;color:#fff;}
.hero-main h1 .g{background:linear-gradient(90deg,var(--gold-light),var(--gold) 60%,#a5762a);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-main .lead{font-size:clamp(14px,1.25vw,18px);color:#c7c9cc;max-width:560px;margin:18px 0 0;line-height:1.5;}
.equation{display:inline-flex;gap:10px;align-items:center;margin-top:22px;font-family:var(--mono);font-size:clamp(12px,1vw,14px);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 16px;background:rgba(0,0,0,.35);}
.equation b{color:var(--gold-light);font-weight:600;}
.equation .eq{color:var(--teal);}

/* asiento en vivo */
.ledger{margin-top:30px;max-width:620px;border:1px solid rgba(201,151,63,.35);border-radius:14px;background:rgba(8,8,10,.72);backdrop-filter:blur(6px);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55);}
.ledger-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-light);}
.ledger-head .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-right:8px;box-shadow:0 0 10px var(--teal);animation:pulse 1.6s infinite;}
@keyframes pulse{50%{opacity:.25}}
.ledger table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:clamp(11px,.95vw,13.5px);}
.ledger th{text-align:left;color:var(--muted);font-weight:500;padding:8px 16px;border-bottom:1px dashed var(--line);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;}
.ledger th.n,.ledger td.n{text-align:right;}
.ledger td{padding:7px 16px;color:#e8e8e8;white-space:nowrap;}
.ledger td.ind{padding-left:40px;color:#cfd2d6;}
.ledger td.glosa{color:var(--muted);font-style:italic;white-space:normal;}
.ledger tr.tot td{border-top:1px solid rgba(201,151,63,.45);color:var(--gold-light);font-weight:600;}
.ledger tr.row{animation:rowIn .45s ease both;}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ok-badge{color:var(--teal);font-weight:600;}
.hero-foot{display:flex;gap:26px;flex-wrap:wrap;margin-top:28px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.5px;}
.hero-foot span b{color:#fff;font-size:20px;font-family:var(--sans);display:block;letter-spacing:0;}

.login-side{display:flex;align-items:center;justify-content:center;padding:40px 5vw;background:linear-gradient(90deg,transparent,rgba(0,0,0,.55) 30%);}
.login-card{width:100%;max-width:440px;background:var(--bg-panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:38px 34px;box-shadow:0 30px 80px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.05);position:relative;overflow:hidden;}
.login-card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--teal),var(--gold));background-size:200% 100%;animation:slide 6s linear infinite;}
@keyframes slide{to{background-position:200% 0}}
.login-card .kicker{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-light);}
.login-card h2{font-size:28px;margin:8px 0 6px;color:#fff;font-weight:700;}
.login-card p{font-size:14px;color:var(--muted);margin:0 0 26px;line-height:1.5;}
.field{position:relative;margin-bottom:16px;}
.field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.field .ico{position:absolute;left:14px;bottom:14px;color:var(--gold);font-family:var(--mono);font-size:15px;}
.login-card input{width:100%;padding:15px 16px 15px 42px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:12px;font-size:18px;font-family:var(--mono);letter-spacing:3px;transition:border-color .2s, box-shadow .2s;}
.login-card input::placeholder{letter-spacing:1px;color:#5f6368;font-size:15px;}
.login-card input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,151,63,.18);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 24px;background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#0a0a0a;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;width:100%;font-family:var(--sans);letter-spacing:.3px;transition:transform .15s, box-shadow .2s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(201,151,63,.35);}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none;}
.btn .arrow{transition:transform .2s;}
.btn:hover .arrow{transform:translateX(4px);}
.login-note{display:flex;gap:10px;align-items:flex-start;margin-top:22px;padding-top:18px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted);line-height:1.5;}
.login-note .lk{color:var(--teal);font-family:var(--mono);}
.error-msg{color:var(--coral);font-size:13px;margin-top:12px;display:none;}
.error-msg.show{display:block;}
.loading-msg{color:var(--gold-light);font-size:12px;margin-top:12px;display:none;font-family:var(--mono);}
.loading-msg.show{display:block;}

/* ============ PORTAL (pantalla completa) ============ */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:14px 4vw;background:rgba(5,5,6,.78);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.topbar img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:10px;padding:3px;}
.topbar .t1{font-size:16px;font-weight:700;color:#fff;}
.topbar .t2{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.topbar .user{margin-left:auto;display:flex;align-items:center;gap:10px;}
.chip-user{font-family:var(--mono);font-size:11px;color:var(--gold-light);border:1px solid rgba(201,151,63,.45);border-radius:999px;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;}

.portal{padding:28px 4vw 70px;}
.welcome-card{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;background:linear-gradient(120deg,rgba(201,151,63,.16),rgba(24,24,27,.85) 45%,rgba(47,194,173,.10));border:1px solid rgba(201,151,63,.45);border-radius:18px;padding:26px 30px;backdrop-filter:blur(8px);}
.welcome-card .role-tag{font-family:var(--mono);font-size:11px;color:var(--gold-light);text-transform:uppercase;letter-spacing:2px;}
.welcome-card h2{margin:6px 0 4px;font-size:clamp(22px,2.4vw,34px);color:#fff;}
.welcome-card p{margin:0;font-size:14px;color:#c4c6c9;}
.welcome-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
.welcome-actions button{font-size:12.5px;padding:10px 16px;border-radius:10px;cursor:pointer;font-family:var(--sans);font-weight:600;}
.logout-btn{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;}
.logout-btn:hover{border-color:var(--coral);color:#ffb3a8;}
.admin-btn{background:rgba(201,151,63,.14);border:1px solid var(--gold);color:var(--gold-light);}
.admin-btn:hover{background:rgba(201,151,63,.25);}

.sat-card{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,rgba(47,194,173,.14),rgba(10,10,12,.9) 60%);border:1px solid rgba(47,194,173,.45);border-radius:16px;padding:18px 22px;margin-top:16px;text-decoration:none;color:#fff;transition:transform .15s, box-shadow .2s;}
.sat-card:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(47,194,173,.18);}
.sat-card .sat-icon{font-size:30px;flex-shrink:0;}
.sat-card .sat-title{font-size:16px;font-weight:700;margin:0 0 2px;}
.sat-card .sat-sub{font-size:12.5px;color:var(--muted);margin:0;}
.sat-card .sat-arrow{margin-left:auto;color:var(--teal);font-size:20px;}

.section-title{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--gold-light);margin:38px 0 14px;}
.section-title:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(201,151,63,.5),transparent);}
.level-heading{font-size:clamp(20px,2vw,28px);font-weight:700;color:#fff;margin:44px 0 0;padding-bottom:10px;border-bottom:2px solid var(--gold);display:flex;align-items:baseline;gap:12px;}
.level-heading:before{content:"NIVEL";font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--gold);}
.subarea-heading{grid-column:1/-1;font-size:14px;font-weight:600;color:#fff;margin:24px 0 12px;padding-left:12px;border-left:3px solid var(--teal);}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.course-card{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:104px;background:var(--bg-card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-decoration:none;color:var(--ink);overflow:hidden;transition:transform .15s, border-color .2s, box-shadow .2s;backdrop-filter:blur(6px);}
.course-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold);transition:background .2s;}
.course-card:after{content:"→";position:absolute;right:16px;bottom:12px;font-family:var(--mono);color:var(--gold);opacity:.0;transform:translateX(-6px);transition:all .2s;}
.course-card:hover{transform:translateY(-3px);border-color:rgba(201,151,63,.5);box-shadow:0 14px 34px rgba(0,0,0,.5);}
.course-card:hover:before{background:var(--teal);}
.course-card:hover:after{opacity:1;transform:none;}
.course-card .ctag{font-family:var(--mono);font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:1.5px;}
.course-card .ctitle{font-size:15px;font-weight:600;margin:6px 0 0;color:#fff;line-height:1.35;padding-right:18px;}
.course-card .cpending{font-size:11.5px;color:var(--coral);margin-top:6px;}
.empty-msg{text-align:center;color:var(--muted);font-size:14px;padding:40px 20px;background:var(--bg-card);border:1px dashed var(--line);border-radius:14px;margin-top:20px;}
.catalogo-error{background:#2a1512;border:1px solid var(--coral);color:#ffb3a8;font-size:13px;padding:12px 16px;border-radius:10px;margin-top:16px;}

/* panel docente (overlay) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto;z-index:50;backdrop-filter:blur(4px);}
.overlay-box{background:#121214;border:1px solid var(--line);border-radius:16px;max-width:760px;width:100%;padding:26px;}
.overlay-box h2{margin:0 0 4px;font-size:20px;color:#fff;}
.overlay-box .sub{font-size:13px;color:var(--muted);margin:0 0 18px;}
.overlay-close{float:right;background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;}
.overlay-box .level-heading{font-size:18px;margin:22px 0 10px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#1a1a1d;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;}
.toggle-row .trow-info{min-width:0;}
.toggle-row .trow-title{font-size:13.5px;color:#fff;font-weight:600;}
.toggle-row .trow-sub{font-size:11px;color:var(--muted);font-family:var(--mono);}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch-track{position:absolute;cursor:pointer;inset:0;background:#3a3a3a;border-radius:24px;transition:.2s;}
.switch-track:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;}
.switch input:checked + .switch-track{background:var(--teal);}
.switch input:checked + .switch-track:before{transform:translateX(20px);}

/* ---------- adaptable ---------- */
@media (max-width:980px){
  .login-screen{grid-template-columns:1fr;}
  .hero{padding:28px 20px 10px;}
  .hero-foot{display:none;}
  .login-side{padding:10px 16px 40px;background:none;}
  .welcome-card{grid-template-columns:1fr;}
  .welcome-actions{justify-content:flex-start;}
}
@media (max-width:600px){
  .ledger{display:none;}
  .hero-main h1{font-size:40px;}
  .login-card{padding:28px 22px;}
  .topbar .t2{display:none;}
  .chip-user{max-width:46vw;}
  .portal{padding:20px 16px 60px;}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>
<div id="app"></div>

<script>
/* ============================================================
   FONDO ANIMADO — "libro contable" en movimiento
   Hoja rayada que avanza, cifras que suben y una curva de
   resultados que se dibuja. Liviano (canvas) y se pausa si la
   pestaña no está visible o si el equipo pide menos movimiento.
   ============================================================ */
(function(){
  const cv = document.getElementById('bg'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,DPR=1, t=0, items=[], chart=[], chartX=0;
  const MONO = "'IBM Plex Mono', Menlo, Consolas, monospace";
  const WORDS = ['DEBE','HABER','ACTIVO','PASIVO','PATRIMONIO','IVA 13 %','Σ','=','BALANCE','DIARIO','MAYOR','CAJA','BANCOS','UTILIDAD','RENTA','D-104','TRIBU-CR','VAN','TIR','ASIENTO'];
  function money(){
    const n = Math.round(Math.random()*9800000+20000);
    return '₡ ' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ') + ',' + String(Math.floor(Math.random()*100)).padStart(2,'0');
  }
  function newItem(y){
    const isWord = Math.random()<.28;
    const r = Math.random();
    return { x: Math.random()*W, y: y!==undefined? y : H + 20 + Math.random()*H*0.3,
      txt: isWord ? WORDS[Math.floor(Math.random()*WORDS.length)] : money(),
      size: (isWord? 11 : 12) + Math.random()*(W>900? 9 : 4),
      sp: .15 + Math.random()*.45,
      col: r<.55 ? '201,151,63' : (r<.8 ? '47,194,173' : '230,230,230'),
      a: .05 + Math.random()*.16 };
  }
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
    const n = Math.round(Math.min(70, Math.max(24, W*H/26000)));
    items = Array.from({length:n}, ()=>newItem(Math.random()*H));
    resetChart();
  }
  function resetChart(){
    chart=[]; chartX=0; let v=.5;
    const pts = Math.max(30, Math.round(W/28));
    for(let i=0;i<=pts;i++){ v += (Math.random()-.42)*.09; v=Math.max(.15,Math.min(.9,v)); chart.push(v); }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    // 1) hoja rayada de libro contable
    const gap = 34, off = (t*0.25) % gap;
    ctx.lineWidth = 1;
    for(let y=-gap+ (gap-off); y<H; y+=gap){
      ctx.strokeStyle = 'rgba(255,255,255,0.035)';
      ctx.beginPath(); ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); ctx.stroke();
    }
    // columnas tipo Debe / Haber (doble línea)
    const cols = W>900 ? [0.08,0.62,0.78,0.92] : [0.12,0.88];
    cols.forEach((c,i)=>{
      const x = Math.round(W*c)+.5;
      ctx.strokeStyle = i===0 ? 'rgba(239,106,91,0.10)' : 'rgba(201,151,63,0.07)';
      ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x+4,0); ctx.lineTo(x+4,H); ctx.stroke();
    });
    // 2) cifras que suben
    items.forEach(it=>{
      it.y -= it.sp; 
      if(it.y < -30) Object.assign(it, newItem());
      const fade = Math.min(1, (H - it.y)/(H*0.25)) * Math.min(1, it.y/(H*0.25));
      ctx.font = it.size + 'px ' + MONO;
      ctx.fillStyle = 'rgba(' + it.col + ',' + (it.a*Math.max(0,fade)).toFixed(3) + ')';
      ctx.fillText(it.txt, it.x, it.y);
    });
    // 3) curva de resultados que se dibuja (parte baja)
    const base = H*0.86, amp = H*0.22, step = W/(chart.length-1);
    chartX = Math.min(chart.length-1, chartX + 0.06);
    const last = Math.floor(chartX);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(201,151,63,0.30)';
    ctx.beginPath();
    for(let i=0;i<=last;i++){ const x=i*step, y=base - chart[i]*amp; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    const fr = chartX-last, nx = Math.min(last+1, chart.length-1);
    const hx = (last+fr)*step, hy = base - (chart[last] + (chart[nx]-chart[last])*fr)*amp;
    ctx.lineTo(hx,hy); ctx.stroke();
    // relleno suave bajo la curva
    ctx.lineTo(hx, H); ctx.lineTo(0, H); ctx.closePath();
    const g = ctx.createLinearGradient(0, base-amp, 0, H);
    g.addColorStop(0,'rgba(201,151,63,0.07)'); g.addColorStop(1,'rgba(201,151,63,0)');
    ctx.fillStyle = g; ctx.fill();
    // punto brillante
    ctx.beginPath(); ctx.arc(hx,hy,3.2,0,Math.PI*2); ctx.fillStyle='rgba(244,221,122,0.9)'; ctx.fill();
    ctx.beginPath(); ctx.arc(hx,hy,10,0,Math.PI*2); ctx.fillStyle='rgba(244,221,122,0.12)'; ctx.fill();
    if(chartX >= chart.length-1){ t += 0; if(Math.random()<0.01) resetChart(); }
  }
  let raf=null;
  function loop(){ t++; draw(); raf = requestAnimationFrame(loop); }
  resize(); window.addEventListener('resize', resize);
  if(reduce){ chartX = chart.length-1; draw(); return; }
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ cancelAnimationFrame(raf); raf=null; } else if(!raf){ loop(); }
  });
  loop();
})();

</script>
<script>
/* ============================================================
   CONFIGURACIÓN
   - LOGIN: sigue usando Google Apps Script + Sheets (hoja "Usuarios_Portal").
   - CATÁLOGO (qué cursos existen, título, url, nivel): vive en catalogo.json,
     dentro de este mismo repositorio (se edita junto con el código).
   - ACTIVO/INACTIVO por curso: es lo único que ahora se puede cambiar en
     caliente desde el Panel Docente (botones), sin tocar código ni Sheets
     a mano. Se guarda en una hoja pequeña "CatalogoActivo" vía Apps Script.
   ============================================================ */
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbzMGf_Gpf6UWswFPSqEBMdq-93GxGkrURsT4jtO9Jaz8yT5gyMMtp1btlcDZjRCeuAb/exec";
const TEACHER_PIN = "9986";

function sheetsReady(){ return SHEET_API_URL && !SHEET_API_URL.startsWith('REEMPLAZAR'); }

let jsonpCounter = 0;
function jsonpRequest(url){
  return new Promise((resolve, reject)=>{
    const cbName = 'jsonp_cb_' + (jsonpCounter++) + '_' + Date.now();
    const script = document.createElement('script');
    let settled = false;
    const cleanup = ()=>{ delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); };
    window[cbName] = (data)=>{ settled = true; cleanup(); resolve(data); };
    script.onerror = ()=>{ if(!settled){ cleanup(); reject(new Error('Error de red (JSONP)')); } };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.body.appendChild(script);
    setTimeout(()=>{ if(!settled){ cleanup(); reject(new Error('Tiempo de espera agotado')); } }, 10000);
  });
}
async function apiGet(params){ return await jsonpRequest(SHEET_API_URL + '?' + params); }
function sheetGet(sheetName){
  return jsonpRequest(SHEET_API_URL + '?sheet=' + encodeURIComponent(sheetName)).then(d=> (d && d.rows) ? d.rows : []);
}
function sheetPost(sheetName, row){
  // Contrato JSON del doPost {sheet, row:[...]} con Content-Type text/plain (igual que engine.js)
  return fetch(SHEET_API_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ sheet: sheetName, row: Object.keys(row).map(k=>row[k]) }), keepalive:true });
}

async function loadCatalogo(){
  const resp = await fetch('catalogo.json', { cache: 'no-store' });
  if(!resp.ok) throw new Error('No se pudo leer catalogo.json (' + resp.status + ')');
  return await resp.json();
}

// Últimas anulaciones de Activo/Inactivo hechas desde el Panel Docente.
// Si un curso no tiene anulación, se usa el valor "Activo" que trae catalogo.json.
async function loadActivoOverrides(){
  try{
    const rows = await sheetGet('CatalogoActivo');
    const map = {};
    rows.forEach(r=>{
      const id = String(r.CursoId||'').trim();
      if(!id) return;
      map[id] = String(r.Activo||'').toUpperCase(); // el último renglón para ese Id gana
    });
    return map;
  }catch(e){ return {}; }
}
function efectivoActivo(row, overrides){
  const id = String(row.Id||'').trim();
  if(id && overrides.hasOwnProperty(id)) return overrides[id];
  return String(row.Activo||'').toUpperCase();
}

function escapeHtml(s){ return (s+"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

try{

}catch(e){}

/* Asientos de ejemplo que se "escriben" en el libro diario de la portada */
const LEDGER_ENTRIES = [
  { f:'01-mar', l:[['Bancos','2 500 000',''],['Capital social','','2 500 000']], g:'Aporte inicial de los socios' },
  { f:'05-mar', l:[['Inventario de mercadería','800 000',''],['IVA crédito fiscal','104 000',''],['Proveedores','','904 000']], g:'Compra a crédito + IVA 13 %' },
  { f:'12-mar', l:[['Cuentas por cobrar','452 000',''],['Ventas','','400 000'],['IVA por pagar','','52 000']], g:'Venta a crédito, factura electrónica 4.4' },
  { f:'31-mar', l:[['Gasto por depreciación','125 000',''],['Depreciación acumulada','','125 000']], g:'Depreciación mensual, línea recta' },
  { f:'31-mar', l:[['Gasto por salarios','900 000',''],['Retenciones por pagar CCSS','','97 470'],['Salarios por pagar','','802 530']], g:'Planilla de marzo (10,83 % obrero)' }
];
let ledgerTimer = null, ledgerIdx = 0;
function stopLedger(){ if(ledgerTimer){ clearTimeout(ledgerTimer); ledgerTimer = null; } }
function startLedger(){
  stopLedger();
  const body = document.getElementById('lgBody'); if(!body) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const toNum = s => Number(String(s).replace(/\s/g,'')) || 0;
  const fmt = n => n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  function show(){
    const e = LEDGER_ENTRIES[ledgerIdx % LEDGER_ENTRIES.length];
    const folio = document.getElementById('lgFolio'); if(folio) folio.textContent = 'Folio ' + String(ledgerIdx % LEDGER_ENTRIES.length + 1).padStart(3,'0');
    body.innerHTML = '';
    const rows = e.l.map((x,i)=>`<tr class="row" style="animation-delay:${reduce?0:i*0.55}s"><td>${i?'':e.f}</td><td class="${x[2]&&!x[1]?'ind':''}">${x[0]}</td><td class="n">${x[1]}</td><td class="n">${x[2]}</td></tr>`).join('');
    const d = e.l.reduce((s,x)=>s+toNum(x[1]),0), h = e.l.reduce((s,x)=>s+toNum(x[2]),0);
    const k = e.l.length;
    body.innerHTML = rows +
      `<tr class="row" style="animation-delay:${reduce?0:k*0.55}s"><td></td><td class="glosa" colspan="3">${e.g}</td></tr>` +
      `<tr class="row tot" style="animation-delay:${reduce?0:(k+1)*0.55}s"><td></td><td>Sumas iguales <span class="ok-badge">${d===h?'✓ cuadra':''}</span></td><td class="n">${fmt(d)}</td><td class="n">${fmt(h)}</td></tr>`;
    ledgerIdx++;
    if(!reduce) ledgerTimer = setTimeout(show, 5200);
  }
  show();
}

async function doLogin(){
  const cedula = document.getElementById('cedulaInput').value.trim();
  if(!cedula) return;
  if(!sheetsReady()){
    renderLogin('El portal todavía no está conectado a la hoja de usuarios (falta configurar SHEET_API_URL).');
    return;
  }
  document.getElementById('loadingMsg').classList.add('show');
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('loginBtn').disabled = true;
  try{
    const data = await apiGet('action=login&cedula=' + encodeURIComponent(cedula));
    if(!data.found){
      renderLogin('Cédula no encontrada. Consulte con su profesor.');
      return;
    }
    session = { cedula, nombre:data.nombre, nivel:data.nivel, seccion:data.seccion, rol:data.rol };
    sessionStorage.setItem('portal_session', JSON.stringify(session));
    renderPortal();
  }catch(e){
    renderLogin('No se pudo verificar la cédula. Intente de nuevo.');
  }
}

function logout(){
  session = null;
  sessionStorage.removeItem('portal_session');
  renderLogin();
}

async function renderPortal(){
  const isDocente = session.rol === 'Docente';
  const nombreParam = encodeURIComponent(session.nombre);
  stopLedger();
  appEl.innerHTML = `
    <header class="topbar">
      <img src="logo_ctp_mercedes_norte.jpg" alt="Escudo CTP Mercedes Norte">
      <div><div class="t1">Portal Contable</div><div class="t2">CTP Mercedes Norte · Especialidad de Contabilidad</div></div>
      <div class="user"><span class="chip-user">${escapeHtml(session.nombre)}</span></div>
    </header>
    <main class="portal">
    <div class="welcome-card">
      <div>
      <div class="role-tag">${isDocente ? 'Docente' : 'Estudiante · ' + escapeHtml(session.seccion||'')}</div>
      <h2>${escapeHtml(session.nombre)}</h2>
      <p>${isDocente ? 'Acceso a todos los niveles y paneles docentes.' : 'Nivel ' + escapeHtml(session.nivel||'') + '° — este es el programa de tu especialidad.'}</p>
      </div>
      <div class="welcome-actions">
        ${isDocente ? '<button class="admin-btn" id="adminBtn">⚙ Panel docente — habilitar temas</button>' : ''}
        <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
      </div>
    </div>
    <a class="sat-card" href="SAT_Profe_Gerardo.html?nombre=${nombreParam}" target="_blank">
      <div class="sat-icon">🏢</div>
      <div>
        <div class="sat-title">El SAT del Profe Gerardo</div>
        <div class="sat-sub">Simulador contable — creá tu empresa y llevá su contabilidad</div>
      </div>
      <div class="sat-arrow">→</div>
    </a>
    <div id="courseList"><div class="empty-msg">Cargando catálogo...</div></div>
    </main>
  `;
  document.getElementById('logoutBtn').addEventListener('click', logout);
  if(isDocente) document.getElementById('adminBtn').addEventListener('click', openAdminPanel);

  const listEl = document.getElementById('courseList');
  try{
    const [allRows, overrides] = await Promise.all([loadCatalogo(), loadActivoOverrides()]);
    window.__catalogoCache = allRows;
    window.__overridesCache = overrides;
    let rows = allRows.filter(r=> efectivoActivo(r, overrides) === 'SI');
    if(!isDocente) rows = rows.filter(r=> String(r.Nivel) === String(session.nivel));

    if(rows.length===0){
      listEl.innerHTML = '<div class="empty-msg">Todavía no hay materiales publicados para tu nivel. Consulta con tu profesor.</div>';
      return;
    }

    const levels = isDocente ? [...new Set(rows.map(r=>String(r.Nivel)))].sort() : [String(session.nivel)];

    let html = '';
    levels.forEach(lvl=>{
      const levelRows = rows.filter(r=>String(r.Nivel)===lvl);
      if(isDocente) html += `<div class="level-heading">${escapeHtml(lvl)}° año</div>`;

      const antologia = levelRows.filter(r=>r.Categoria==='Antologia' || r.Categoria==='Antología');
      const trabajos = levelRows.filter(r=>r.Categoria==='Trabajo en clase');
      const examenes = levelRows.filter(r=>r.Categoria==='Examen' || r.Categoria==='Tarea');
      const temas = levelRows.filter(r=>r.Categoria==='Tema' || r.Categoria==='Curso interactivo');

      if(antologia.length){
        html += `<div class="section-title">📚 Antología y material de consulta</div>`;
        const antSorted = antologia.slice().sort((a,b)=> (Number(a.Orden)||0) - (Number(b.Orden)||0));
        const byAntSubarea = {};
        antSorted.forEach(r=>{
          const sub = r.Subarea || 'General';
          byAntSubarea[sub] = byAntSubarea[sub] || [];
          byAntSubarea[sub].push(r);
        });
        Object.keys(byAntSubarea).forEach(sub=>{
          html += `<div class="subarea-heading">${escapeHtml(sub)}</div>`;
          html += '<div class="cards">' + byAntSubarea[sub].map(r=>renderCard(r)).join('') + '</div>';
        });
      }
      if(trabajos.length){
        html += `<div class="section-title">📝 Trabajos en clase</div>`;
        html += '<div class="cards">' + trabajos.map(r=>renderCard(r)).join('') + '</div>';
      }
      if(examenes.length){
        html += `<div class="section-title">🎯 Exámenes y tareas</div>`;
        html += '<div class="cards">' + examenes.map(r=>renderCard(r)).join('') + '</div>';
      }
      if(temas.length){
        html += `<div class="section-title">📖 Temas del programa</div>`;
        const bySubarea = {};
        temas.sort((a,b)=> (Number(a.Orden)||0) - (Number(b.Orden)||0));
        temas.forEach(r=>{
          const sub = r.Subarea || 'General';
          bySubarea[sub] = bySubarea[sub] || [];
          bySubarea[sub].push(r);
        });
        Object.keys(bySubarea).forEach(sub=>{
          html += `<div class="subarea-heading">${escapeHtml(sub)}</div>`;
          html += '<div class="cards">' + bySubarea[sub].map(r=>renderCard(r)).join('') + '</div>';
        });
      }
    });

    listEl.innerHTML = html;
  }catch(e){
    listEl.innerHTML = '<div class="catalogo-error">No se pudo cargar el catálogo (catalogo.json). Detalle: ' + escapeHtml(e.message) + '</div>';
  }
}

function renderCard(r){
  const cleanUrl = String(r.URL||'').trim();
  const pending = !cleanUrl || cleanUrl.toUpperCase().includes('PENDIENTE');
  const nombreParam = encodeURIComponent(session.nombre);
  const sep = cleanUrl.includes('?') ? '&' : '?';
  const href = pending ? '#' : (cleanUrl + sep + 'nombre=' + nombreParam);
  const catLabel = {'Tema':'Tema del programa','Curso interactivo':'Curso interactivo','Antologia':'Antología','Antología':'Antología','Trabajo en clase':'Trabajo en clase'}[r.Categoria] || r.Categoria || '';
  return `<a class="course-card" href="${pending?'#':href}" target="${pending?'_self':'_blank'}" onclick="${pending?'return false;':''}">
    <div class="ctag">${escapeHtml(catLabel)}</div>
    <div class="ctitle">${escapeHtml(r.Titulo||'')}</div>
    ${pending ? '<div class="cpending">Próximamente — todavía no está publicado</div>' : ''}
  </a>`;
}

/* ============================================================
   PANEL DOCENTE — habilitar/inhabilitar temas por nivel con botones
   ============================================================ */
function openAdminPanel(){
  const pin = window.prompt('PIN del panel docente:');
  if(pin !== TEACHER_PIN){
    if(pin !== null) window.alert('PIN incorrecto.');
    return;
  }
  renderAdminPanel();
}

function renderAdminPanel(){
  const allRows = window.__catalogoCache || [];
  const overrides = window.__overridesCache || {};
  const levels = [...new Set(allRows.map(r=>String(r.Nivel)))].sort();

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'adminOverlay';

  let rowsHtml = '';
  levels.forEach(lvl=>{
    rowsHtml += `<div class="level-heading" style="margin-top:18px;">Nivel ${escapeHtml(lvl)}°</div>`;
    allRows.filter(r=>String(r.Nivel)===lvl).forEach(r=>{
      const id = String(r.Id||'').trim();
      const activo = efectivoActivo(r, overrides) === 'SI';
      rowsHtml += `
        <div class="toggle-row" data-id="${escapeHtml(id)}">
          <div class="trow-info">
            <div class="trow-title">${escapeHtml(r.Titulo||'(sin título)')}</div>
            <div class="trow-sub">${escapeHtml(r.Subarea||r.Categoria||'')}</div>
          </div>
          <label class="switch">
            <input type="checkbox" ${activo?'checked':''} data-toggle-id="${escapeHtml(id)}">
            <span class="switch-track"></span>
          </label>
        </div>`;
    });
  });
  if(allRows.length===0){
    rowsHtml = '<div class="empty-msg">Todavía no hay cursos en el catálogo.</div>';
  }

  overlay.innerHTML = `
    <div class="overlay-box">
      <button class="overlay-close" id="closeAdmin">&times;</button>
      <h2>Panel docente</h2>
      <p class="sub">Active o inactive los temas que ven los estudiantes de cada nivel. Los cambios se guardan de inmediato.</p>
      ${rowsHtml}
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('closeAdmin').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });

  overlay.querySelectorAll('input[data-toggle-id]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const id = inp.getAttribute('data-toggle-id');
      const nuevoValor = inp.checked ? 'SI' : 'NO';
      inp.disabled = true;
      try{
        await sheetPost('CatalogoActivo', { CursoId: id, Activo: nuevoValor, Timestamp: new Date().toISOString() });
        window.__overridesCache[id] = nuevoValor;
      }catch(e){
        window.alert('No se pudo guardar el cambio. Intente de nuevo.');
        inp.checked = !inp.checked;
      }
      inp.disabled = false;
    });
  });
}

/* ============================================================
   INICIO
   ============================================================ */
if(session){ renderPortal(); } else { renderLogin(); }
</script>

.error-msg{color:var(--coral);font-size:12.5px;margin-top:6px;}

.opcion{display:block;padding:6px 0;cursor:pointer;font-size:13.5px;}

/* ---------- utilidades de red (mismo patrón ya usado en el resto de la plataforma) ---------- */
let jsonpCounter = 0;
function jsonpRequest(url){
  return new Promise((resolve, reject)=>{
    const cbName = 'jsonp_cb_' + (jsonpCounter++) + '_' + Date.now();
    const script = document.createElement('script');
    let settled = false;
    const cleanup = ()=>{ delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); };
    window[cbName] = (data)=>{ settled = true; cleanup(); resolve(data); };
    script.onerror = ()=>{ if(!settled){ cleanup(); reject(new Error('Error de red (JSONP)')); } };
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.body.appendChild(script);
    setTimeout(()=>{ if(!settled){ cleanup(); reject(new Error('Tiempo de espera agotado')); } }, 10000);
  });
}
function backendListo(){ return CONFIG.API_URL && !CONFIG.API_URL.startsWith('REEMPLAZAR'); }
async function conReintentos(fn, intentos=4){
  let ultimoError;
  for(let i=0;i<intentos;i++){
    try{ return await fn(); }
    catch(e){ ultimoError = e; await new Promise(r=>setTimeout(r, 500 * Math.pow(2,i))); }
  }
  throw ultimoError;
}
function sheetGet(sheetName){
  return conReintentos(()=> jsonpRequest(CONFIG.API_URL + '?sheet=' + encodeURIComponent(sheetName)).then(d=> (d&&d.rows)?d.rows:[]));
}
function getConfigRemota(){
  return conReintentos(()=> jsonpRequest(CONFIG.API_URL + '?action=getConfig').then(d=> (d&&d.value)?d.value:{}));
}
function sheetPost(sheetName, row, keyField){
  const body = new URLSearchParams();
  body.set('sheet', sheetName);
  if(keyField) body.set('keyField', keyField);
  Object.keys(row).forEach(k=>body.set(k, typeof row[k]==='object' ? JSON.stringify(row[k]) : row[k]));
  return conReintentos(()=> fetch(CONFIG.API_URL, { method:'POST', mode:'no-cors', body }));
}
function sheetDelete(sheetName, matchField, matchValue){
  const body = new URLSearchParams();
  body.set('action','delete'); body.set('sheet', sheetName); body.set('matchField', matchField); body.set('matchValue', matchValue);
  return conReintentos(()=> fetch(CONFIG.API_URL, { method:'POST', mode:'no-cors', body }));
}

/* ---------- cédula: comparar solo dígitos/letras, ignorando guiones y espacios ---------- */
function normalizarCedula(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

/* ---------- orden aleatorio determinístico por cédula (mismo orden si recarga, distinto entre estudiantes) ---------- */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function semillaDesde(texto){
  let h = 0;
  for(let i=0;i<texto.length;i++){ h = (h*31 + texto.charCodeAt(i)) | 0; }
  return h;
}
function mezclarConSemilla(arr, semilla){
  const rng = mulberry32(semilla);
  const copia = arr.slice();
  for(let i=copia.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [copia[i],copia[j]] = [copia[j],copia[i]];
  }
  return copia;
}

function escapeHtml(s){ return (s+"").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtFecha(iso){ try{ return new Date(iso).toLocaleString('es-CR'); }catch(e){ return iso; } }

/* ---------- estado ---------- */
const appEl = document.getElementById('app');
document.getElementById('hInstitucion').textContent = CONFIG.INSTITUCION;
document.getElementById('hAsignatura').textContent = CONFIG.ASIGNATURA + ' · ' + CONFIG.SUBAREA;

let estudiante = null;      // {cedula, nombre, seccion}
let respuestas = {};        // { preguntaId: valor }
let entregado = false;
let timerInterval = null;
let segundosRestantes = CONFIG.DURACION_MIN * 60;
let ordenPorParte = {};     // cache del orden mezclado por parte para este estudiante

function ordenParte(parte){
  if(!estudiante) return PREGUNTAS[parte.tipo];
  if(ordenPorParte[parte.id]) return ordenPorParte[parte.id];
  const base = PREGUNTAS[parte.tipo] || [];
  if(parte.tipo === 'SU' || parte.tipo === 'RC' || parte.tipo === 'C'){
    const semilla = semillaDesde(normalizarCedula(estudiante.cedula) + '_' + parte.id);
    ordenPorParte[parte.id] = mezclarConSemilla(base, semilla);
  } else {
    ordenPorParte[parte.id] = base; // ID/RR/RSC conservan el orden (numeración fija o contexto de caso)
  }
  return ordenPorParte[parte.id];
}

/* ============================================================
   PORTADA / LOGIN ESTUDIANTE
   ============================================================ */
function renderPortada(mensajeError){

    <div class="card">
      <h2>${escapeHtml(CONFIG.ASIGNATURA)}</h2>

      <label for="inpCedula">Confirme su número de cédula</label>
      <input type="text" id="inpCedula" placeholder="Con o sin guiones" autocomplete="off">
      <button class="btn" id="btnIniciar">Iniciar examen</button>
      <div class="error-msg" id="portadaError">${mensajeError||''}</div>
      <p class="muted" style="margin-top:16px;">Solo se puede entregar una vez. Si ya entregó antes, al ingresar verá directamente su resultado.</p>

    </div>
  `;
  document.getElementById('btnIniciar').addEventListener('click', intentarIniciar);
  document.getElementById('btnDocenteLink').addEventListener('click', renderLoginDocente);
}

async function intentarIniciar(){
  const cedulaSel = document.getElementById('selNombre').value;
  const cedulaEscrita = document.getElementById('inpCedula').value;
  const errEl = document.getElementById('portadaError');
  errEl.textContent = '';
  if(!cedulaSel){ errEl.textContent = 'Seleccione su nombre de la lista.'; return; }
  if(normalizarCedula(cedulaSel) !== normalizarCedula(cedulaEscrita)){
    errEl.textContent = 'La cédula no coincide con el nombre seleccionado.';
    return;
  }
  const persona = STUDENT_ROSTER.find(s=> s.cedula === cedulaSel);
  estudiante = { cedula: persona.cedula, nombre: persona.nombre, seccion: persona.seccion };

  // ¿ya entregó antes?
  if(backendListo()){
    try{
      const rows = await sheetGet('Entregas');
      const previa = rows.find(r=> normalizarCedula(r.Cedula) === normalizarCedula(estudiante.cedula));
      if(previa && String(previa.Entregado).toUpperCase()==='SI'){
        renderResultado(previa);
        return;
      }
      if(previa && previa.Respuestas){
        try{ respuestas = JSON.parse(previa.Respuestas); }catch(e){ respuestas = {}; }
      }
    }catch(e){ /* si el backend falla, se sigue en modo local para no bloquear al estudiante */ }
  }
  iniciarCronometro();
  renderExamen();
  activarAntiCopia();
}

/* ============================================================
   EXAMEN
   ============================================================ */
function renderExamen(){
  let html = `<div class="timer" id="timerBox">Tiempo restante: --:--</div>`;
  html += `<div class="card"><h2>Hoja de respuestas — ${escapeHtml(estudiante.nombre)}</h2><p class="muted">${escapeHtml(estudiante.seccion)} · Cédula ${escapeHtml(estudiante.cedula)}</p></div>`;

  SECCIONES_EXAMEN.forEach(parte=>{
    html += `<div class="card" data-parte="${parte.id}"><h2>${escapeHtml(parte.titulo)}</h2><p class="muted">${escapeHtml(parte.instrucciones)}</p>`;
    const preguntas = ordenParte(parte);
    preguntas.forEach((preg, idx)=>{ html += renderPregunta(parte, preg, idx+1); });
    html += `</div>`;
  });

  html += `<div class="card no-print" style="text-align:center;"><button class="btn btn-gold" id="btnEntregar">Entregar examen</button></div>`;
  appEl.innerHTML = html;
  actualizarTimerUI();
  cablearEventosRespuestas();
  document.getElementById('btnEntregar').addEventListener('click', ()=> confirmarEntrega(false));
}

function renderPregunta(parte, preg, numero){
  const guardado = respuestas[preg.id];
  if(parte.tipo === 'SU'){
    return `<div class="question"><div class="qhead">${numero}. ${escapeHtml(preg.text)} <span class="muted">(${preg.puntos} pts)</span></div>
      ${Object.keys(preg.options).map(k=>`
        <label class="opcion"><input type="radio" name="${preg.id}" value="${k}" data-pid="${preg.id}" ${guardado===k?'checked':''}> ${k}) ${escapeHtml(preg.options[k])}</label>
      `).join('')}</div>`;
  }
  if(parte.tipo === 'RC'){
    return `<div class="question"><div class="qhead">${numero}. ${escapeHtml(preg.text)} <span class="muted">(${preg.puntos} pts)</span></div>
      <input type="text" data-pid="${preg.id}" value="${escapeHtml(guardado||'')}"></div>`;
  }
  if(parte.tipo === 'ID'){
    return `<div class="question"><div class="qhead">${numero}. ${escapeHtml(preg.titulo)} <span class="muted">(${preg.puntos} pts c/u)</span></div>
      <p class="muted">${escapeHtml(preg.contexto||'')}</p>
      ${preg.items.map(it=>`<label>Número ${it.numero}</label><input type="text" data-pid="${preg.id}__${it.numero}" value="${escapeHtml(respuestas[preg.id+'__'+it.numero]||'')}">`).join('')}
      </div>`;
  }
  if(parte.tipo === 'RR'){
    return `<div class="question"><div class="qhead">${numero}. ${escapeHtml(preg.text)} <span class="muted">(${preg.puntos} pts)</span></div>
      <textarea data-pid="${preg.id}">${escapeHtml(guardado||'')}</textarea></div>`;
  }
  if(parte.tipo === 'RSC'){
    return `<div class="question"><div class="qhead">${numero}. Caso <span class="muted">(${preg.puntos} pts)</span></div>
      <p class="detalle-resp">${escapeHtml(preg.caso)}</p>
      ${preg.preguntas.map(sp=>`<p><strong>${escapeHtml(sp.text)}</strong> <span class="muted">(${sp.puntos} pts)</span></p><textarea data-pid="${preg.id}__${sp.id}">${escapeHtml(respuestas[preg.id+'__'+sp.id]||'')}</textarea>`).join('')}
      </div>`;
  }
  if(parte.tipo === 'C'){
    return `<div class="question" data-corresp="${preg.id}"><div class="qhead">${numero}. Relacione <span class="muted">(${preg.puntos} pts)</span></div>
      ${preg.izquierda.map(iz=>`
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
          <span style="min-width:180px;">${escapeHtml(iz.text)}</span>
          <select data-pid="${preg.id}__${iz.id}" data-corresp-select="${preg.id}">
            <option value="">—</option>
            ${preg.derecha.map(d=>`<option value="${d.id}" ${respuestas[preg.id+'__'+iz.id]===d.id?'selected':''}>${escapeHtml(d.text)}</option>`).join('')}
          </select>
        </div>`).join('')}
      </div>`;
  }
  return '';
}

function cablearEventosRespuestas(){
  appEl.querySelectorAll('[data-pid]').forEach(el=>{
    const ev = (el.tagName==='SELECT' || el.type==='radio') ? 'change' : 'input';
    el.addEventListener(ev, ()=>{
      const pid = el.getAttribute('data-pid');
      const val = el.type === 'radio' ? (el.checked ? el.value : respuestas[pid]) : el.value;
      respuestas[pid] = val;
      if(el.hasAttribute('data-corresp-select')) actualizarOpcionesUsadas(el.getAttribute('data-corresp-select'));
      guardarProgreso();
    });
  });
}

// Apareamiento: ocultar en los demás selectores las opciones ya usadas
function actualizarOpcionesUsadas(corrId){
  const selects = appEl.querySelectorAll(`select[data-corresp-select="${corrId}"]`);
  const usados = new Set();
  selects.forEach(s=>{ if(s.value) usados.add(s.value); });
  selects.forEach(s=>{
    const valorActual = s.value;
    Array.from(s.options).forEach(opt=>{
      if(!opt.value) return;
      opt.hidden = usados.has(opt.value) && opt.value !== valorActual;
    });
  });
}

let guardando = false, pendienteGuardar = false;
async function guardarProgreso(){
  if(!backendListo() || entregado) return;
  if(guardando){ pendienteGuardar = true; return; }
  guardando = true;
  try{
    await sheetPost('Entregas', {
      Cedula: estudiante.cedula, Nombre: estudiante.nombre, Seccion: estudiante.seccion,
      Respuestas: JSON.stringify(respuestas), Entregado: 'NO', Timestamp: new Date().toISOString()
    }, 'Cedula');
  }catch(e){ /* el autoguardado reintenta solo; un fallo puntual no debe interrumpir al estudiante */ }
  guardando = false;
  if(pendienteGuardar){ pendienteGuardar = false; guardarProgreso(); }
}

/* ---------- cronómetro ---------- */
function iniciarCronometro(){
  timerInterval = setInterval(()=>{
    segundosRestantes--;
    actualizarTimerUI();
    if(segundosRestantes<=0){ clearInterval(timerInterval); confirmarEntrega(true); }
  }, 1000);
}
function actualizarTimerUI(){
  const box = document.getElementById('timerBox');
  if(!box) return;
  const m = Math.max(0,Math.floor(segundosRestantes/60));
  const s = Math.max(0,segundosRestantes%60);
  box.textContent = 'Tiempo restante: ' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  box.classList.toggle('low', segundosRestantes <= 300);
}

/* ---------- anti-copia: dos detectores, nunca entrega automática salvo vencimiento real ---------- */
let avisoActivo = false;
function activarAntiCopia(){
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) mostrarAvisoSalida(); });
  let blurTimeout = null;
  window.addEventListener('blur', ()=>{
    blurTimeout = setTimeout(()=>{ if(!document.hasFocus()) mostrarAvisoSalida(); }, 350);
  });
  window.addEventListener('focus', ()=>{ if(blurTimeout) clearTimeout(blurTimeout); });
}
function mostrarAvisoSalida(){
  if(avisoActivo || entregado) return;
  avisoActivo = true;
  registrarIncidente();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="overlay-box">
    <h2>Se detectó un cambio de pantalla</h2>
    <p class="muted">¿Desea finalizar el examen aquí mismo?</p>
    <button class="btn btn-gold" id="avisoSi" style="margin:6px;">Sí, finalizar</button>
    <button class="btn btn-outline" id="avisoNo" style="margin:6px;">No, continuar</button>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('avisoSi').addEventListener('click', ()=>{ overlay.remove(); avisoActivo=false; confirmarEntrega(true); });
  document.getElementById('avisoNo').addEventListener('click', ()=>{ overlay.remove(); avisoActivo=false; });
}
let incidentes = 0;
function registrarIncidente(){
  incidentes++;
  if(backendListo() && estudiante){
    sheetPost('Entregas', { Cedula: estudiante.cedula, Incidentes: incidentes }, 'Cedula').catch(()=>{});
  }
}

/* ---------- calificación automática ---------- */
function calificarAutomatico(){
  const desglose = {};
  let totalAuto = 0, totalPendiente = 0;

  (PREGUNTAS.SU||[]).forEach(p=>{ const ok = respuestas[p.id]===p.correct; desglose[p.id]={puntos: ok?p.puntos:0, max:p.puntos, auto:true}; totalAuto += ok?p.puntos:0; });
  (PREGUNTAS.RC||[]).forEach(p=>{
    const val = String(respuestas[p.id]||'').trim().toLowerCase();
    const ok = (p.validas||[]).some(v=> v.trim().toLowerCase()===val);
    desglose[p.id]={puntos: ok?p.puntos:0, max:p.puntos, auto:true}; totalAuto += ok?p.puntos:0;
  });
  (PREGUNTAS.C||[]).forEach(p=>{
    let correctos=0; const totalItems = p.izquierda.length;
    p.izquierda.forEach(iz=>{ if(respuestas[p.id+'__'+iz.id] === p.correcto[iz.id]) correctos++; });
    const pts = Math.round((correctos/totalItems)*p.puntos*100)/100;
    desglose[p.id]={puntos: pts, max:p.puntos, auto:true}; totalAuto += pts;
  });
  (PREGUNTAS.ID||[]).forEach(p=>{
    let correctos=0;
    p.items.forEach(it=>{
      const val = String(respuestas[p.id+'__'+it.numero]||'').trim().toLowerCase();
      if((it.validas||[]).some(v=>v.trim().toLowerCase()===val)) correctos++;
    });
    const pts = Math.round((correctos/p.items.length)*p.puntos*100)/100;
    desglose[p.id]={puntos: pts, max:p.puntos, auto:true}; totalAuto += pts;
  });
  (PREGUNTAS.RR||[]).forEach(p=>{ desglose[p.id]={puntos:0, max:p.puntos, auto:false}; totalPendiente += p.puntos; });
  (PREGUNTAS.RSC||[]).forEach(p=>{ desglose[p.id]={puntos:0, max:p.puntos, auto:false}; totalPendiente += p.puntos; });

  return { desglose, totalAuto, totalPendiente, requiereRevision: totalPendiente>0 };
}

async function confirmarEntrega(forzado){
  if(entregado) return;
  if(!forzado){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="overlay-box"><h2>¿Entregar el examen?</h2><p class="muted">No podrá modificar sus respuestas después de entregar.</p>
      <button class="btn btn-gold" id="entSi" style="margin:6px;">Sí, entregar</button>
      <button class="btn btn-outline" id="entNo" style="margin:6px;">No, seguir</button></div>`;
    document.body.appendChild(overlay);
    document.getElementById('entNo').addEventListener('click', ()=> overlay.remove());
    document.getElementById('entSi').addEventListener('click', ()=>{ overlay.remove(); entregarAhora(); });
    return;
  }
  entregarAhora();
}

async function entregarAhora(){
  entregado = true;
  clearInterval(timerInterval);
  const cal = calificarAutomatico();
  const btn = document.getElementById('btnEntregar');
  if(btn){ btn.disabled = true; btn.textContent = 'Enviando…'; }

  const registro = {
    Cedula: estudiante.cedula, Nombre: estudiante.nombre, Seccion: estudiante.seccion,
    Respuestas: JSON.stringify(respuestas), Desglose: JSON.stringify(cal.desglose),
    NotaTotal: cal.totalAuto, PendienteRevision: cal.requiereRevision?'SI':'NO',
    Entregado: 'SI', Incidentes: incidentes, Timestamp: new Date().toISOString()
  };

  if(backendListo()){
    try{
      await sheetPost('Entregas', registro, 'Cedula');
      const rows = await sheetGet('Entregas');
      const confirmado = rows.find(r=> normalizarCedula(r.Cedula)===normalizarCedula(estudiante.cedula) && String(r.Entregado).toUpperCase()==='SI');
      if(confirmado){ renderResultado(confirmado); return; }
      alert('No se pudo confirmar la entrega en el servidor. No cierre la ventana; avise a la persona docente.');
    }catch(e){
      alert('No se pudo confirmar la entrega en el servidor. No cierre la ventana; avise a la persona docente.');
    }
  } else {
    renderResultado(registro);
  }
}

function renderResultado(registro){
  const pendiente = String(registro.PendienteRevision).toUpperCase()==='SI';
  appEl.innerHTML = `<div class="card">
    <h2>Examen entregado</h2>
    <p><strong>${escapeHtml(registro.Nombre)}</strong> · ${escapeHtml(registro.Seccion)}</p>
    ${pendiente
      ? `<p class="pill pill-warn">Pendiente de revisión</p><p class="muted">Su examen incluye partes de calificación manual. La nota final se publicará cuando la persona docente termine de revisarlas.</p>`
      : `<p style="font-size:32px;font-weight:800;color:var(--navy-deep);">${registro.NotaTotal} / ${CONFIG.PUNTUACION_TOTAL}</p>`}
    <button class="btn btn-outline no-print" id="btnDescargar">Descargar copia de mis respuestas</button>
  </div>`;
  document.getElementById('btnDescargar').addEventListener('click', ()=> descargarCopia(registro));
}

function descargarCopia(registro){
  let texto = `${CONFIG.ASIGNATURA} — ${CONFIG.SUBAREA}\nEstudiante: ${registro.Nombre}\nSección: ${registro.Seccion}\nFecha: ${fmtFecha(registro.Timestamp)}\n\n`;
  let resp = {};
  try{ resp = JSON.parse(registro.Respuestas||'{}'); }catch(e){}
  Object.keys(resp).forEach(k=>{ texto += `${k}: ${resp[k]}\n`; });
  if(!String(registro.PendienteRevision).toUpperCase().includes('SI')) texto += `\nNota: ${registro.NotaTotal} / ${CONFIG.PUNTUACION_TOTAL}\n`;
  const blob = new Blob([texto], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'examen_' + registro.Nombre.replace(/\s+/g,'_') + '.txt';
  a.click();
}

    <label for="inpCodigo">Código de acceso</label>
    <input type="text" id="inpCodigo">

let vistaPrevia = false;
async function renderPanelDocente(){
  appEl.innerHTML = `<div class="card"><h2>Panel docente</h2><p class="muted">Cargando…</p></div>`;

  let habilitado = 'SI', entregas = [];
  if(backendListo()){
    try{ const cfg = await getConfigRemota(); habilitado = cfg.Habilitado || 'SI'; }catch(e){}
    try{ entregas = await sheetGet('Entregas'); }catch(e){}
  }

  let html = `<div class="card">
    <h2>Panel docente</h2>
    <p class="muted">${escapeHtml(CONFIG.ASIGNATURA)} · ${escapeHtml(CONFIG.DOCENTE)}</p>
    <div style="display:flex;align-items:center;gap:10px;margin:10px 0;">
      <label class="switch"><input type="checkbox" id="toggleHabilitado" ${habilitado==='SI'?'checked':''}><span class="switch-track"></span></label>
      <span>Examen habilitado para el grupo</span>
    </div>
    <button class="btn btn-outline btn-sm" id="btnVistaPrevia">Vista previa del examen</button>
    <button class="btn btn-outline btn-sm" id="btnClave">Ver clave de respuestas</button>
    <button class="btn btn-outline btn-sm" id="btnEspecificaciones">Tabla de especificaciones</button>
    <button class="btn btn-outline btn-sm" id="btnExportar">Exportar CSV</button>
    <button class="btn btn-outline btn-sm" id="btnImprimir">Imprimir versión en blanco (PDF)</button>
  </div>`;

  html += `<div class="card"><h2>Entregas (${entregas.length})</h2><table class="tabla-admin"><thead><tr>
      <th>Nombre</th><th>Sección</th><th>Nota</th><th>Estado</th><th>Incidentes</th><th></th></tr></thead><tbody>`;
  entregas.forEach(r=>{
    const pendiente = String(r.PendienteRevision).toUpperCase()==='SI';
    const entregadoFlag = String(r.Entregado).toUpperCase()==='SI';
    html += `<tr data-cedula="${escapeHtml(r.Cedula)}">
      <td>${escapeHtml(r.Nombre)}</td><td>${escapeHtml(r.Seccion)}</td>
      <td>${entregadoFlag ? escapeHtml(String(r.NotaTotal)) : '—'}</td>
      <td>${entregadoFlag ? (pendiente?'<span class="pill pill-warn">Pendiente revisión</span>':'<span class="pill pill-ok">Completo</span>') : '<span class="pill pill-warn">En progreso</span>'}</td>
      <td>${Number(r.Incidentes)||0}</td>
      <td><button class="btn btn-outline btn-sm ver-detalle">Ver</button> <button class="btn btn-outline btn-sm eliminar-entrega">Eliminar</button></td>
    </tr><tr class="fila-detalle" data-detalle-de="${escapeHtml(r.Cedula)}" style="display:none;"><td colspan="6"></td></tr>`;
  });
  html += `</tbody></table></div>`;

  appEl.innerHTML = html;

  document.getElementById('toggleHabilitado').addEventListener('change', async (e)=>{
    if(backendListo()) await sheetPost('Config', { Clave:'Habilitado', Valor: e.target.checked?'SI':'NO' }, 'Clave');
  });
  document.getElementById('btnVistaPrevia').addEventListener('click', ()=>{ vistaPrevia = true; entregado = false; estudiante = { cedula:'PREVIEW', nombre:'Vista previa (docente)', seccion:'—' }; segundosRestantes = CONFIG.DURACION_MIN*60; renderExamen(); });
  document.getElementById('btnClave').addEventListener('click', mostrarClave);
  document.getElementById('btnEspecificaciones').addEventListener('click', mostrarEspecificaciones);
  document.getElementById('btnExportar').addEventListener('click', ()=> exportarCSV(entregas));
  document.getElementById('btnImprimir').addEventListener('click', ()=> window.print());

  appEl.querySelectorAll('.ver-detalle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cedula = btn.closest('tr').getAttribute('data-cedula');
      const registro = entregas.find(r=>r.Cedula===cedula);
      const fila = appEl.querySelector(`.fila-detalle[data-detalle-de="${CSS.escape(cedula)}"] td`);
      if(fila.innerHTML){ fila.innerHTML=''; fila.closest('tr').style.display='none'; return; }
      fila.innerHTML = renderDetalleEntrega(registro);
      fila.closest('tr').style.display='';
      cablearEdicionPuntos(fila, registro);
    });
  });
  appEl.querySelectorAll('.eliminar-entrega').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const cedula = btn.closest('tr').getAttribute('data-cedula');
      if(!confirm('¿Eliminar esta entrega? La persona podrá presentar el examen de nuevo.')) return;
      if(backendListo()) await sheetDelete('Entregas','Cedula',cedula);
      renderPanelDocente();
    });
  });
}

function renderDetalleEntrega(registro){
  let resp = {}, desglose = {};
  try{ resp = JSON.parse(registro.Respuestas||'{}'); }catch(e){}
  try{ desglose = JSON.parse(registro.Desglose||'{}'); }catch(e){}
  let html = '<div class="detalle-resp">';
  Object.keys(desglose).forEach(pid=>{
    const d = desglose[pid];
    html += `<div style="margin-bottom:8px;">
      <strong>${escapeHtml(pid)}</strong> — ${d.auto ? (d.puntos>0?'<span class="pill pill-ok">Correcto</span>':'<span class="pill pill-bad">Incorrecto</span>') : '<span class="pill pill-warn">Manual</span>'}
      <div class="puntos-edit">
        <button data-menos="${escapeHtml(pid)}">−</button>
        <input type="number" step="0.5" min="0" max="${d.max}" value="${d.puntos}" data-puntos-pid="${escapeHtml(pid)}">
        <button data-mas="${escapeHtml(pid)}">+</button>
        <span class="muted">/ ${d.max}</span>
      </div>
    </div>`;
  });
  html += `<button class="btn btn-sm" id="btnGuardarPuntos" data-cedula="${escapeHtml(registro.Cedula)}">Guardar cambios</button></div>`;
  return html;
}

function cablearEdicionPuntos(fila, registro){
  fila.querySelectorAll('[data-mas]').forEach(b=> b.addEventListener('click', ()=>{
    const inp = fila.querySelector(`input[data-puntos-pid="${CSS.escape(b.getAttribute('data-mas'))}"]`);
    inp.value = (parseFloat(inp.value)||0) + 0.5;
  }));
  fila.querySelectorAll('[data-menos]').forEach(b=> b.addEventListener('click', ()=>{
    const inp = fila.querySelector(`input[data-puntos-pid="${CSS.escape(b.getAttribute('data-menos'))}"]`);
    inp.value = Math.max(0, (parseFloat(inp.value)||0) - 0.5);
  }));
  const btnGuardar = fila.querySelector('#btnGuardarPuntos');
  if(btnGuardar) btnGuardar.addEventListener('click', async ()=>{
    let desglose = {};
    try{ desglose = JSON.parse(registro.Desglose||'{}'); }catch(e){}
    fila.querySelectorAll('[data-puntos-pid]').forEach(inp=>{
      const pid = inp.getAttribute('data-puntos-pid');
      desglose[pid].puntos = parseFloat(inp.value)||0;
    });
    const nuevaNota = Object.values(desglose).reduce((s,d)=> s + (parseFloat(d.puntos)||0), 0);
    btnGuardar.disabled = true; btnGuardar.textContent = 'Guardando…';
    if(backendListo()) await sheetPost('Entregas', { Cedula: registro.Cedula, Desglose: JSON.stringify(desglose), NotaTotal: nuevaNota, PendienteRevision:'NO' }, 'Cedula');
    renderPanelDocente();
  });
}

function mostrarClave(){
  let html = '<div class="card"><h2>Clave de respuestas</h2>';
  (PREGUNTAS.SU||[]).forEach(p=> html += `<p><strong>${p.id}</strong>: ${p.correct}</p>`);
  (PREGUNTAS.RC||[]).forEach(p=> html += `<p><strong>${p.id}</strong>: ${p.validas.join(' / ')}</p>`);
  (PREGUNTAS.C||[]).forEach(p=> html += `<p><strong>${p.id}</strong>: ${Object.keys(p.correcto).map(k=>k+'→'+p.correcto[k]).join(', ')}</p>`);
  (PREGUNTAS.ID||[]).forEach(p=> html += `<p><strong>${p.id}</strong>: ${p.items.map(i=>i.numero+'='+i.validas.join('/')).join(', ')}</p>`);
  html += `<button class="btn btn-outline btn-sm" id="btnVolverPanel">Volver al panel</button></div>`;
  appEl.innerHTML = html;
  document.getElementById('btnVolverPanel').addEventListener('click', renderPanelDocente);
}

function mostrarEspecificaciones(){
  const temas = Object.keys(CONFIG.ESPECIFICACIONES_LECCIONES);
  const puntosPorTema = {};
  Object.values(PREGUNTAS).flat().forEach(p=>{ puntosPorTema[p.tema] = (puntosPorTema[p.tema]||0) + p.puntos; });
  let html = '<div class="card"><h2>Tabla de especificaciones</h2><table class="tabla-admin"><thead><tr><th>Tema</th><th>Lecciones</th><th>Puntos</th></tr></thead><tbody>';
  temas.forEach(t=> html += `<tr><td>${escapeHtml(t)}</td><td><input type="number" data-tema-lecciones="${escapeHtml(t)}" value="${CONFIG.ESPECIFICACIONES_LECCIONES[t]}" style="width:70px;margin:0;"></td><td>${puntosPorTema[t]||0}</td></tr>`);
  html += `</tbody></table><button class="btn btn-sm" id="btnGuardarEspec" style="margin-top:10px;">Guardar</button> <button class="btn btn-outline btn-sm" id="btnVolverPanel2">Volver</button></div>`;
  appEl.innerHTML = html;
  document.getElementById('btnVolverPanel2').addEventListener('click', renderPanelDocente);
  document.getElementById('btnGuardarEspec').addEventListener('click', async ()=>{
    const nueva = {};
    appEl.querySelectorAll('[data-tema-lecciones]').forEach(inp=> nueva[inp.getAttribute('data-tema-lecciones')] = Number(inp.value)||0);
    Object.assign(CONFIG.ESPECIFICACIONES_LECCIONES, nueva);
    if(backendListo()) await sheetPost('Config', { Clave:'Especificaciones', Valor: JSON.stringify(CONFIG.ESPECIFICACIONES_LECCIONES) }, 'Clave');
    renderPanelDocente();
  });
}

function exportarCSV(entregas){
  const encabezados = ['Nombre','Seccion','Cedula','NotaTotal','PendienteRevision','Incidentes','Timestamp'];
  let csv = encabezados.join(',') + '\n';
  entregas.forEach(r=>{ csv += encabezados.map(h=> '"'+String(r[h]||'').replace(/"/g,'""')+'"').join(',') + '\n'; });
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'entregas_' + CONFIG.ASIGNATURA.replace(/\s+/g,'_') + '.csv';
  a.click();
}
